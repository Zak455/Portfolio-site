 ${396-t%2*10-t*1.5}a5 5 0 1 1 8 0`,stroke:"#0A0806",strokeWidth:"2.4",fill:"none"},t)),(0,Y.jsx)("path",{d:"M140 380q60 20 120 0",stroke:"#0A0806",strokeWidth:"8",fill:"none"}),(0,Y.jsx)("circle",{cx:"196",cy:"378",r:"6",fill:"#B91C1C",opacity:".7",className:"hm-flicker"}),(0,Y.jsx)("path",{d:"M360 372q30-12 70-6l46 6q8 6 0 10l-110 4q-14-4-6-14z",fill:"#991B1B",opacity:".85"}),(0,Y.jsx)("path",{d:"M372 374h90",stroke:"#E5E7EB",strokeOpacity:".5",strokeWidth:"1"}),(0,Y.jsx)("ellipse",{cx:"356",cy:"374",rx:"10",ry:"8",fill:"#D8B8A0"}),(0,Y.jsx)("path",{d:"M364 376h8",stroke:"#7F1D1D",strokeWidth:"2.4"}),(0,Y.jsx)("circle",{cx:"506",cy:"350",r:"40",fill:"url(#w6flame)",className:"hm-candle"}),(0,Y.jsx)("path",{d:"M494 350q12-20 24 0q2 14-12 14t-12-14z",fill:"#D6C58E"}),(0,Y.jsx)("path",{d:"M498 348l3-3 3 3M508 348l3-3 3 3M500 356q6 4 12 0",stroke:"#7C2D12",strokeWidth:"1.6",fill:"#FB923C"})]})}var Rg={id:"f6",n:6,code:"OC-0430",caseNo:"CASE 02",levelNo:"LEVEL 6/10",title:"The Rider",legend:"The Headless Horseman",place:"Coldharbour \xB7 the old corpse road",victim:"Bertram Fenwick",ambience:"woods",monster:"horseman",roomName:"Interview Room",roomMood:"HOOVES ON THE ROAD",sceneName:"The corpse road",eyeColor:"#FB923C",fog:"#FED7AA",ashColor:"#FDBA74",lowSanitySfx:"hooves",sceneLabel:"An old corpse road through Coldharbour woods at night: the church lychgate, two oaks, a stone bridge, the hunt stables and a farrier's van",Scene:Dg,evidence:Fg,suspects:Ng,culprit:"seward",keyEvidence:["forge"],trueMotive:"staged",motives:[{id:"rider",label:"The Headless Rider of the corpse road took his head on May Eve"},{id:"fall",label:"Thrown from his horse at a gallop onto a low branch"},{id:"heir",label:"A nephew drowning in debt, clearing the way to his inheritance"},{id:"staged",label:"A wire strung across the road at throat height, and a costumed rider on a borrowed cob"}],shadowSpots:[[360,260],[600,260],[130,230]],hallu:["SIX","CARRY HIM HOME","FROM UNDERNEATH","NO HEAD","FOUR MORE"],blackout:"You come to under the oaks with your hand at your own throat, feeling for a line that is not there. Your evidence is where you left it.",blackoutWake:"You blacked out under the oaks.",hint:"The cut is too straight and too high for a fall. What was stretched between the trees, and where did it go afterwards?",cold:["COLDHARBOUR \xB7 THE CORPSE ROAD \xB7 MAY EVE \xB7 23:58","Every May Eve for forty years, Bertram Fenwick has ridden the bounds of his village at midnight.","Tonight the church bell rings thirteen times. There is no one in the tower.","Half the village sees a rider gallop past the lychgate with no head above his collar.","At one o'clock Fenwick's grey comes home with an empty saddle."],coldSub:"He rides the corpse road looking for his head, and takes another in its place.",briefing:[(0,Y.jsxs)(Y.Fragment,{children:["At 01:15 the head groom found ",(0,Y.jsx)("b",{className:"text-white",children:"Bertram Fenwick"}),", 71, Master of the Coldharbour Hunt, dead on the old corpse road below the bridge, his throat cut almost through and a carved turnip lantern burning on his chest. Minutes before midnight, a dozen villagers saw a headless rider pass the church."]}),(0,Y.jsx)(Y.Fragment,{children:"In the 1998 Polaroid, Fenwick is the rider with no head. Three people were out on the road, or near it."})],archive:{from:"E. QUILL, ARCHIVIST",text:"The Headless Horseman is far older than America. In the British tellings he rides the corpse road, the path the coffins were carried down, and he takes heads at exactly the height of a rider's throat. Some villages strung a rope across the road on May Eve to stop him. Folk tradition is full of clever ideas, Detective. Most of them work just as well the other way round."},timeline:[["1998","Fenwick rides his grey down to the millpond after the children, in the rider costume."],["2024","He donates the costume to an archive."],["Feb",`"Luke Seward" starts shoeing the hunt's horses. He reshoes Tess's cob backwards.`],["23:00","A wire is ratcheted tight between the two oaks at 1.9 m."],["23:30","Rupert is lamping pheasants in the woods."],["23:58",`In Fenwick's own costume, on the cob, the "headless rider" passes the church.`],["00:00","Fenwick sets out to ride the bounds and gives chase down the corpse road."],["00:04","He meets the wire at a gallop."],["00:10","The wire is cut down and the turnip lantern is lit on his chest."],["00:20",`Under the lychgate, a child's hand presses up through the frost: "COME HOME".`],["01:00","The grey comes home riderless."]],redTimes:["23:00","00:04","00:10"],greenTimes:["00:20"],verdict:(0,Y.jsxs)(Y.Fragment,{children:[(0,Y.jsx)("b",{className:"text-white",children:'"Luke Seward"'})," is charged with the murder of Bertram Fenwick. He strung a steel wire across the corpse road between the two oaks, put on Fenwick's own 1998 costume, rode a borrowed cob shod backwards past the church to draw him out, and left a carved lantern burning on his chest."]}),after:`Seward is put in the back of a horsebox with two officers, to be driven out of the woods. On the corpse road the horsebox's lights die and the engine stops dead. In the silence both officers hear hooves pass them in the dark, at a walk, and a child's voice say "This way." When the lights come back the rear doors are open and the road ahead is empty. Thirteen strokes of the bell. No one in the tower.`,fragment:{n:6,title:"He smells of camphor. He keeps his disguises in an archive.",text:'The rider costume reeks of camphor, the mothball smell of archive storerooms, and bears the scar of an accession label. Fenwick gave it "to the archive". The Folklorist "only borrowed it back. Nobody ever checks the archive."'},seal:{ev:"lychgate",name:"From Underneath",text:"In untouched frost on the coffin stone, a nine-year-old's hand pressed up from below, and two words written to be read from the other side: COME HOME."},lantern:`Fenwick's Lantern Night costume, catalogued and donated "to the archive", reeking of camphor.`,nextTease:`Stuffed into the costume's empty collar: a seventh page from the 1891 book. "BLACK SHUCK. The great black dog of the coast road. Whoever meets his eyes is dead within the year." Under it: Gideon Marlowe. And, in a different hand, small and shaky, like a child's: "he held me back".`,herrings:[(0,Y.jsxs)(Y.Fragment,{children:[(0,Y.jsx)("b",{className:"text-white",children:"Tess Raikes"})," lied about sleeping. The second horse was her cob, taken from the paddock and reshod backwards. She hid it, afraid she would be blamed."]}),(0,Y.jsxs)(Y.Fragment,{children:[(0,Y.jsx)("b",{className:"text-white",children:"Rupert Fenwick"})," lied about the pub. He was poaching his uncle's pheasants and saw the rider pass him."]})],real:["The church bell rang thirteen times at midnight with no one in the tower. It rang again when Seward vanished.","A child's handprint pressed up from under the coffin stone through untouched frost.",'In the dark on the corpse road, a child said "This way."']},Zm=Rg;var jv=ae(Pe());var U=ae(me());$e({mags:{skin:"#E8C0A0",skinD:"#A8806A",iris:"#4A5A3A",rim:"#A3E635",bg:["#141A10","#05070A"],lips:"#9A6058",brow:"#6A5A4A",hair:"short",hairC:"#8A7A6A",outfit:"waxed",outfitC:"#22301E",motif:"fog",age:!0,scar:!0},thorley:{skin:"#EEC8AE",skinD:"#AE886E",iris:"#5A6A80",rim:"#E5E7EB",bg:["#16161E","#05060A"],lips:"#A26A60",brow:"#7A6A5A",hair:"short",hairC:"#9A8A7A",outfit:"cassock",outfitC:"#0F1014",motif:"arch",glasses:!0,bags:!0},hythe:{..._e,skin:"#D6AC8C",skinD:"#966E50",rim:"#60A5FA",bg:["#0A1220","#04060A"],lips:"#86584E",brow:"#2A2420",hair:"hood",hairC:"#1E2A3A",outfit:"coat",outfitC:"#1E2A3A",accent:"#F97316",pin:!0,motif:"moon",beard:"#3A3026"}});var Pg={body:{name:"Marlowe on the shingle",icon:Ie,x:432,y:392,spot:"Foot of the sea wall",curse:8,scene:"Gideon Marlowe lies on the shingle at the foot of the sea wall, his body twisted the wrong way at the neck, the hem of his coat still in the surf. The backs of his trouser legs are shredded. His face is frozen in the expression of a man who saw exactly what he was afraid of.",scan:"trace",method:"Post-mortem",result:`Death at about 01:20 from a fall of four metres onto the shingle: neck broken.
The scratches on his calves are from a large DOG'S CLAWS, shallow, made while he ran. No bite marks anywhere. Whatever chased him was trained not to bite.
Between his shoulder blades, a fresh bruise in the shape of TWO HANDS, the left one pressed harder. He did not fall. He was pushed.`,fact:"Marlowe died at about 01:20, pushed four metres off the sea wall by two hands, left pressing harder. A big dog chased him first, scratching his legs but never biting."},door:{name:"Scorch marks on the church door",icon:Kt,x:150,y:236,spot:"North door of St. Botolph's",scene:`The north door of St. Botolph's on the clifftop carries four long black burns, side by side, as if something enormous had raked it with a burning paw. The village is already saying it, the old line from 1577: "the black dog with the fiery eyes".`,scan:"trace",method:"Burn analysis",result:`The burns were made at about 01:00 last night, not in a storm in 1577. Propane residue in the char.
They were pressed in with a heated iron tool with four tines, exactly 2.4 cm apart.
That spacing matches, to the millimetre, the steel claw used on Hamish Rook on Kell Moor in February.`,fact:"The door was branded at about 01:00 with a heated four-tined iron. The tines are 2.4 cm apart, the same as the claw used on Hamish Rook."},prints:{name:"Giant pawprints on the wall",icon:ol,x:302,y:318,spot:"The top of the sea wall",scene:"Along the top of the sea wall, in the wet sand blown over the concrete, are pawprints the size of a man's hand. They come up the lane from the village at a run and go along the wall to where he fell.",scan:"trace",method:"Print & hair analysis",result:`These are REAL: a giant-breed dog, about 80 kg, coarse black hair caught on the railing.
The prints run at full stretch beside a man's running footprints (Marlowe's) and stop where he went over.
A third trail walks calmly behind both: SIZE-11 boots. After the fall, the dog's prints turn and trot back down the lane beside the boots, at heel.`,fact:"A real 80 kg black dog chased Marlowe along the wall. Size-11 boots walked calmly behind, and afterwards the dog trotted away beside them, at heel."},kennel:{name:"Black Paw film kennels",icon:qn,x:88,y:336,spot:"Kennels down the lane",scene:"A kennels for film and television animals sits at the bottom of the lane. One run is empty, its gate on a loose latch, its name board reading BRUTUS. A clipboard hangs by the office door.",scan:"trace",method:"Records & tracker check",result:`Brutus: a black Great Dane-mastiff cross, 82 kg, trained for film to chase on command and never to bite.
His collar's GPS tracker logged him on the sea wall from 00:55 to 01:25.
The clipboard: "Night shoot, coast, 00:30 to 02:00. Cash, \xA3400. Client: D. HYTHE." No production company named.`,fact:'Brutus, a black film dog trained to chase but not bite, was on the sea wall from 00:55 to 01:25. He was hired for cash for a "night shoot" by D. Hythe.'},hut:{name:"Coastguard lookout hut",icon:An,x:720,y:206,spot:"The lookout on the wall",scene:"The volunteer coastguard's lookout hut sits on the sea wall above the beach, its windows black. Inside: binoculars, a chart table, a logbook, and a locker that is not quite shut.",scan:"trace",method:"Tool & logbook check",result:`In the locker: a propane torch and an iron hand-tool with four flattened tines, exactly 2.4 cm apart, scorched black and still smelling of burnt oak.
A dog lead with coarse black hair on it (Brutus). A silent dog whistle.
The logbook, in a careful LEFT-handed script: "D. HYTHE. Patrolled sea wall 00:30 to 02:00. Storm. Nothing to report."`,fact:`The coastguard locker holds the four-tined branding iron and torch, a lead covered in Brutus's hair, and a dog whistle. D. Hythe logged a sea-wall patrol 00:30 to 02:00, "nothing to report."`},register:{name:"The warden's register",icon:Mo,x:560,y:176,spot:"Marlowe's cottage",scene:`Marlowe's cottage overlooks the beach. His desk lamp is still on. Open beside it is a heavy old ledger with a cracked spine: "ST. BRIGID'S HOME FOR CHILDREN \xB7 ADMISSIONS \xB7 1990 to 1999". A ribbon marks one page.`,scan:"trace",method:"Document check",result:`October 1997, in Marlowe's hand:
"ASHDOWN, Ivy. Aged 9." "ASHDOWN, Silas. Aged 12." "Siblings. Mother deceased. Father unknown. To be kept together."
Against Ivy, added in different ink: "Deceased 23.12.98. Accident (pond)."
Against Silas: "See page 211." Page 211 has been cut out with a blade, cleanly, close to the spine.`,fact:`St. Brigid's register: Ivy Ashdown, 9, and her brother Silas Ashdown, 12, admitted together in 1997. Ivy "deceased 23.12.98, accident (pond)." The page about what became of Silas has been cut out.`},radio:{name:"Lifeboat station radio",icon:La,x:808,y:290,spot:"The lifeboat station",anomaly:!0,scanCurse:9,scene:"The lifeboat station at the end of the wall records every transmission on the emergency channel. During the storm last night it logged one call with no vessel attached to it. The duty crew will not play it again.",scan:"evp",method:"EVP audio analysis",result:`01:18 Through static, a man shouting, out of breath: "Get it away from me! Get it away! I held him back, I only held him back!"
01:20 A dog barks once. Then nothing.
01:33 On an open channel, with no transmitter anywhere on the coast keyed: a child humming the four bars of the lullaby, very close. Then the same small voice, patient, as if to someone who will not listen: "Let him go. Let him go."`,fact:'Marlowe shouted on the radio: "I held him back, I only held him back!" At 01:33, with no transmitter keyed, a child hummed the lullaby and said "Let him go. Let him go."'},silver:{name:"The open plate cupboard",icon:Bo,x:236,y:296,spot:"St. Botolph's vestry",scene:"Inside the church, the vestry cupboard where the old communion silver is kept stands open. One velvet shape is empty: a chalice, 1620, insured for more than the vicarage. The vicar's bicycle lies on its side in the porch.",scan:"trace",method:"Prints & timing",result:`Fresh fingerprints on the cupboard and the velvet: the Reverend Andrew Thorley.
The cupboard was opened at about 00:50 with a key, not forced.
The chalice was found this morning wrapped in a towel in the boot of the vicar's car, beside an auction house catalogue with the page turned down.`,fact:"The vicar opened the silver cupboard with his key at about 00:50 and took the 1620 chalice to his car."}},Og=[{id:"mags",name:"Mags Doyle",role:"Film-animal trainer",look:{id:"mags"},motive:"Marlowe, as churchwarden, had her dogs banned from the beach and was pushing the council to close her kennels after Brutus knocked down a walker.",alibi:"Says Brutus was locked in his run all night and she was asleep in the house.",qs:[{q:"Where was Brutus last night?",a:"In his run. Locked. He's worth more than my house, I don't let him roam."},{q:"What can he do?",a:"Anything you want on camera. Chase you down a lane, stop dead at a whistle. He's done three horror films. He's soft as butter. He has never bitten a soul.",fact:"Mags: Brutus is trained to chase on command and stop at a whistle, and has never bitten anyone.",kind:"clue"},{q:"What did you think of Marlowe?",a:"A cold old man who liked rules more than people. You know he ran a children's home? You could tell."}],present:{kennel:{contra:!0,needsLab:!0,text:"Yes, all right. A man rang. Night shoot on the coast, storm footage, the big dog running along the wall. Four hundred cash. He collected Brutus at half twelve and had him back by two, wet through and happy. I didn't ask. I need the money. I didn't know, I swear I didn't know what he wanted him to chase.",fact:'Mags lied: she hired Brutus out for cash to "D. Hythe" from 00:30 to 02:00, no questions asked.'},prints:{needsLab:!0,text:"That's him, that's Brutus. At heel at the end. He only walks like that for someone he trusts. Someone who's worked him before.",fact:"Mags: Brutus only walks at heel like that for someone who has worked him before.",kind:"clue"},body:{needsLab:!0,text:"Scratches, no bites. That's my dog. Doing exactly what he was trained for. God forgive me."}},dismiss:["Ask the dog.","I train animals, not people.","No."]},{id:"thorley",name:"Rev. Andrew Thorley",role:"Vicar of St. Botolph's",look:{id:"thorley"},motive:"Marlowe had found the parish accounts were short by \xA330,000 and had written to the bishop. The letter was due to arrive today.",alibi:"Says he was in bed at the vicarage through the storm.",qs:[{q:"Where were you last night?",a:"Asleep. Storms don't bother me. I have lived on this coast for eleven years."},{q:"What do people say about the dog?",a:"Black Shuck. Our neighbours at Blythburgh have his marks on their door. Now, it seems, so do we. People like to believe a dog did it. It is easier than believing a person did."},{q:"Did Marlowe ever talk about St. Brigid's?",a:"Every Christmas he gave a large donation to a children's water-safety charity, anonymously. He told me once he could not swim. That he had never been able to go out onto anything."}],present:{silver:{contra:!0,needsLab:!0,text:"I wasn't asleep. I went to the church at a quarter to one, in the storm, because I knew the letter would reach the bishop today and I thought, if I sold the chalice, I could put it back before anyone looked. I was in the vestry when I heard it. Something huge, panting, running along the wall past the window. And a man laughing. Not a cruel laugh. A tired one.",fact:"Thorley lied: he was in the church at 00:50 taking the chalice to sell. He heard a huge dog run past and a man laughing, tiredly."},door:{needsLab:!0,text:"I touched it this morning. It was still warm. That is not 1577, whatever the village says."},register:{needsLab:!0,text:"Ashdown. Ivy. He had a little brass plate made with that name on it. It is screwed under the pew where he sat. I always wondered.",fact:'Thorley: Marlowe had a brass plate reading "Ivy" fixed under his pew.',kind:"clue"}},dismiss:["I couldn't say.","God knows. I don't.","That is a question for the bishop."]},{id:"hythe",name:"Daniel Hythe",role:"Volunteer coastguard",look:{id:"hythe"},motive:"None known. He joined the coastguard station in May and volunteers for the night watches nobody else wants.",alibi:"Says he was in the lookout hut all night watching the storm, and found the body on his dawn patrol.",qs:[{q:"What did you see last night?",a:"Rain. Lightning. Sea. Nothing on the wall. I logged it."},{q:"You found him?",a:"At five, on patrol. I called it in. I stayed with him until they came. Somebody should."},{q:"Did you know Gideon Marlowe?",a:"He used to stand on the wall every night at one and look at the sea. Never went down onto the beach. Never went near the water. You notice a man like that."},{q:"Do you have a dog?",a:"I've worked with dogs. Film work, years ago. They're easy. They do what you love them for."}],present:{hut:{contra:!0,needsLab:!0,text:`Hythe picks up the branding iron by the handle and turns it so the four tines catch the light. "Same as Kell Moor," he says, almost pleased you noticed. "You're good at this. She said you would be." He puts it down. "Nothing to report. That was true, you know. He never reported anything either."`,fact:`Hythe lied about watching the storm: the branding iron, torch and Brutus's lead are in his locker. He says Marlowe "never reported anything either."`},register:{contra:!0,needsLab:!0,text:`Hythe reads the line with his finger, the way a child does. "Ashdown, Silas. Aged twelve." His voice does not change at all. "He held me by the collar so hard my feet came off the ground. He said, there's nothing you can do, son. He was right. That's the thing. He was right."`,fact:'Hythe let it slip: "He held me by the collar." He was the boy, Silas, held back from the ice.'},radio:{needsLab:!0,text:`He doesn't listen to the recording. He just says, "I know. I know she does."`},kennel:{needsLab:!0,text:"Lovely dog, Brutus. Soft as butter. Never bit anyone in his life."}},crack:`Hythe puts both hands flat on the table. The left little finger stops at the first joint. "Seven," he says. Then, to the empty chair beside you, with great tenderness: "I won't. Not yet. Not until it's finished."`,crackEnd:"Hythe is looking at the empty chair beside you as if someone is sitting in it. You have enough to make an accusation.",dismiss:["Nothing to report.","The sea doesn't care.","You'd have to ask him. Oh. You can't."]}];function Hg(){return(0,U.jsxs)("g",{children:[(0,U.jsxs)("defs",{children:[(0,U.jsxs)("linearGradient",{id:"w7sky",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,U.jsx)("stop",{offset:"0",stopColor:"#05070C"}),(0,U.jsx)("stop",{offset:".55",stopColor:"#0E1624"}),(0,U.jsx)("stop",{offset:"1",stopColor:"#0A0F18"})]}),(0,U.jsxs)("linearGradient",{id:"w7sea",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,U.jsx)("stop",{offset:"0",stopColor:"#0B1422"}),(0,U.jsx)("stop",{offset:"1",stopColor:"#03060C"})]}),(0,U.jsxs)("radialGradient",{id:"w7win",cx:".5",cy:".5",r:".5",children:[(0,U.jsx)("stop",{offset:"0",stopColor:"#FBBF24",stopOpacity:".4"}),(0,U.jsx)("stop",{offset:"1",stopColor:"#FBBF24",stopOpacity:"0"})]}),(0,U.jsxs)("radialGradient",{id:"w7eye",cx:".5",cy:".5",r:".5",children:[(0,U.jsx)("stop",{offset:"0",stopColor:"#FCA5A5"}),(0,U.jsx)("stop",{offset:".4",stopColor:"#DC2626",stopOpacity:".7"}),(0,U.jsx)("stop",{offset:"1",stopColor:"#DC2626",stopOpacity:"0"})]})]}),(0,U.jsx)("rect",{width:"880",height:"440",fill:"url(#w7sky)"}),(0,U.jsx)("g",{opacity:".7",children:Array.from({length:9}).map((e,t)=>(0,U.jsx)("ellipse",{cx:t*110,cy:40+t%3*16,rx:"120",ry:"34",fill:"#0B111C"},t))}),(0,U.jsx)("path",{d:"M612 0l-18 52 14 4-24 60 40-72-14-4 18-40z",fill:"#E0E7FF",opacity:".55",className:"hm-lightning"}),(0,U.jsx)("rect",{y:"230",width:"880",height:"210",fill:"url(#w7sea)"}),Array.from({length:14}).map((e,t)=>(0,U.jsx)("path",{d:`M${t*97%860} ${250+t*23%70}q20-8 40 0t40 0`,stroke:"#CBD5E1",strokeOpacity:.1+t%3*.06,fill:"none",className:t%2?"hm-mist1":"hm-mist2"},t)),(0,U.jsx)("path",{d:"M0 160Q60 150 120 170T260 200L280 440H0z",fill:"#0A0C0A"}),(0,U.jsx)("path",{d:"M110 250v-80l40-30 40 30v80z",fill:"#14161A", d:"M380 392q20-16 60-8 30 6 40 0l30 4q4 8-6 10l-110 6q-18-2-14-12z",fill:"#1F2630"}),(0,U.jsx)("ellipse",{cx:"376",cy:"392",rx:"10",ry:"8",fill:"#D8C0A8"}),(0,U.jsx)("path",{d:"M480 396l40 10",stroke:"#1F2630",strokeWidth:"5"}),(0,U.jsx)("path",{d:"M500 410q40 6 90 -4",stroke:"#CBD5E1",strokeOpacity:".3",fill:"none"}),(0,U.jsx)("path",{d:"M520 220v-60l40-30 40 30v60z",fill:"#121416",stroke:"#2A2E34",strokeWidth:"2"}),(0,U.jsx)("rect",{x:"548",y:"168",width:"24",height:"20",fill:"#2A2010"}),(0,U.jsx)("rect",{x:"548",y:"168",width:"24",height:"20",fill:"url(#w7win)",className:"hm-candle"}),(0,U.jsx)("rect",{x:"690",y:"196",width:"60",height:"104",fill:"#14181E",stroke:"#2E343C",strokeWidth:"2"}),(0,U.jsx)("path",{d:"M684 196h72l-36-24z",fill:"#1E242C"}),(0,U.jsx)("rect",{x:"700",y:"208",width:"40",height:"18",fill:"#0A0F18",stroke:"#3A4048"}),(0,U.jsx)("path",{d:"M780 300v-60h80v60",fill:"#161A20",stroke:"#2E343C"}),(0,U.jsx)("path",{d:"M774 240l46-24 46 24z",fill:"#1E242C"}),(0,U.jsx)("circle",{cx:"820",cy:"262",r:"4",fill:"#B91C1C",className:"hm-rec"})]})}var qg={id:"f7",n:7,code:"OC-0804",caseNo:"CASE 02",levelNo:"LEVEL 7/10",title:"Black Dog",legend:"Black Shuck",place:"Dunsmere \xB7 the sea wall",victim:"Gideon Marlowe",ambience:"coast",monster:"shuck",roomName:"Interview Room",roomMood:"STORM ON THE GLASS",sceneName:"Dunsmere sea wall",eyeColor:"#EF4444",fog:"#CBD5E1",ashColor:"#94A3B8",lowSanitySfx:"howl",sceneLabel:"A storm on the coast at Dunsmere: a clifftop church, the kennels, the sea wall, a coastguard hut and the lifeboat station",Scene:Hg,evidence:Pg,suspects:Og,culprit:"hythe",keyEvidence:["hut"],trueMotive:"staged",motives:[{id:"shuck",label:"Black Shuck, the hell-hound of the coast, met his eyes in the storm"},{id:"slip",label:"An old man slipped on the wet sea wall in the storm"},{id:"vicar",label:"A vicar silencing the churchwarden who was about to expose him"},{id:"staged",label:"A hired film dog chased him along the wall, and a man pushed him off"}],shadowSpots:[[150,220],[520,280],[720,260]],hallu:["SEVEN","LET HIM GO","I HELD HIM BACK","HEEL","DON'T LOOK IN ITS EYES"],blackout:"You come to on the shingle below the wall, the sea at your ankles, a great weight of something warm and panting just walking away into the dark. Your evidence is where you left it.",blackoutWake:"You blacked out on the shingle.",hint:"The dog never bit him, and two hands pushed. Who walked behind the dog, and what did they keep in their locker?",cold:["DUNSMERE \xB7 THE SEA WALL \xB7 4 AUGUST \xB7 01:15","On 4 August 1577, in a storm, Black Shuck burst into the church at Blythburgh and left his claw marks burned into the north door.","Tonight, on the anniversary, a storm hits Dunsmere.","In the lightning, half the village sees it on the sea wall: a black dog the size of a calf, its eyes like coals.","At dawn Gideon Marlowe, once warden of St. Brigid's, is found broken on the shingle below."],coldSub:"Whoever meets his eyes is dead within the year.",briefing:[(0,U.jsxs)(U.Fragment,{children:["At 05:00 a volunteer coastguard found ",(0,U.jsx)("b",{className:"text-white",children:"Gideon Marlowe"}),", 74, former warden of St. Brigid's Home, dead on the shingle below the Dunsmere sea wall. Overnight the north door of St. Botolph's was scorched with four claw marks, and villagers saw an enormous black dog on the wall during the storm."]}),(0,U.jsx)(U.Fragment,{children:"In the 1998 Polaroid, Marlowe is the black dog. He also ran the home where the children lived. Three people were out in the storm."})],archive:{from:"E. QUILL, ARCHIVIST",text:"Black Shuck is the great black dog of the East Anglian coast, with eyes like coals. On 4 August 1577 he burst into the churches at Bungay and Blythburgh in a storm and left scorch marks on the north door that you can still touch: four, side by side, like a claw. The legends agree that whoever sees him dies within the year. They never say that the dog is what kills them. A dog only chases. It is always the fall that does the work."},timeline:[["1998","Warden Marlowe holds a twelve-year-old boy back by the collar as his sister goes through the ice."],["May",'"Daniel Hythe" joins the coastguard and takes the night watches.'],["00:30",'Hythe collects Brutus from the kennels for a "night shoot".'],["00:50","The vicar lets himself into the vestry for the chalice."],["00:55","Brutus is set running along the sea wall towards Marlowe."],["01:00","The church door is branded with a heated four-tined iron."],["01:18",'Marlowe on the radio: "I held him back, I only held him back!"'],["01:20","He is pushed off the wall by two hands."],["01:33",'On an empty channel, a child hums: "Let him go."'],["02:00","Brutus is returned to his run, wet and happy."],["05:00",'Hythe "finds" the body and calls it in.']],redTimes:["00:55","01:00","01:20"],greenTimes:["01:33"],verdict:(0,U.jsxs)(U.Fragment,{children:[(0,U.jsx)("b",{className:"text-white",children:'"Daniel Hythe"'}),` is charged with the murder of Gideon Marlowe. He hired a trained film dog for cash, set it to chase Marlowe along the sea wall in the storm, pushed him off it, branded the church door with Black Shuck's claw, and logged the night as "nothing to report".`]}),after:`Hythe is held in the lifeboat station, cuffed to a radiator, with an officer at the door. At 03:00 the emergency channel opens by itself and a child's voice says "Let him go." The officer turns round. The cuffs are still locked around the radiator pipe. Hythe is gone, and the door has not opened. Far down the beach, under the lighthouse beam, a big black dog sits on the shingle looking out to sea, and will not come when it is called.`,fragment:{n:7,title:"Ivy had a brother. His name was Silas.",text:`St. Brigid's register: Ivy Ashdown, 9, and Silas Ashdown, 12, admitted together in 1997, "to be kept together". Silas was the boy who ran for the ice and was held back by the collar. The page saying what became of him has been cut out.`},seal:{ev:"radio",name:"Let Him Go",text:'On an emergency channel no transmitter had keyed, a child hummed the four bars, then said, patiently, as if to someone who would not listen: "Let him go."'},lantern:`St. Brigid's register, 1997: "Ashdown, Ivy, 9. Ashdown, Silas, 12. Siblings. To be kept together." Page 211 cut out.`,nextTease:`In Hythe's locker, under the logbook: an eighth page from the 1891 book. "KRAMPUS. On the fifth of December he comes with chains and birch rods for the wicked children, and carries them off in his basket." Under it: Neville Thorne. And beneath that, a line of the warden's own handwriting, cut from the missing page 211: "Silas A. Transferred, January 1999. Adoptive family: see sealed file, Occult Crimes Unit."`,herrings:[(0,U.jsxs)(U.Fragment,{children:[(0,U.jsx)("b",{className:"text-white",children:"Mags Doyle"}),' lied about Brutus being locked up. She hired him out for cash to a man for a "night shoot" and asked no questions.']}),(0,U.jsxs)(U.Fragment,{children:[(0,U.jsx)("b",{className:"text-white",children:"Rev. Andrew Thorley"})," lied about being in bed. He was stealing the church silver and heard the dog run past."]})],real:['A child hummed the lullaby and said "Let him go" on a channel no one was transmitting on.',"Hythe slipped out of locked cuffs through a door that never opened.","Brutus was in his run at 02:00. The black dog on the beach at 03:00 has never been found."]},ep=qg;var Zv=ae(Pe());var $=ae(me());$e({charlotte:{skin:"#F2CEB6",skinD:"#B28E76",iris:"#3A5A7A",rim:"#F59E0B",bg:["#1E1408","#06060A"],lips:"#B05A58",brow:"#3A2A1E",hair:"bun",hairC:"#3A2A1E",outfit:"suit",outfitC:"#1E1E28",accent:"#E5E7EB",tie:"#1E3A8A",motif:"candles"},benny:{skin:"#EBC0A0",skinD:"#AB8466",iris:"#6A7A4A",rim:"#22C55E",bg:["#0E1A0E","#05070A"],lips:"#B06A60",brow:"#8A5A2E",hair:"curly",hairC:"#8A5A2E",outfit:"jumper",outfitC:"#14532D",accent:"#B91C1C",motif:"candles",bags:!0,mous:"#8A5A2E"},engel:{..._e,skin:"#DCB494",skinD:"#9C7456",rim:"#E2E8F0",bg:["#0C1420","#04060A"],lips:"#8A5A50",brow:"#2E2620",hair:"short",hairC:"#2E2620",outfit:"uniform",outfitC:"#111827",accent:"#9CA3AF",pin:!0,motif:"bars"}});var zg={body:{name:"Thorne in the basket",icon:Ie,x:440,y:372,spot:"Krampus's basket in the grotto",curse:8,scene:"Neville Thorne, in the red coat he has worn every December for forty years, is folded into a huge wicker basket beside his grotto throne, wound round with black chains. His knuckles are torn and welted as if from a birch switch. There is frost on his eyelashes and in his beard, though the store's heating has been on all night.",scan:"tox",method:"Post-mortem & toxicology",result:`Death by HYPOTHERMIA at about 03:00. Core body temperature consistent with many hours at well below freezing.
Frost-burned fingertips, torn knuckles: he beat on something hard and metal for a long time.
The "birch" welts were made AFTER death: no swelling.
He was moved into the basket after he died, already stiff with cold.`,fact:"Thorne froze to death at about 03:00 after hours below zero, beating on metal with his fists. The birch welts were made after death and he was put in the basket already stiff."},basket:{name:"The basket & chains",icon:el,x:520,y:338,spot:"Beside the throne",scene:"The grotto's great wicker basket, the kind Krampus carries on his back for the wickedest children, is a prop that stands by the throne every year. Tonight it is wet at the bottom. The chains are bright where the black paint has rubbed off.",scan:"trace",method:"Residue & fibre check",result:`The chains are new hardware-store chain, sprayed black, still tacky. Padlocked with a padlock from the store's own hardware department.
In the bottom: meltwater, a scatter of SAWDUST and a strip of clear PVC, torn from a cold-room door curtain.
The basket was carried on someone's back: two strap marks in the wicker, heavy load.`,fact:"The basket holds meltwater, sawdust and a torn strip of cold-room door curtain. It was carried upstairs on someone's back with Thorne inside."},freezer:{name:"Food hall walk-in freezer",icon:Vo,x:792,y:284,spot:"Food hall cold store",scene:"Down a short stair, behind the food hall counters: the walk-in freezer, a steel door with strips of clear plastic curtain behind it. Inside, at about the height of a man's chest, the door is dented and smeared from the inside.",scan:"trace",method:"Door, prints & access log",result:`The inside of the door is covered in dents, blood and white beard hairs: Thorne beat on it for hours.
The INSIDE SAFETY RELEASE has been removed. Fresh screw holes; the handle is gone.
Sawdust on the floor matches the basket. One PVC curtain strip is torn.
The door's keycard log: locked from OUTSIDE at 22:40 by card "NIGHT SECURITY \xB7 F. ENGEL". Opened again at 03:20 by the same card.`,fact:"Thorne was locked in the walk-in freezer at 22:40 by night guard F. Engel's keycard, with the inside release removed. The same card opened it at 03:20."},cctv:{name:"Security monitors",icon:Ca,x:98,y:252,spot:"The night security desk",scene:"The night security desk by the staff entrance: a bank of monitors showing every floor in grey and green, a kettle, a crossword. One monitor shows only the wall. Its camera has been turned to face it.",scan:"trace",method:"Footage recovery",result:`The camera at this desk was turned to the wall at 22:35. Every other camera kept recording.
22:38 Food hall: Thorne, still in his red coat, follows someone down the cold-store stairs. The other person is out of shot.
03:30 Toy floor: a HORNED FIGURE in a shaggy black coat, a long red tongue lolling from a carved mask, chains dragging, carries the wicker basket on its back from the goods lift to the grotto. Height against the shelving: about 6 FT 1.
The mask was found this morning in the security desk's bin: Thorne's own 1998 Krampus mask.`,fact:"At 22:38 Thorne followed someone to the freezer. At 03:30 a horned figure in Thorne's own 1998 Krampus mask, about 6 ft 1, carried the basket to the grotto. The mask was in the security desk bin."},page:{name:"Page nailed to the grotto",icon:Wo,x:352,y:186,spot:"The grotto sign",curse:4,scene:'Nailed through the "FATHER CHRISTMAS IS IN!" sign above the grotto entrance: a page from the 1891 book, its print faded brown. "KRAMPUS. He comes on the fifth night of December for the children who were wicked." Under it in fresh ink: Neville Thorne.',scan:"uv",method:"UV & paper analysis",result:`Under UV, an old library stamp, half-bleached away, appears in the margin: "OCU BLACK ARCHIVE \xB7 RESTRICTED \xB7 BA-1891-017".
The paper, the ink and the cut edge match the other seven pages exactly. All eight were cut from the same book with the same blade.
Only one copy of the 1891 "Bestiary of the British Isles" is known to survive. It is held in the Occult Crimes Unit's Black Archive.`,fact:`Every bestiary page bears the stamp "OCU BLACK ARCHIVE \xB7 BA-1891-017". They were all cut from the only known copy of the 1891 book, held in the Unit's own archive.`},globe:{name:"The musical snow globe",icon:Zn,x:586,y:252,spot:"The grotto counter",anomaly:!0,scanCurse:9,scene:"On the counter where the children queue to whisper their wishes: a big brass snow globe with a tiny St. Brigid's-style red-brick house inside it, under the snow. The cleaners say it played music at three o'clock this morning. It has no key. It has never had one.",scan:"evp",method:"EVP audio analysis",result:`The night cleaner's phone caught it from across the floor.
02:59 Chains, far below, through the floor. A man's voice, hoarse, failing: "Let me out. Please. I'll tell them. I'll tell them all of it."
03:00 The globe starts to play. Not its tune: the four bars of the lullaby, slow, like a music box winding down.
03:01 Over it, a little girl, close, shivering: "It's so cold, Silas. It's so cold down here."`,fact:`At 03:00 the keyless snow globe played the lullaby, and a little girl's voice said: "It's so cold, Silas. It's so cold down here."`},office:{name:"Shredder in the MD's office",icon:No,x:712,y:124,spot:"The mezzanine office",scene:"On the mezzanine above the toy floor, the managing director's office has its light on. The shredder bin is full to the top. A coffee cup with lipstick on the rim is still warm.",scan:"trace",method:"Document reconstruction",result:`Reassembled strips: a SALE AGREEMENT for the store to a developer, \xA314 million, signed by Charlotte Thorne and NOT by Neville Thorne.
A board memo: "N.T. refuses to sell. Discuss capacity assessment."
The office door's keycard log: Charlotte Thorne, in at 23:05, out at 00:15.`,fact:"Charlotte was in the office from 23:05 to 00:15 shredding a \xA314 million sale agreement her father had refused to sign."},flask:{name:"Hip flask in the stockroom",icon:ml,x:228,y:364,spot:"Grotto stockroom",scene:`Behind the grotto, in the stockroom full of wrapped "presents" that are empty boxes, someone has made a bed out of fake snow blankets. An elf's hat. A hip flask, empty. A phone charger plugged into the wall.`,scan:"trace",method:"Prints & timing",result:`Prints on the flask and the hat: Benny Kowalczyk.
The snow blankets were slept on for several hours; the phone charger shows a phone connected from 22:50 to 05:40.
The stockroom door has no lock. It looks straight onto the grotto.`,fact:"Benny Kowalczyk slept in the grotto stockroom from about 22:50 to 05:40, with a view of the grotto."}},Wg=[{id:"charlotte",name:"Charlotte Thorne",role:"Daughter & managing director",look:{id:"charlotte"},motive:"A developer has offered \xA314 million for the store. Her father refused to sell and would not step down.",alibi:"Says she left the store at six and spent the evening at home.",qs:[{q:"Where were you last night?",a:"Home from six. The store runs itself at night. That is what security is for."},{q:"Why wouldn't your father sell?",a:"He said the grotto was the only good thing he did all year. Forty years of Father Christmas. Every child who came through, he gave a present to. He said he was paying something back.",fact:'Charlotte: her father said the grotto was "paying something back".',kind:"clue"},{q:"Who is on security?",a:"Felix Engel. Since November. Ex-army, I think. Very calm. Dad liked him. He talked to him for hours about the old Alpine Christmas customs."}],present:{office:{contra:!0,needsLab:!0,text:"Fine. I came back at eleven to get rid of the sale papers before the board saw them. I thought if he never knew I'd signed, I could still talk him round. He wasn't in his office. I assumed he'd gone home. I didn't look for him. I didn't look.",fact:"Charlotte lied: she was in the store from 23:05 to 00:15 shredding the sale agreement. She never looked for her father."},freezer:{needsLab:!0,text:"Removed the safety handle? That's illegal. Every year Dad made the staff do a drill in there. He was terrified of it. He wouldn't go in it without someone holding the door.",fact:"Charlotte: her father was terrified of the freezer and never went in without someone holding the door.",kind:"clue"},body:{needsLab:!0,text:"He was wearing the coat. He always said the coat made him a better man than he was."}},dismiss:["I'd need to check with legal.","That isn't my department.","No."]},{id:"benny",name:"Benny Kowalczyk",role:"Grotto elf",look:{id:"benny"},motive:"Thorne sacked him last week for drinking on shift and told him not to come back after Christmas.",alibi:"Says he went home at closing and slept in his own bed.",qs:[{q:"Where were you last night?",a:"Home. Bed. Big day today, school parties."},{q:"Why did he sack you?",a:"A drink at lunch. One. He said children deserve better. He was right, I suppose."},{q:"What was Thorne like?",a:"Kind to the kiddies. Gave every single one of them a present out of his own pocket. But every year on the fifth he went funny. Wouldn't come into the grotto. Wouldn't say why."}],present:{flask:{contra:!0,needsLab:!0,text:"I sleep there. All right? My landlord changed the locks. The stockroom's warm. I had a drink and went down about eleven. Then about half three I heard chains. Right outside. I looked through the gap in the door and there was KRAMPUS, Detective. Horns. Tongue. Dragging chains. Putting the basket down by the throne. I pulled the blanket over my head like I was six.",fact:"Benny lied about going home: he slept in the stockroom and at about 03:30 saw a horned figure in chains set the basket down by the throne."},cctv:{needsLab:!0,text:"That's it. That's what I saw. But it didn't walk like a monster. It walked like a man carrying something heavy, very carefully. Like you'd carry a sleeping kid up to bed."},globe:{needsLab:!0,text:"That globe. Mr. Thorne bought it the year he started the grotto. He said it looked like a place he used to know."}},dismiss:["Dunno.","I just do the bells.","Ask the big man. Oh."]},{id:"engel",name:"Felix Engel",role:"Night security guard",look:{id:"engel"},motive:"None known. He joined store security in November and asks for the night shift every week.",alibi:"Says he was at the security desk all night, did his rounds every hour, and found the body at six.",qs:[{q:"What did you see last night?",a:"Nothing. Quiet night. I did my rounds on the hour. I found him at six."},{q:"Did you talk to Thorne much?",a:"Every night. He stayed late in December. He liked to talk about the Alpine customs. Krampus, the birch rods, the basket. He said every child should be a little afraid of the dark. It keeps them indoors."},{q:"Why was your camera facing the wall?",a:"I knocked it with the kettle. It happens."},{q:"Engel. That's German.",a:'For "angel". A joke someone played on me, a long time ago. I kept it.'}],present:{freezer:{contra:!0,needsLab:!0,text:`Engel reads the keycard log without blinking. "Twenty to eleven," he says. "He asked me to show him the new cold-room alarm. I held the door. Then I didn't." A pause. "On Lantern Night he wore the horns and dragged the chains up and down the bank and told us the bad children would go in the basket, under the ice. He said that, Detective. Under the ice."`,fact:'Engel lied about a quiet night: his card locked Thorne in at 22:40. He says on Lantern Night Thorne told the children bad ones would go "under the ice".'},page:{contra:!0,needsLab:!0,text:'"BA-1891-017," he says, before you have finished reading it out. "Third shelf, restricted cage, left-hand side. It took me eleven years to be trusted with the key." He smiles. "You walk past it every day."',fact:'Engel knows the archive shelf mark by heart. He says it took him "eleven years to be trusted with the key", and that you walk past it every day.'},globe:{needsLab:!0,text:`Engel goes very still. "Don't," he says quietly. Not to you.`},basket:{needsLab:!0,text:"Heavier than you'd think, a grown man. Lighter than a child, somehow."}},crack:`Engel sets his security lanyard on the table and squares it neatly with one finger. "Eight," he says. "Two left. And then I'll be done, and you can have me." He looks up at you. "I'm sorry it's you. I really am."`,crackEnd:"Engel is sitting quite still, watching you with something like sympathy. You have enough to make an accusation.",dismiss:["Nothing to report.","I only watch the screens.","Angels don't answer ques x)("path",{d:"M400 370q20-14 60-10h60q10 4 0 12l-120 6q-10-4 0-8z",fill:"#991B1B"}),(0,$.jsx)("circle",{cx:"400",cy:"368",r:"10",fill:"#E8CFC0"}),(0,$.jsx)("path",{d:"M392 372q8 10 16 0",fill:"#F1F5F9"}),(0,$.jsx)("path",{d:"M410 360q40 16 90 0M420 376q40 -10 80 4",stroke:"#18181B",strokeWidth:"3",strokeDasharray:"4 2",fill:"none"}),(0,$.jsx)("rect",{x:"196",y:"330",width:"70",height:"60",fill:"#0C0C10",stroke:"#2A2A34"}),(0,$.jsx)("path",{d:"M200 380h60",stroke:"#E5E7EB",strokeOpacity:".3",strokeWidth:"6"}),(0,$.jsx)("path",{d:"M700 330l40-30h100v100H700z",fill:"#0B0E14"}),(0,$.jsx)("path",{d:"M708 340h26M716 352h26M724 364h26",stroke:"#2A2F38",strokeWidth:"3"}),(0,$.jsx)("rect",{x:"760",y:"240",width:"64",height:"92",fill:"#94A3B8",opacity:".25",stroke:"#CBD5E1",strokeOpacity:".4",strokeWidth:"2"}),(0,$.jsx)("circle",{cx:"792",cy:"286",r:"50",fill:"url(#w8cold)",className:"hm-flicker"}),(0,$.jsx)("rect",{x:"814",y:"280",width:"6",height:"16",fill:"#CBD5E1",opacity:".6"}),(0,$.jsx)("text",{x:"756",y:"232",fill:"#94A3B8",fontFamily:"ui-monospace,monospace",fontSize:"7",letterSpacing:"1",children:"COLD STORE \u221222\xB0C"}),(0,$.jsx)("rect",{y:"390",width:"880",height:"50",fill:"#0A0A0E"}),(0,$.jsx)("path",{d:"M0 390h880",stroke:"#1E1E28",strokeWidth:"2"})]})}var Vg={id:"f8",n:8,code:"OC-1205",caseNo:"CASE 02",levelNo:"LEVEL 8/10",title:"Krampusnacht",legend:"Krampus",place:"Thorne's department store \xB7 the grotto",victim:"Neville Thorne",ambience:"snow",monster:"krampus",roomName:"Interview Room",roomMood:"CHAINS IN THE CORRIDOR",sceneName:"Thorne's toy floor",eyeColor:"#F59E0B",fog:"#E0F2FE",ashColor:"#F8FAFC",lowSanitySfx:"chains",sceneLabel:"A department store toy floor at night: the Christmas grotto with its throne and a wicker basket, a security desk, a mezzanine office and the food hall freezer",Scene:Ug,evidence:zg,suspects:Wg,culprit:"engel",keyEvidence:["freezer"],trueMotive:"staged",motives:[{id:"krampus",label:"Krampus came on his night and carried the wicked man away"},{id:"heart",label:"An old man's heart gave out in a cold building, and a prank followed"},{id:"sale",label:"A daughter removing the one man standing in the way of \xA314 million"},{id:"staged",label:"Locked in the walk-in freezer with the release removed, then carried up in the basket"}],shadowSpots:[[300,260],[660,280],[180,300]],hallu:["EIGHT","SO COLD","INTO THE BASKET","UNDER THE ICE","YOU WALK PAST IT EVERY DAY"],blackout:"You come to curled on the grotto floor in the fake snow, so cold your teeth are chattering, though the store is warm. Your evidence is where you left it.",blackoutWake:"You blacked out in the grotto.",hint:"Frost in a heated building means he was somewhere very cold. Where in the store gets that cold, and whose card locked it?",cold:["THORNE'S DEPARTMENT STORE \xB7 KRAMPUSNACHT \xB7 6 DECEMBER \xB7 06:00","In the Alps, the night of the fifth of December belongs to Krampus: horns, chains, birch rods and a basket for the wicked.","For forty years Neville Thorne has played Father Christmas in his own store, and given every child a present.","At dawn the guard finds him in the grotto, folded into Krampus's basket and wrapped in chains.","The heating has been on all night. There is frost on his eyelashes."],coldSub:"He comes with chains for the children who were wicked.",briefing:[(0,$.jsxs)($.Fragment,{children:["At 06:00 the night security guard found ",(0,$.jsx)("b",{className:"text-white",children:"Neville Thorne"}),", 72, owner of Thorne's department store, dead inside the grotto's wicker basket, wrapped in chains, with frost in his beard. The store's cameras caught a horned figure on the toy floor at 03:30."]}),(0,$.jsx)($.Fragment,{children:"In the 1998 Polaroid, Thorne is the horned thing in chains. Two pages to go after this one. Three people were in the building overnight."})],archive:{from:"E. QUILL, ARCHIVIST",text:"Krampus is the Alpine shadow of St. Nicholas: horned, hairy, a long red tongue, chains and a bundle of birch. On Krampusnacht, the fifth of December, he comes for the wicked children and carries the worst away in a basket on his back. In the mountain tellings his breath is like the inside of a cellar in January, and the children he takes are found in the morning with frost on their eyelashes. They are never punished, Detective. They are only left somewhere cold until they learn."},timeline:[["1998",'Thorne drags chains along the bank in a Krampus mask and tells the children bad ones go "under the ice".'],["Nov",'"Felix Engel" joins store security and asks for nights.'],["22:35","The camera at the security desk is turned to the wall."],["22:38","Thorne follows someone down to the food hall cold store."],["22:40","Engel's card locks the freezer from outside. The inside release is gone."],["23:05","Charlotte arrives to shred the sale agreement. She does not look for her father."],["02:59",`Through the floor: "Let me out. I'll tell them all of it."`],["03:00",`The keyless snow globe plays the lullaby: "It's so cold, Silas."`],["03:20","Engel's card opens the freezer again."],["03:30","A horned figure carries the basket up to the grotto. Benny hides."],["06:00",'Engel "finds" the body.']],redTimes:["22:40","03:20","03:30"],greenTimes:["03:00"],verdict:(0,$.jsxs)($.Fragment,{children:[(0,$.jsx)("b",{className:"text-white",children:'"Felix Engel"'})," is charged with the murder of Neville Thorne. He lured Thorne into the food hall freezer, locked it with his own keycard after removing the inside release, and at 03:30 carried the frozen body up to the grotto in Krampus's basket, wearing Thorne's own 1998 mask."]}),after:"Engel is locked in the store's own security office to wait for transport, the only key in your pocket. At 05:00 every music box on the toy floor starts playing at once, all of them the same four bars. When you unlock the office, Engel is gone. On the desk, squared neatly, lies an Occult Crimes Unit staff pass with the photograph scratched out. The name on it is still legible: E. QUILL \xB7 ARCHIVIST \xB7 BLACK ARCHIVE.",fragment:{n:8,title:"The pages come from the Unit's own archive.",text:'Every bestiary page is stamped OCU BLACK ARCHIVE \xB7 BA-1891-017, cut from the only copy known to exist. He knows its shelf mark by heart. It took him "eleven years to be trusted with the key". You walk past it every day.'},seal:{ev:"globe",name:"So Cold",text:`At three in the morning a snow globe with no key played the four bars, and a little girl said a name out loud for the first time: "It's so cold, Silas."`},lantern:"A staff pass, its photo scratched out: E. QUILL \xB7 ARCHIVIST \xB7 BLACK ARCHIVE.",nextTease:'Folded inside the staff pass wallet: a ninth page from the 1891 book. "THE REAPER. He comes at the hour of three with his glass run out, and the clocks stop for him." Under it, in fresh ink: Dr. Edwin Sallow. Beneath that, a note in the same careful left-handed script you have read in nine archive notes: "Nearly there, Detective. Bring a torch."',herrings:[(0,$.jsxs)($.Fragment,{children:[(0,$.jsx)("b",{className:"text-white",children:"Charlotte Thorne"})," lied about going home. She came back to shred the sale agreement her father refused to sign, and never looked for him."]}),(0,$.jsxs)($.Fragment,{children:[(0,$.jsx)("b",{className:"text-white",children:"Benny Kowalczyk"})," lied about sleeping at home. He was sleeping in the stockroom and saw the horned figure set the basket down."]})],real:[`A snow globe with no key played the lullaby at 03:00, and a girl said "It's so cold, Silas."`,"Every music box on the toy floor played the same four bars at 05:00.","Engel left a locked office through a door you held the only key to."]},tp=Vg;var n4=ae(Pe());var _=ae(me());$e({priya:{skin:"#B07A56",skinD:"#7A5038",iris:"#2A1C14",rim:"#22D3EE",bg:["#0C1A1E","#04060A"],lips:"#8A4A40",brow:"#1A1210",hair:"bun",hairC:"#120E0C",outfit:"medic",outfitC:"#1E3A5A",motif:"fog",bags:!0},julian2:{skin:"#F0CAB0",skinD:"#B08A70",iris:"#4A5A6A",rim:"#CBD5E1",bg:["#14161E","#05060A"],lips:"#A86A60",brow:"#5A4A3A",hair:"slick",hairC:"#5A4A3A",outfit:"suit",outfitC:"#18181E",accent:"#E5E7EB",tie:"#334155",glasses:!0,motif:"arch"},hollis:{..._e,skin:"#DAB292",skinD:"#9A7254",rim:"#A78BFA",bg:["#120E1E","#04050A"],lips:"#86564C",brow:"#2E2620",hair:"short",hairC:"#2E2620",outfit:"cassock",outfitC:"#0B0B10",pin:!0,motif:"candles"}});var Gg={body:{name:"Dr. Sallow in his bed",icon:Ie,x:480,y:330,spot:"Room 9",curse:8,scene:"Edwin Sallow lies propped on his pillows in Room 9, his mouth open, his eyes fixed on the door. A drip line runs into the back of his hand. On the blanket over his feet, the hospice cat is curled up asleep, as it always is, the nurses say, on the bed of whoever is going next.",scan:"tox",method:"Toxicology",result:`Cardiac arrest at 02:58. Not the cancer: he had weeks left.
The potassium in the fluid of his eyes is far above anything his illness could explain: an injection of POTASSIUM CHLORIDE, a fast, sure way to stop a heart.
A fresh puncture through the injection port of his IV line. His morphine pump was untouched.`,fact:"Sallow's heart was stopped at 02:58 by potassium chloride injected through the port of his IV line. He had weeks left."},hourglass:{name:"The hourglass on the bedside",icon:_n,x:590,y:262,spot:"Bedside table",scene:"On the bedside table, between the water jug and his reading glasses, stands an antique hourglass, its sand all run through to the bottom. A sprig of rosemary lies across it. None of the staff have seen it before.",scan:"trace",method:"Object & prints check",result:`The hourglass runs for exactly thirty minutes. Turned at about 02:28.
On the brass base, engraved: "ST. BRIGID'S HOME \xB7 INFIRMARY". It came from the sickroom where children were taken when they were ill.
Wiped clean. A single partial print on the inside of the base, LEFT thumb.
Rosemary: in the old language of flowers, "for remembrance".`,fact:"The hourglass was turned at about 02:28 and ran out at 02:58. It came from the St. Brigid's Home infirmary. A left thumbprint remains on its base."},clocks:{name:"The stopped clocks",icon:Pn,x:132,y:176,spot:"The main corridor",scene:"Every clock in St. Jude's Hospice, in every room and down every corridor, says three o'clock. The nurses say they all stopped at once, at the very moment the alarm in Room 9 went off.",scan:"trace",method:"Electrical check",result:`The hospice's clocks are all slaved to one master clock in the corridor fuse cupboard.
Its fuse was pulled at exactly 03:00:00, stopping every hand in the building.
On the cupboard door, at the height of a tall man's hand: a smudge of glove leather and a trace of CAMPHOR.
The fuse cupboard is next to the chaplaincy.`,fact:"Every clock stopped because the master clock's fuse was pulled at exactly 03:00. The cupboard, next to the chaplaincy, smells of camphor."},chapel:{name:"The chaplaincy vestry",icon:fl,x:222,y:318,spot:"The hospice chapel",scene:"A small chapel off the corridor, with a vestry behind it: a rota on the wall, prayer books, a cupboard of vestments. A long black hooded cloak hangs among the white surplices like a shadow in a row of ghosts.",scan:"trace",method:"Residue & records check",result:`In the cloak's inside pocket: a 20 ml syringe with POTASSIUM CHLORIDE residue, and an empty ampoule from the hospice pharmacy.
The hooded cloak reeks of camphor and is long enough for a man about 6 ft 1.
The chaplaincy rota, in a careful LEFT-handed script: "Chaplain A. HOLLIS \xB7 Night vigil \xB7 02:00 to 04:00".`,fact:"The syringe with potassium chloride is in the pocket of a camphor-soaked hooded cloak in the vestry. Chaplain A. Hollis had the night vigil, 02:00 to 04:00."},pharmacy:{name:"The drug cabinet",icon:nl,x:334,y:212,spot:"Nurses' station",scene:"The locked drug cabinet behind the nurses' station has a keypad and a log screen. A tray of ampoules has one gap in it.",scan:"trace",method:"Access log",result:`One ampoule of concentrated potassium chloride missing.
The cabinet was opened at 02:40 with the code belonging to NIGHT NURSE P. LAL.
The ward's motion sensor shows the nurses' station EMPTY from 02:30 to 03:05. Whoever used her code, she was not at the desk.`,fact:"The potassium was taken at 02:40 using night nurse Priya Lal's code, while the nurses' station was empty from 02:30 to 03:05."},ticket:{name:"Car park barrier log",icon:Rn,x:780,y:150,spot:"The car park, from the window",scene:"Through Room 9's window, snow is falling on the hospice car park. One car has been there all night, its windscreen thick with snow except for a clear patch on the driver's side.",scan:"trace",method:"Barrier & phone check",result:`The car belongs to Julian Sallow. It came in at 20:10 and left at 02:20.
Phone records: Julian made four calls from the car park between 23:00 and 02:10, all to a private clinic in Zurich that arranges assisted deaths.
He never came back inside after 21:00.`,fact:"Julian Sallow stayed in the car park until 02:20, phoning a Zurich assisted-death clinic. He never came back inside after 21:00."},file:{name:"Sallow's box of papers",icon:Vn,x:650,y:372,spot:"Under the bed",scene:'Under the bed, a battered document box with "E.S. \xB7 PRIVATE" on the lid. On top, a folder labelled in the same hand: "ASHDOWN". He asked for this box to be brought to him the week he arrived.',scan:"trace",method:"Document check",result:`A carbon copy of a death certificate, signed by Dr. E. Sallow: "Ivy Ashdown, 9. 23 December 1998. Accidental drowning." A note clipped to it in his hand: "Ten adults present. None entered the water. Recorded as accident at the Society's request."
And a COURT ADOPTION ORDER, March 1999: "Silas Ashdown, aged 12, to Edmund and Margaret QUILL. The child shall be known as ELLIOT SILAS QUILL."
A later cutting, 2013: "New archivist appointed to the Occult Crimes Unit's Black Archive: Mr. E. Quill."`,fact:`Sallow recorded Ivy's death as an accident "at the Society's request". The adoption order: Silas Ashdown became Elliot Silas Quill, now the archivist of the Unit's Black Archive.`},monitor:{name:"The bedside intercom",icon:Ft,x:470,y:170,spot:"Call point above the bed",anomaly:!0,scanCurse:9,scene:"Above the bed, the nurse-call intercom has a small green light. It records whenever the call button is pressed. Sallow pressed it at 02:57, and kept pressing it.",scan:"evp",method:"EVP audio analysis",result:`02:57 Sallow, weak: "Is that you? Have you come for me at last?"
A man, very gently: "Not me, Doctor. You signed her name. I thought you should see her before you go."
02:58 The alarm. A long breath out.
03:00 With the man gone and Sallow dead: a little girl, close enough to touch the microphone, humming the four bars. Then, not frightened at all: "One more, Silas. Then come home. I'll leave the lights on."`,fact:`Sallow's killer said: "You signed her name." After both men were gone, a little girl hummed the lullaby: "One more, Silas. Then come home. I'll leave the lights on."`}},$g=[{id:"priya",name:"Priya Lal",role:"Night nurse",look:{id:"priya"},motive:"Sallow had made a formal complaint about her the week before, claiming she was rough with his medication. She faced a disciplinary hearing.",alibi:"Says she was at the nurses' station all night and ran to Room 9 the moment the alarm went.",qs:[{q:"What happened last night?",a:"The alarm in Room 9 went at 02:58. I ran. He was gone. And every clock on the wall said three o'clock and stayed there."},{q:"Did you see anyone?",a:"In the corridor, just before. A tall figure in a long black hood, walking away from Room 9, very slow. No face, in the dark. I thought, God help me, I thought: so that is what he looks like.",fact:"Priya saw a tall hooded figure walking slowly away from Room 9 just before the alarm.",kind:"clue"},{q:"What was Sallow like?",a:"Frightened. Of three o'clock. He made us check on him at three every night. He said that was when they come."}],present:{pharmacy:{contra:!0,needsLab:!0,text:"I wasn't at the desk. I'd done two shifts back to back and I went into the relatives' room at half two and fell asleep sitting up. The alarm woke me. My code is written on a card in my locker because I can never remember it. Anyone who works here could know that.",fact:"Priya lied: she was asleep in the relatives' room from 02:30. Her drug-cabinet code was written on a card in her locker."},clocks:{needsLab:!0,text:"All of them. At once. You don't forget a thing like that. It was like the building held its breath."},monitor:{needsLab:!0,text:"Who was he talking to? There was nobody in there when I got there. Only the cat."}},dismiss:["I need to get back to the ward.","I don't know.","Ask the doctors."]},{id:"julian2",name:"Julian Sallow",role:"Son, a solicitor",look:{id:"julian2"},motive:"He inherits the house, and had been pressing his father to travel to a clinic in Zurich to end his life before the money went on care.",alibi:"Says he visited from eight until nine and then drove home.",qs:[{q:"When did you leave?",a:"Nine. I said goodnight and drove home."},{q:"Did your father ever talk about St. Brigid's?",a:"He was the home's doctor for twenty years. One Christmas, when I was small, he came home and locked himself in his study for three days. Mother said a child had died and Daddy had to write it down properly.",fact:`Julian: when a child died at St. Brigid's one Christmas, his father "had to write it down properly".`,kind:"clue"},{q:"You wanted him to go to Zurich.",a:"I wanted him not to suffer. Is that a crime now?"}],present:{ticket:{contra:!0,needsLab:!0,text:"All right. I sat in the car park until two, ringing the clinic, trying to get them to take him before Christmas. He wanted to go, at the end. He said he didn't want to be here at three o'clock on the 23rd. I didn't go back in. I couldn't face him.",fact:"Julian lied: he sat in the car park until 02:20 calling the Zurich clinic, and never went back in."},file:{needsLab:!0,text:`"At the Society's request." My God. Ten grown men and women standing on the bank. And he wrote "accident".`},hourglass:{needsLab:!0,text:"That isn't his. He hated clocks, at the end. He had us take the one off his wall."}},dismiss:["I'd rather not.","Speak to my office.","I don't know, I wasn't there. Obviously."]},{id:"hollis",name:"Rev. Adam Hollis",role:"Hospice chaplain",look:{id:"hollis"},motive:"None known. He began volunteering as the hospice's night chaplain in October and sits with the dying.",alibi:"Says he was in the chapel at prayer for the whole of his vigil and heard the alarm from there.",qs:[{q:"Where were you at three o'clock?",a:"In the chapel. On my knees. It is the hour I keep for the ones who are going."},{q:"Did you sit with Dr. Sallow?",a:"Every night. He asked me once if God forgives a man who writes down the wrong word. I told him God isn't the one he should ask."},{q:"Why the night shift?",a:"I don't sleep, Detective. I haven't for a long time. You learn to make use of the dark."},{q:"You know who I am, don't you?",a:"I've known you a long time. I've read every one of your reports. Your spelling is better than most."}],present:{chapel:{contra:!0,needsLab:!0,text:`Hollis lifts the black cloak from its hook and holds it against himself, measuring. "The Society bought ten costumes from a theatrical costumier in 1998. Sallow's was the cheapest. A hood and a cloak and a plastic scythe." He folds it over his arm, gently. "He kept the scythe on the bank all night. He never put it down to reach for her."`,fact:"Hollis lied about praying: the syringe is in the hooded cloak from his vestry. He says Sallow held his scythe on the bank all night and never reached for her."},file:{contra:!0,needsLab:!0,text:`He reads the adoption order and smiles at the name as if at an old friend. "Elliot Silas Quill. They let me keep the middle one." He looks up. "You've been reading my notes for eleven years, Detective. You never once asked who was writing them."`,fact:'Hollis did not deny the adoption order: "They let me keep the middle one." He is Elliot Silas Quill, the archivist.'},monitor:{needsLab:!0,text:'"Leave the lights on," he says quietly. "She always said that. She was afraid of the dark. That was the joke, you see. That was why they chose the dark."'},hourglass:{needsLab:!0,text:"From the infirmary. I had measles there in 1998. She sat by my bed with that glass and turned it every half hour so I'd know how long until morning."}},crack:`Hollis takes off his clerical collar and lays it on the table, a small white crescent. "Nine," he says. "Only her left now. And then the lights." He stands, very slowly, as if he has been sitting for twenty-six years. "Twenty-third of December, Detective. Saint Brigid's. Bring a torch."`,crackEnd:"Hollis is standing at the window, watching the snow. You have enough to make an accusation.",dismiss:["God knows. I only listen.","That is between him and his maker now.","Ask me something true, Detective."]}];function _g(){return(0,_.jsxs)("g",{children:[(0,_.jsxs)("defs",{children:[(0,_.jsxs)("linearGradient",{id:"w9wall",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,_.jsx)("stop",{offset:"0",stopColor:"#0C1014"}),(0,_.jsx)("stop",{offset:"1",stopColor:"#121820"})]}),(0,_.jsxs)("radialGradient",{id:"w9lamp",cx:".5",cy:".5",r:".5",children:[(0,_.jsx)("stop",{offset:"0",stopColor:"#FDE68A",stopOpacity:".3"}),(0,_.jsx)("stop",{offset:"1",stopColor:"#FDE68A",stopOpacity:"0"})]}),(0,_.jsxs)("radialGradient",{id:"w9green",cx:".5",cy:".5",r:".5",children:[(0,_.jsx)("stop",{offset:"0",stopColor:"#34D399",stopOpacity:".35"}),(0,_.jsx)("stop",{offset:"1",stopColor:"#34D399",stopOpacity:"0"})]}),(0,_.jsxs)("linearGradient",{id:"w9snow",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,_.jsx)("stop",{offset:"0",stopColor:"#0B1220"}),(0,_.jsx)("stop",{offset:"1",stopColor:"#1E293B"})]})]}),(0,_.jsx)("rect",{width:"880",height:"440",fill:"url(#w9wall)"}),(0,_.jsx)("rect",{x:"0",y:"0",width:"290",height:"440",fill:"#0A0D11"}),(0,_.jsx)("path",{d:"M0 370h290",stroke:"#1E2430",strokeWidth:"3"}),[60,190].map(e=>(0,_.jsxs)("g",{children:[(0,_.jsx)("rect",{x:e-12,y:"20",width:"24",height:"6",fill:"#E2E8F0",opacity:".15"}),(0,_.jsx)("circle",{cx:e,cy:"30",r:"60",fill:"url(#w9lamp)",opacity:".5",className:"hm-flicker"})]},e)),(0,_.jsx)("circle",{cx:"132",cy:"150",r:"22",fill:"#E7E5E4",opacity:".85",stroke:"#44403C",strokeWidth:"3"}),(0,_.jsx)("path",{d:"M132 150v-14M132 150v14",stroke:"#111",strokeWidth:"2.4"}),(0,_.jsx)("circle",{cx:"132",cy:"150",r:"2",fill:"#111"}),(0,_.jsx)("rect",{x:"100",y:"196",width:"64",height:"40",fill:"#14181E",stroke:"#2A303A"}),( ONE MORE","LEAVE THE LIGHTS ON","YOU SIGNED HER NAME","IT IS THREE O'CLOCK"],blackout:"You come to in the chair beside the bed, the cat on your knee, every clock still saying three. For a moment you are sure the man in the bed is breathing. Your evidence is where you left it.",blackoutWake:"You blacked out in Room 9.",hint:"He had weeks left. What went into his drip, and whose vestry was it hidden in?",cold:["ST. JUDE'S HOSPICE \xB7 ROOM 9 \xB7 20 DECEMBER \xB7 02:58","For twenty years Dr. Edwin Sallow was the doctor at St. Brigid's Home. He signed every certificate.","He is dying now, and he is afraid of only one thing: three o'clock in the morning.","At two minutes to three the alarm in Room 9 sounds. On the stroke of three, every clock in the building stops.","His hourglass has run out. The night nurse swears she saw a tall hooded figure in the corridor, walking very slowly away."],coldSub:"He comes at the hour of three, with his glass run out.",briefing:[(0,_.jsxs)(_.Fragment,{children:["At 02:58 ",(0,_.jsx)("b",{className:"text-white",children:"Dr. Edwin Sallow"}),", 78, former doctor at St. Brigid's Home, died in Room 9 of St. Jude's Hospice. He had weeks to live. At 03:00 every clock in the hospice stopped. An antique hourglass beside his bed had just run out."]}),(0,_.jsx)(_.Fragment,{children:"In the 1998 Polaroid, Sallow is the hooded reaper. After tonight there is one page left. Three people were in the building, or just outside it."})],archive:{from:"E. QUILL, ARCHIVIST",text:"Death the Reaper is a newcomer, Detective: a cloak and a scythe that only arrive in the art of the plague years. He carries an hourglass and comes when the sand runs out, and in many houses they stopped the clocks when someone died, so that time would wait for them. Three in the morning is his hour. It is when the old and the sick most often go, and when a hospice is quietest. It is also, I should mention, when a night chaplain is least likely to be missed."},timeline:[["1998",`Dr. Sallow stands on the bank with his scythe, then records Ivy's death as an accident "at the Society's request".`],["1999","Silas Ashdown is adopted and renamed Elliot Silas Quill."],["Oct",`"Rev. Adam Hollis" becomes the hospice's night chaplain.`],["02:20","Julian leaves the car park after ringing the Zurich clinic."],["02:28","An infirmary hourglass is turned on the bedside table."],["02:30","Priya falls asleep in the relatives' room."],["02:40","Potassium chloride is taken from the cabinet with her code."],["02:57",'Sallow presses the call button: "Have you come for me at last?"'],["02:58","Potassium is pushed through his drip. His heart stops."],["03:00",'The master clock fuse is pulled. A child hums: "One more, Silas."']],redTimes:["02:40","02:58","03:00"],greenTimes:["03:00"],verdict:(0,_.jsxs)(_.Fragment,{children:[(0,_.jsx)("b",{className:"text-white",children:'"Rev. Adam Hollis"'}),", born Silas Ashdown known since 1999 as Elliot Silas Quill, archivist of the Occult Crimes Unit, is charged with the murder of Dr. Edwin Sallow. He injected potassium chloride into Sallow's drip at two minutes to three, turned an hourglass from the St. Brigid's infirmary beside him, and pulled the fuse that stopped every clock in the building."]}),after:`This time you do not let him out of your sight. You drive him yourself, cuffed in the back, Commander Hale beside you. At the hospice gates every light in St. Jude's goes out at once and your headlights die. In the dark, in the back seat, he says: "She's leaving the lights on for me." When the headlights come back, the back seat is empty and the cuffs are still locked. Hale gets the call twenty minutes later: Cordelia Marsh, the medium from Hollowmere Manor, has not come home tonight.`,fragment:{n:9,title:"Silas Ashdown became Elliot Quill.",text:"Adoption order, March 1999: Silas Ashdown, 12, renamed Elliot Silas Quill. In 2013 he became archivist of the Unit's Black Archive. He has written the archive note in every one of these files, and every one told you how it was done before you found it."},seal:{ev:"monitor",name:"Leave the Lights On",text:`With both men gone from the room, a little girl hummed the four bars into a dead man's intercom and said, not frightened at all: "One more, Silas. Then come home. I'll leave the lights on."`},lantern:`A carbon copy: "Ivy Ashdown, 9. Accidental drowning. Ten adults present. None entered the water. Recorded as accident at the Society's request."`,nextTease:`On the empty back seat, where he sat, lies the tenth and last page from the 1891 book. "THE GREY WIDOW. She walks the frozen water on the longest nights, looking for the child who was taken from her." Under it, in fresh ink: Cordelia Marsh. And under that, in a child's round hand that no handwriting expert can match to anyone living: "Tonight. The millpond. Bring a torch."`,herrings:[(0,_.jsxs)(_.Fragment,{children:[(0,_.jsx)("b",{className:"text-white",children:"Priya Lal"})," lied about staying at the desk. She fell asleep in the relatives' room after a double shift, and her code was on a card in her locker."]}),(0,_.jsxs)(_.Fragment,{children:[(0,_.jsx)("b",{className:"text-white",children:"Julian Sallow"})," lied about going home. He sat in the car park ringing a Zurich clinic, and never went back inside."]})],real:[`A little girl hummed into a dead man's intercom: "One more, Silas. Then come home."`,"The hospice cat had slept on Sallow's bed for three nights. It got up at 02:57 and sat facing the door.","He vanished from the back seat of a moving car, cuffs still locked."]},ap=jg;var c4=ae(Pe());var z=ae(me());$e({quill:{..._e,skin:"#DCB696",skinD:"#9C7658",rim:"#FBBF24",bg:["#141008","#04050A"],lips:"#8A5A50",brow:"#3A3026",hair:"short",hairC:"#3A3026",outfit:"coat",outfitC:"#1A1C22",accent:"#F59E0B",glasses:"#9CA3AF",pin:!0,motif:"candles",bags:!0}});function Yg({ice:e=100,beat:t=0,ghost:a=!1,empty:o=!1,gun:r=!1}){let n=Math.round((100-e)/9),l=t>=3?1:0,i=Array.from({length:10},(d,f)=>{l
