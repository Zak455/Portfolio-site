",cy:"-8",r:"1.6",fill:"#CBD5E1"}),(0,W.jsx)("circle",{cx:"5",cy:"-6",r:"1.6",fill:"#CBD5E1"})]},t)}),[[300,336],[318,330],[276,342]].map(([e,t],a)=>(0,W.jsx)("path",{d:`M${e} ${t}c4-6 8-6 10 0`,stroke:"#9CA3AF",strokeWidth:"2",fill:"none"},a)),(0,W.jsx)("path",{d:"M498 376l70-6",stroke:"#4A3A28",strokeWidth:"5",strokeLinecap:"round"}),(0,W.jsx)("path",{d:"M540 372l40-3",stroke:"#6B7280",strokeWidth:"2.4"}),(0,W.jsx)("path",{d:"M680 380V250l90-50 90 50v130z",fill:"#1A1A16",stroke:"#34342C",strokeWidth:"2"}),(0,W.jsx)("rect",{x:"704",y:"282",width:"34",height:"28",fill:"#2A2010"}),(0,W.jsx)("rect",{x:"704",y:"282",width:"34",height:"28",fill:"url(#w3hut)",className:"hm-candle"}),(0,W.jsx)("circle",{cx:"721",cy:"296",r:"50",fill:"url(#w3hut)",className:"hm-candle"}),(0,W.jsx)("rect",{x:"772",y:"320",width:"76",height:"60",fill:"#14120E",stroke:"#34342C"}),[0,1,2].map(e=>(0,W.jsx)("g",{children:[0,1,2,3].map(t=>(0,W.jsx)("circle",{cx:784+t*17,cy:334+e*16,r:"7",fill:"#2E2418",stroke:"#4A3A28"},t))},e)),(0,W.jsx)("text",{x:"690",y:"244",fill:"#4B5563",fontFamily:"ui-monospace,monospace",fontSize:"9",letterSpacing:"2",children:"RANGER HUT"})]})}var Lg={id:"f3",n:3,code:"OC-0212",caseNo:"CASE 02",levelNo:"LEVEL 3/10",title:"Hunter's Moon",legend:"The Werewolf",place:"Kell Moor \xB7 The Grey Man stone",victim:"Hamish Rook",ambience:"moor",monster:"wolf",roomName:"Interview Room",roomMood:"WIND AT THE GLASS",sceneName:"Kell Moor",eyeColor:"#FACC15",fog:"#CBD5E1",ashColor:"#CBD5E1",lowSanitySfx:"howl",sceneLabel:"Kell Moor at night under a full moon: the standing stone, the drystone wall, Rook's van and the ranger hut",Scene:bg,evidence:xg,suspects:vg,culprit:"harrow",keyEvidence:["claw"],trueMotive:"staged",motives:[{id:"beast",label:"The Beast of Kell Moor: a werewolf under the hunter's moon"},{id:"dogs",label:"A farmer's dogs, let loose to settle an old grudge"},{id:"son",label:"A son's revenge for thirty years of stolen credit"},{id:"staged",label:"Struck from behind, then raked with a steel claw and ringed with stamped prints"}],shadowSpots:[[250,330],[600,330],[360,300]],hallu:["THREE","COME HOME","IT'S THIN HERE","RUN","HE'S WEARING IT"],blackout:"You come to on all fours in the heather, a long way from the stone, your throat raw as if you have been howling. Your evidence is where you left it.",blackoutWake:"You blacked out and woke in the heather.",hint:"The claw marks are too neat for an animal and the prints are stamped. Whose boots walked beside the big prints, and what did they hide behind their hut?",cold:["KELL MOOR \xB7 THE GREY MAN STONE \xB7 12 FEBRUARY \xB7 06:40","Last night the moon rose full over Kell Moor. The old shepherds call it the hunter's moon.","For thirty years, Hamish Rook sold the world the Beast of Kell Moor.","At dawn a dog walker finds him at the foot of the standing stone, torn open, ringed with pawprints the size of dinner plates.","His rifle is loaded with silver. It was never fired."],coldSub:"Under the hunter's moon, the man becomes the beast he hunts.",briefing:[(0,W.jsxs)(W.Fragment,{children:["At 06:40 a dog walker found ",(0,W.jsx)("b",{className:"text-white",children:"Hamish Rook"}),", 66, cryptozoologist and author of the ",(0,W.jsx)("i",{children:"Beast of Kell Moor"})," books, dead at the foot of the Grey Man standing stone. His chest was torn open in four long lines. Giant pawprints circled him in the frost. His rifle, loaded with silver bullets, had not been fired."]}),(0,W.jsx)(W.Fragment,{children:"The tabloids are calling it a werewolf. The Unit is calling it the third page. Three people were on the moor, or say they weren't."})],archive:{from:"E. QUILL, ARCHIVIST",text:'Werewolf trials ran across Europe for two hundred years. In almost every one the "beast" turned out to be a man: a man in a wolfskin, a man with a blade, a man who wanted very badly to be feared. The claw marks in those old court records are always too neat. Four straight lines, evenly spaced, like a rake.'},timeline:[["1998","Hamish Rook wears a wolf suit on Lantern Night and chases the children round the millpond."],["Nov",`"Ned Harrow" joins Kell Moor as a winter ranger and offers to look after Rook's cameras.`],["23:00","Callum stamps small fake prints near the stone for his father's next book."],["00:00","Callum leaves. Rook stays to watch the stone under the full moon."],["01:41",'A long "howl", sung through a tube. Rook goes to look.'],["01:49",`"You wore one to Saint Brigid's." Rook is struck from behind.`],["01:55","The body is raked with a steel claw and ringed with huge carved prints."],["02:10","Harrow swaps the trail camera card and reseals it with an OCU evidence seal."],["02:30",`Rook's recorder catches a child humming in the wind: "Come home."`],["05:00","Moira's loose wolfhounds find the body."],["06:40","A dog walker calls it in."]],redTimes:["01:49","01:55","02:10"],greenTimes:["02:30"],verdict:(0,W.jsxs)(W.Fragment,{children:[(0,W.jsx)("b",{className:"text-white",children:'"Ned Harrow"'})," is charged with the murder of Hamish Rook. He lured Rook from his van with a fake howl, struck him from behind, raked the body with a rebuilt steel claw, stamped giant prints around it, and resealed the trail camera with an evidence seal stolen from the Occult Crimes Unit."]}),after:"Harrow is cuffed in the back of a patrol car at the moor gate while you bag the claw. When you turn round, the car door is open and the cuffs lie unlocked on the seat. The only prints leading away into the frost are a child's, bare-footed. They stop after twenty yards, in the middle of the open moor.",fragment:{n:3,title:"He has Occult Crimes Unit access.",text:"He resealed the trail camera with a numbered OCU evidence seal from a batch only ever issued to the Unit. He opened his own cuffs. Whoever he is, he has been inside your building."},seal:{ev:"recorder",name:"Come Home",text:'After the killing, under the wind, the same child hummed the same four bars, and said two words to nobody: "Come home."'},lantern:"The Polaroid of the Lantern Night Ten at St. Brigid's, December 1998. Ten costumes. Ten names.",nextTease:'Taped to the back of the Polaroid, under the empty trunk lid: a fourth page from the 1891 book. "LA LLORONA, the Weeping Woman. She walks the water looking for the children she lost." The woman in black lace is circled in red. Beneath, in fresh ink: In\xE9s Calloway.',herrings:[(0,W.jsxs)(W.Fragment,{children:[(0,W.jsx)("b",{className:"text-white",children:"Moira Dunleavy"})," hid that her wolfhounds were loose. They found the body hours after he died."]}),(0,W.jsxs)(W.Fragment,{children:[(0,W.jsx)("b",{className:"text-white",children:"Callum Rook"})," lied about the inn. He stamped fake prints for his father's next book and left him alive at midnight."]})],real:['A child humming the lullaby in the wind at 02:30, and a small voice: "Come home."',"Bare child-sized footprints in the frost, leading away from the patrol car, ending in open moor.","Moira's wolfhounds will not go near the stone now. They lie down and whine at it, facing the same way."]},Xm=Lg;var Mv=ae(Pe());var q=ae(me());$e({rafael:{skin:"#D2A27E",skinD:"#966A4C",iris:"#3B2A1E",rim:"#F472B6",bg:["#22121C","#06060A"],lips:"#8E5A50",brow:"#1E1612",hair:"slick",hairC:"#1A1412",outfit:"suit",outfitC:"#1C1C24",accent:"#E5E7EB",tie:"#831843",mous:"#1A1412",motif:"candles"},ffion:{skin:"#E8C2A8",skinD:"#A8826A",iris:"#4A6070",rim:"#7DD3FC",bg:["#0E1A22","#04060A"],lips:"#9A6A62",brow:"#B8B4AC",hair:"long",hairC:"#C8C4BC",outfit:"coat",outfitC:"#2A3440",motif:"fog",age:!0},ashby:{..._e,skin:"#E0B898",skinD:"#A07A5C",rim:"#38BDF8",bg:["#0A1620","#04060A"],lips:"#8E5E54",brow:"#3A3026",hair:"short",hairC:"#3A3026",outfit:"uniform",outfitC:"#1E3A4A",accent:"#FACC15",motif:"fog",glasses:"#334155"}});var Cg={body:{name:"In\xE9s at the waterline",icon:Ie,x:432,y:372,spot:"Shallows below the bank",curse:7,scene:"In\xE9s Calloway lies face down where the reservoir laps the stones, in a long dress of black lace with a mantilla over her hair, arms spread towards the drowned church as if she were reaching for something under the water. Her feet are bare and very clean.",scan:"tox",method:"Drowning & diatom test",result:`Death by drowning, about 00:40.
But the water in her lungs is TAP WATER: free chlorine 0.4 mg/L, fluoride, and a trace of lavender oil. The reservoir is raw, untreated water, thick with diatoms. There are NO diatoms in her lungs or bone marrow.
Four bruises on the back of her neck, thumb on the RIGHT: she was held under by someone's LEFT hand.`,fact:"In\xE9s drowned in chlorinated tap water with lavender oil, not the reservoir. She was held under from behind by a left hand, then put in the water."},lace:{name:"The black lace dress",icon:Uo,x:512,y:396,spot:"The mantilla and dress",scene:"The lace is the costume from the photographs: La Llorona, the Weeping Woman, the way she wore it for the children on Lantern Night. It is soaked through, and the hooks down the back are done up wrong, one row out all the way down.",scan:"uv",method:"UV blacklight sweep",result:`The lace is NEW, not the 1998 costume: machine-made, the price tag cut off at the collar.
Under UV, fine white crystals glow along the hem and the cuffs: LAVENDER BATH SALTS, the same as the bath water.
The hooks were fastened by someone standing BEHIND her, while she was lying down. She was dressed after she died.`,fact:"The lace dress is new, done up wrong by someone else while she lay still. Lavender bath salts glow in the hem: she was dressed after she died."},speaker:{name:"Child's lifejacket in the reeds",icon:cl,x:238,y:346,spot:"Reed bed by the jetty",curse:5,scene:"A small orange lifejacket, the kind given to children at water-safety classes, floats face down among the reeds. Something heavy is zipped inside it. When the wind drops, you can hear it: a woman sobbing, the same breath, the same catch, again and again.",scan:"evp",method:"EVP audio analysis",scanSfx:"weep",result:`A waterproof Bluetooth speaker, zipped into the jacket.
It is playing a 40-second loop: "Ay, mis hijos... \xBFd\xF3nde est\xE1n mis hijos?" Voice match: IN\xC9S CALLOWAY HERSELF, recorded off the 1998 Lantern Night broadcast, where she wailed it to make the children scream.
The speaker paired at 23:58 with a phone called "LANTERN". Battery: 6%.`,fact:`The weeping is In\xE9s's own wail from the 1998 broadcast, looped through a speaker hidden in a child's lifejacket and paired at 23:58 to a phone called "LANTERN".`},launch:{name:"Water Authority launch",icon:il,x:640,y:332,spot:"The jetty",scene:"The reservoir's survey launch, WATER AUTHORITY 3, is tied up at the jetty, its hull still beaded with water. Its little cabin smells of diesel and something sweeter.",scan:"trace",method:"Bilge, fibre & logbook check",result:`The bilge holds a shallow pool of TAP WATER: chlorine 0.4 mg/L, lavender oil. A match for her lungs and her bath.
On the stern cleat: black lace fibres and a long dark hair (In\xE9s).
The logbook: launch signed out 01:10, back 02:20, "night turbidity sampling", in a careful LEFT-HANDED script. Signed T. ASHBY. No samples were logged.`,fact:"The launch carried her: tap water from her bath in the bilge, her lace on the cleat. It was signed out 01:10 to 02:20 by T. Ashby, left-handed, for samples never taken."},bath:{name:"The cottage bathroom",icon:En,x:116,y:256,spot:"In\xE9s's lakeside cottage",scene:"In\xE9s's cottage sits on the bank above the jetty. In the bathroom the bath is full and stone cold, lavender salts dissolved white in the bottom. The floor is still wet. The cold tap drips, slow as a clock.",scan:"trace",method:"Water & print analysis",result:`The bath water is an exact match for her lungs: tap water, chlorine 0.4 mg/L, lavender oil.

The bathroom door lock is unbroken. She let him in, or he had a key.`,fact:"She drowned in her own lavender bath. Size-11 Water Authority waders stood beside the tub."},spire:{name:"Hydrophone at the drowned spire",icon:Eo,x:440,y:236,spot:"The church spire in the water",anomaly:!0,scanCurse:8,scene:"In the drought the spire of Lowmoor church, drowned in 1952 with the rest of the village, stands up out of the black water. The Water Authority has moored an underwater microphone to its weathervane to listen for leaks in the old valve. The cable runs back to shore.",scan:"evp",method:"Hydrophone analysis",result:`00:00 to 02:00 The lifejacket's weeping, warped by the water.
01:41 Oars. Something heavy lowered over the side, softly.

03:11 A single church bell rings under the water. Lowmoor's bell was taken down in 1951.`,fact:'The hydrophone caught her killer: "She laughed while we ran. Now she can watch the water." At 03:10 a child hummed the lullaby inside the drowned church, and a bell that was removed in 1951 rang once.'},locker:{name:"Locker in the valve tower",icon:Mn,x:792,y:214,spot:"Valve tower on the dam",scene:"At the top of the dam the valve tower has a staff room with four lockers. One is labelled ASHBY. Inside: a spare uniform, waders, a thermos, and a small enamel badge pinned to the back wall at eye level, where you would see it every time you opened the door.",scan:"trace",method:"Object & records check",result:`A child's enamel dormitory badge, blue and white: "ST. BRIGID'S HOME \xB7 BOYS' DORM \xB7 1998". Rubbed almost smooth by a thumb.

On the locker shelf, left behind: a scrap of the same new black lace.`,fact:"Ashby's locker holds a St. Brigid's Home boys' dormitory badge from 1998, worn smooth, and a scrap of the new lace. His file names a ranger service as his last job."},phone:{name:"In\xE9s's phone on the bank",icon:ul,x:316,y:404,spot:"Coat on the stones",scene:"Her coat lies folded on the stones above the waterline, too neatly, her phone in the pocket. The screen lights when you touch it: a message, opened and never answered.",scan:"trace",method:"Phone download",result:`Last call: 23:31, eleven minutes, to RAFAEL.

The coat was folded after she died, by someone else: the sleeves are tucked in the way a left-handed person folds.`,fact:'At 23:50 a withheld number texted: "Sing it for me one more time, Miss Calloway. Like you did for us." Her last call, at 23:31, was eleven minutes with Rafael.'}},Ig=[{id:"rafael",name:"Rafael Medina",role:"Husband & agent",look:{id:"rafael"},motive:"In\xE9s's memoir, due out in May, accuses him of draining \xA3400,000 from her water-safety charity. Her death stops the book.",alibi:"Says he was at home in London all night and spoke to her once, briefly, around eleven.",qs:[{q:"Where were you last night?",a:"London. Our flat. I called her at eleven, we said goodnight. That is all."},{q:"Tell me about the memoir.",a:"Lies, written by a woman who had stopped sleeping. She thought the water was talking to her. She thought children were standing in her garden.",fact:"Rafael: In\xE9s had stopped sleeping and thought children were standing in her garden.",kind:"clue"},{q:"Did she ever talk about Lantern Night?",a:"Once. She said they paid her two thousand pounds to wail at orphans in a lace dress, and a girl ran off into the dark because of it. She gave every penny of her career after that to water safety. Guilt is very good for charities."}],present:{phone:{contra:!0,needsLab:!0,text:"Eleven minutes. Fine. I was not in London, I was in the car outside her cottage. She would not let me in. I told her the book would ruin us both and she said good. I drove away at midnight. She was alive and screaming at me from the window.",fact:"Rafael lied: he was outside the cottage until midnight, arguing about the memoir. He says she was alive when he left."},bath:{needsLab:!0,text:"Lavender. She took a bath every night at half past midnight, like a nun. Anyone who knew her for a week would know that.",fact:"Rafael: In\xE9s took a lavender bath every night at 00:30.",kind:"clue"},lace:{needsLab:!0,text:"That is not her dress. The real one is in a glass case at her charity. She would rather have drowned than put it on again."}},dismiss:["I have nothing to say about that.","Talk to my lawyer.","Do you know who she was? Do you know who I am?"]},{id:"ffion",name:"Ffion Pryce",role:"Last child of drowned Lowmoor",look:{id:"ffion"},motive:"Born in Lowmoor before it was flooded. In\xE9s's charity backed raising the dam, which would put the churchyard, and Ffion's family graves, another twenty feet under.",alibi:"Says she was in bed by ten and heard the weeping from her window.",qs:[{q:"What did you hear?",a:'A woman crying across the water from midnight. "Mis hijos." My mother told me about her. She walks where water has swallowed children.'},{q:"Why does the dam matter to you?",a:"My grandparents are in that churchyard. When the water is low I can see the lychgate. They want to take even that."},{q:"Did you see anyone on the water?",a:"The Authority boat went out with no lights on, around one. It never goes out at night. Never.",fact:"Ffion: the Water Authority launch went out with no lights at about 01:00. It never goes out at night.",kind:"clue"}],present:{speaker:{contra:!0,needsLab:!0,text:"Yes. I lied. I was not in bed. I row out to the spire most nights to talk to them. I heard her crying and I followed it into the reeds, and there was that little jacket. I thought there was a child in it. I thought, God forgive me, she has found another one. I left it there and rowed home and locked the door.",fact:"Ffion lied: she rows to the spire at night. She found the weeping lifejacket in the reeds, thought a child was inside it, and fled home."},spire:{needsLab:!0,text:"The bell. You heard the bell. They took it down before they flooded us. My mother said on some nights you can still hear it ring for the ones who could not be moved."},body:{needsLab:!0,text:"She is reaching for the church. They always reach for the church."}},dismiss:["The water knows more than I do.","I am an old woman. Ask the young.","That means nothing to me."]},{id:"ashby",name:"Tom Ashby",role:"Water sampling technician",look:{id:"ashby"},motive:"None known. He joined the Water Authority in January and runs the reservoir's sampling programme.",alibi:"Says he was off shift, asleep in the staff room at the valve tower, and saw nothing.",qs:[{q:"Where were you last night?",a:"Asleep in the valve tower. We do a night in the tower when the levels are low. Nothing to see but the water."},{q:"Did you know In\xE9s Calloway?",a:"Everyone round the reservoir knows her. She gives talks to schools about not swimming here. The children love her. She does a voice."},{q:"Did the launch go out last night?",a:"Not with me in it."},{q:"What brought you to Lowmoor?",a:"I like water. Still water. You always know where you stand with it, until you don't."}],present:{launch:{contra:!0,needsLab:!0,text:'Ashby reads his own signature in the logbook for a long time. "Turbidity," he says. "That means how clear the water is. How far down you can see." He looks up. "On Lantern Night you could see the whole way down."',fact:'Ashby lied: he signed the launch out at 01:10 in his left-handed script. He says that on Lantern Night "you could see the whole way down."'},locker:{contra:!0,needsLab:!0,text:`He doesn't reach for the badge. He says, "Dorm three. Nine beds. You could hear the millpond from the window, in winter, when it froze. It sings, ice. Did you know that? It sings right before it breaks."`,fact:"Ashby lied about having no link to the dead: his badge is from St. Brigid's Home, 1998. He slept in its boys' dormitory and heard the millpond freeze."},bath:{needsLab:!0,text:"Everyone has a bath, Detective. It's the most dangerous room in the house. More drownings in baths than in all the reservoirs of England. She used to tell the children that."},speaker:{needsLab:!0,text:"Lovely voice. She did it for us. For them. For the children. Two thousand pounds, I heard."}},crack:`Ashby takes his glasses off, folds them with his left hand and lays them on the table. "Four," he says. Then, to the corner of the room, kindly: "I know. She sounded just like that. I'm sorry you had to hear it again."`,crackEnd:"Ashby has turned his chair to face the window, towards the water. You have enough to make an accusation.",dismiss:["Couldn't tell you.","That's not one for the sampling log.","Water doesn't keep secrets, Detective. People do."]}];function Sg(){return(0,q.jsxs)("g",{children:[(0,q.jsxs)("defs",{children:[(0,q.jsxs)("linearGradient",{id:"w4sky",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,q.jsx)("stop",{offset:"0",stopColor:"#070B14"}),(0,q.jsx)("stop",{offset:".6",stopColor:"#0F1A2A"}),(0,q.jsx)("stop",{offset:"1",stopColor:"#0B1220"})]}),(0,q.jsxs)("linearGradient",{id:"w4water",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,q.jsx)("stop",{offset:"0",stopColor:"#0B1626"}),(0,q.jsx)("stop",{offset:".5",stopColor:"#060D18"}),(0,q.jsx)("stop",{offset:"1",stopColor:"#03060C"})]}),(0,q.jsxs)("radialGradient",{id:"w4moon",cx:".5",cy:".5",r:".5",children:[(0,q.jsx)("stop",{offset:"0",stopColor:"#E0F2FE",stopOpacity:".4"}),(0,q.jsx)("stop",{offset:"1",stopColor:"#E0F2FE",stopOpacity:"0"})]}),(0,q.jsxs)("radialGradient",{id:"w4win",cx:".5",cy:".5",r:".5",children:[(0,q.jsx)("stop",{offset:"0",stopColor:"#FBBF24",stopOpacity:".4"}),(0,q.jsx)("stop",{offset:"1",stopColor:"#FBBF24",stopOpacity:"0"})]}),(0,q.jsxs)("linearGradient",{id:"w4refl",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,q.jsx)("stop",{offset:"0",stopColor:"#E0F2FE",stopOpacity:".35"}),(0,q.jsx)("stop",{offset:"1",stopColor:"#E0F2FE",stopOpacity:"0"})]})]}),(0,q.jsx)("rect",{width:"880",height:"440",fill:"url(#w4sky)"}),Array.from({length:30}).map((e,t)=>(0,q.jsx)("circle",{cx:t*131%880,cy:t*41%130,r:t%6?.6:1.1,fill:"#E2E8F0",opacity:.15+t%4*.1,className:t%4?"":"hm-twinkle"},t)),(0,q.jsx)("circle",{cx:"560",cy:"64",r:"80",fill:"url(#w4moon)"}),(0,q.jsx)("circle",{cx:"560",cy:"64",r:"20",fill:"#E2E8F0",opacity:".8"}),(0,q.jsx)("path",{d:"M0 190Q140 150 300 176T600 168T880 150 mMood:"RAIN ON THE WATER",sceneName:"Lowmoor Reservoir",eyeColor:"#7DD3FC",fog:"#BAE6FD",ashColor:"#BAE6FD",lowSanitySfx:"weep",sceneLabel:"Lowmoor Reservoir at night: a church spire standing out of the water, the cottage on the bank, the jetty and the dam",Scene:Sg,evidence:Cg,suspects:Ig,culprit:"ashby",keyEvidence:["launch"],trueMotive:"staged",motives:[{id:"llorona",label:"La Llorona, the Weeping Woman, took her into the water"},{id:"fell",label:"She walked into the reservoir in her old costume, out of guilt"},{id:"money",label:"Her husband silenced the memoir about the stolen charity money"},{id:"staged",label:"Drowned in her own bath, dressed in lace, then carried out by boat"}],shadowSpots:[[300,300],[520,300],[160,280]],hallu:["MIS HIJOS","FOUR","SHE LAUGHED","IT SINGS BEFORE IT BREAKS","LOOK DOWN"],blackout:"You come to on the jetty, soaked to the waist, as if you had walked out into the water and been turned back. Your evidence is where you left it.",blackoutWake:"You blacked out and woke on the jetty, wet to the waist.",hint:"The water in her lungs never came from the reservoir. Where did it come from, and what carried her from there to the shore?",cold:["LOWMOOR RESERVOIR \xB7 1 MARCH \xB7 05:50","In the drought the water has fallen so far that the spire of drowned Lowmoor church stands clear of it again.",'From midnight until two, the whole valley hears a woman weeping across the water. "Mis hijos." My children.',"At first light, In\xE9s Calloway is found face down in the shallows in a dress of black lace.","Twenty-six years ago, she wore that dress to make children scream."],coldSub:"She walks the water looking for the children she lost.",briefing:[(0,q.jsxs)(q.Fragment,{children:["At 05:50 a fisherman found ",(0,q.jsx)("b",{className:"text-white",children:"In\xE9s Calloway"}),", 61, former children's presenter and patron of a water-safety charity, dead in the shallows of Lowmoor Reservoir, dressed as La Llorona, the Weeping Woman. For two hours before, the valley heard a woman sobbing on the water."]}),(0,q.jsx)(q.Fragment,{children:"The fourth page from the 1891 bestiary named her. The Polaroid showed her in that lace. Three people were near the water last night."})],archive:{from:"E. QUILL, ARCHIVIST",text:"La Llorona drowned her own children and walks the riverbanks weeping for them. The tellers in Mexico are careful about one thing: she is always found at the water's edge, never in it. The ones she takes are left where they can be seen. And her water, Detective, is never the river's. Some tellers say it tastes of tears. The old women of Lowmoor used to say it smelled of lavender."},timeline:[["1998",'In\xE9s Calloway wails "Ay, mis hijos" in black lace for the cameras on Lantern Night.'],["Jan",'"Tom Ashby" joins the Water Authority at Lowmoor.'],["23:31","Rafael argues with In\xE9s from his car outside the cottage."],["23:50",'A withheld number: "Sing it for me one more time, Miss Calloway."'],["23:58","The lifejacket speaker starts the looped weeping in the reeds."],["00:00","Rafael drives away. In\xE9s runs her nightly lavender bath."],["00:40","She is held under in her own bath by a left hand."],["01:10","Ashby signs out the launch. She is dressed in new lace and carried out."],["01:41",'"Now she can watch the water." She is laid in the shallows.'],["03:10","Inside the drowned church, a child hums. A bell that is not there rings once."],["05:50","A fisherman finds her."]],redTimes:["00:40","01:10","01:41"],greenTimes:["03:10"],verdict:(0,q.jsxs)(q.Fragment,{children:[(0,q.jsx)("b",{className:"text-white",children:'"Tom Ashby"'})," is charged with the murder of In\xE9s Calloway. He drowned her in her own bath at 00:40, dressed her in new black lace, carried her out on the Water Authority launch and laid her in the shallows, while her own 1998 wail played on a loop from a child's lifejacket in the reeds."]}),after:"Ashby is locked in the valve tower to wait for the van. At 04:00 every officer on the dam hears a woman weeping inside the tower. When they unlock it, it is empty, and the window over the spillway is open. The launch is drifting out towards the spire with no one aboard. On the jetty, in the frost, a trail of small wet footprints runs from the water to the tower door, and stops.",fragment:{n:4,title:"He was a child at St. Brigid's in 1998.",text:"Not one of the Ten. One of the children they performed for. He slept in the boys' dormitory, close enough to hear the millpond freeze, and he kept the badge for twenty-six years."},seal:{ev:"spire",name:"The Drowned Bell",text:"At 03:10, inside a church that has been under water since 1952, a child hummed the four bars, and a bell that was taken down in 1951 rang once, as if to call someone home."},lantern:"A St. Brigid's Home boys' dormitory badge, 1998, rubbed smooth by a thumb.",nextTease:`Folded into the lifejacket's pocket: a fifth page, but not from the 1891 book. A photocopy, freshly made. "BLOODY MARY. Say her name three times in the glass and she will show you who stands behind you." Under it, in red ink: Margot Kestle. And beside the name, small: "You never see the one holding the camera."`,herrings:[(0,q.jsxs)(q.Fragment,{children:[(0,q.jsx)("b",{className:"text-white",children:"Rafael Medina"})," lied about being in London. He was outside the cottage until midnight, fighting about the memoir, and left her alive."]}),(0,q.jsxs)(q.Fragment,{children:[(0,q.jsx)("b",{className:"text-white",children:"Ffion Pryce"})," lied about being in bed. She rowed to the spire, found the weeping lifejacket and fled."]})],real:["At 03:10 a child hummed the lullaby inside the drowned church, underwater.","A church bell rang once under the reservoir. Lowmoor's bell was removed in 1951.","Small wet bare footprints ran from the water to the valve tower door, and stopped there."]},Qm=Ag;var Rv=ae(Pe());var H=ae(me());$e({saffron:{skin:"#F0CDB4",skinD:"#B48C72",iris:"#3F6212",rim:"#F43F5E",bg:["#2A0E16","#06060A"],lips:"#B4495A",brow:"#2A1A14",hair:"long",hairC:"#7F1D1D",outfit:"jumper",outfitC:"#18181B",accent:"#F43F5E",motif:"candles",scar:!0},dennis:{skin:"#8E5E42",skinD:"#5E3C28",iris:"#2A1C14",rim:"#A78BFA",bg:["#16122A","#05060A"],lips:"#6A3E32",brow:"#C8C4BC",hair:"bald",outfit:"coat",outfitC:"#3A3428",beard:"#C8C4BC",glasses:"#A16207",age:!0,bags:!0},lowe:{..._e,skin:"#DEB696",skinD:"#9E785A",rim:"#F87171",bg:["#1A0C0E","#05050A"],lips:"#8A5A50",brow:"#2E241C",hair:"short",hairC:"#2E241C",outfit:"turtleneck",outfitC:"#1F1A18",pin:!0,motif:"arch"}});var Tg={body:{name:"Margot before the glass",icon:Ie,x:430,y:384,spot:"Bathroom floor",curse:8,scene:"Margot Kestle lies on her back on the wet tiles beneath the basin, eyes open, one hand still raised as if to fend something off. Her face is streaked red from both eyes down to the jaw, like tears of blood. The air smells of hot dust and mint.",scan:"trace",method:"Post-mortem & residue",result:`Death by ELECTROCUTION at 02:58. Current burns on both palms where she gripped the basin taps, and on the soles of her bare feet on the wet floor.
The "blood" on her face is STAGE BLOOD: glycerine, red dye, peppermint oil. Her own skin underneath is untouched.
The smears were wiped on after death, from her right temple to her left jaw: drawn by a LEFT hand.`,fact:"Margot was electrocuted at 02:58 through the basin taps. The bloody tears are stage blood, smeared on after death by a left hand."},mirror:{name:"MARY, three times, in red",icon:ll,x:400,y:150,spot:"The bathroom mirror",scene:"The mirror over the basin is new, wide and heavy, set flush into the wall. Across it someone has written MARY three times in thick red streaks, and the glass beneath the third is cracked in a star, as if struck from the other side.",scan:"uv",method:"UV blacklight sweep",result:`The letters are the same stage blood, written in a looping hand at about 22:20. Fingerprints in it: a young woman's, right-handed.
Under UV the glass shows its secret: a reflective coating on only ONE side. This is a TWO-WAY MIRROR. Behind it, a cavity in the wall.
The star crack was struck from BEHIND, from inside the cavity, after the letters were written.`,fact:"MARY was written in stage blood at about 22:20 by a young right-handed woman. The mirror is a two-way glass with a cavity behind it, cracked from the inside."},light:{name:"Mirror lights and basin taps",icon:$o,x:470,y:238,spot:"Under the basin",scene:"A ring of soft LED lights frames the new mirror. Under the basin the cupboard door hangs open on a nest of fresh white cable, a small grey box with a dial, and the copper waste pipe. The taps above are scorched black where she held them.",scan:"trace",method:"Electrical forensics",result:`The lights' earth wire has been CUT and the live feed bridged onto the copper waste pipe: the taps and basin were live at 230 volts.
The grey box is a TIMER, set to switch the circuit on at 02:55 and off at 03:05.
Professional work, every joint twisted the left-handed way. Fitter's label inside the cupboard door: "Installed 13 March \xB7 R. LOWE \xB7 Glass & Lighting".`,fact:"The mirror light was rewired to put 230 volts on the taps between 02:55 and 03:05, on a timer. Neat left-handed work. The fitter's label reads R. Lowe, 13 March."},candle:{name:"Black candle on the sill",icon:Kt,x:250,y:196,spot:"The bathroom window",scene:"A black candle has burned down to a puddle of wax on the windowsill. Rain runs down the glass behind it. A book of matches lies beside it.",scan:"trace",method:"Wax & match check",result:`The candle was lit at about 22:05 and burned out by about 01:30. Long cold by the time she died.
The matchbook is from a phone-case shop in town. On the inside flap, in lipstick: "BM challenge 10pm!! dont tell mum".`,fact:'The black candle was lit at about 22:05 and was out by 01:30. The matchbook reads "BM challenge 10pm!! dont tell mum."'},camera:{name:"The cavity behind the mirror",icon:Ca,x:304,y:306,spot:"Airing cupboard hatch",scene:"Inside the airing cupboard on the landing, a square hatch in the back wall opens onto the dark space behind the bathroom mirror. There is room for a man to stand. On a bracket at eye height, a small camera points through the glass.",scan:"trace",method:"Footage recovery",result:`The camera recorded everything that happened in front of the mirror since 13 March.
22:00 to 22:40: a young woman films herself saying "Bloody Mary" three times by candlelight, writes on the glass, screams on cue, laughs, leaves.
02:57: Margot comes in, half asleep, and turns on the taps. A flash. The picture shakes.
In the dark window behind her, a REFLECTION: a man standing very still in the cavity, about 6 FT 1 measured against the door frame, a small brass LANTERN PIN on his lapel. His face is outside the frame. 03:04: a gloved hand reaches out and stops the recording.`,fact:"The hidden camera caught a reflection in the window: a man in the cavity, about 6 ft 1, with a small brass lantern pin. His face is out of shot."},tape:{name:"The empty tape deck",icon:Do,x:720,y:244,spot:"Margot's edit suite",anomaly:!0,scanCurse:9,scene:`Across the landing, Margot's edit suite: monitors, a professional tape deck, shelves of labelled tapes. One box sits open and empty in front of the deck: "LANTERN NIGHT \xB7 23.12.98 \xB7 CAMERA A \xB7 UNCUT \xB7 DO NOT BROADCAST". The deck is still warm.`,scan:"evp",method:"EVP audio analysis",result:`The tape is gone, but the deck's memory still holds the last 90 seconds it played, at 02:20.
Children screaming, laughing. A wolf howl, a man (Rook). A woman wailing in Spanish (In\xE9s). Running feet on frozen grass.
A small girl, close to the microphone, out of breath: "Wait for me! Wait! It's thin here!"
Then, laid OVER the 1998 sound, louder than it should be, from no source on the tape: a child humming the same four bars of the lullaby. A technician logged this tape in 1999. There was no humming on it then.`,fact:`The uncut 1998 tape is gone. The deck's memory holds a girl on the ice crying "Wait for me! It's thin here!" and a child humming the lullaby over it that was never recorded.`},letter:{name:"A letter from Ambrose Vane",icon:qo,x:810,y:330,spot:"Margot's desk",scene:"In the top drawer of the edit desk, under a pile of invoices, an envelope in handwriting you have seen before: on a letter in Vane's study, a week after he died. This one is to Margot. It was opened and read many times.",scan:"trace",method:"Document check",result:`Dated 14 December, a week before Ambrose Vane was killed at Hollowmere Manor:
"Margot. I am going to tell them, all of it. You still have Camera A, the part we cut. Give it to the police before he finds you. He has been in the archive. He has read everything we wrote about that night. He is closer than you think. A.V."
Postscript: "He was always the quiet one, Margot. He stood at the edge and watched."`,fact:'Vane wrote to Margot a week before he died: give the uncut tape to the police "before he finds you. He has been in the archive." "He was always the quiet one. He stood at the edge and watched."'},ringlight:{name:"Streaming kit on the landing",icon:Ho,x:96,y:300,spot:"The landing",scene:"A ring light on a tripod, folded and left against the banister. A microphone with a fluffy cover. A jar of stage blood, half empty, with a peppermint label. Someone left in a hurry and meant to come back for it.",scan:"trace",method:"Prints & device log",result:`Fingerprints on everything: one young woman, right-handed, the same as the MARY letters.
The ring light's app shows one session: "BLOODY MARY CHALLENGE @ MUM'S HAUNTED HOUSE", live 22:00 to 22:40, 31,000 viewers.
The stage blood is the same mix as on the mirror and on Margot's face.`,fact:"Saffron live-streamed a Bloody Mary challenge in her mother's bathroom from 22:00 to 22:40, using the same stage blood that is on the mirror and Margot's face."}},Mg=[{id:"saffron",name:"Saffron Kestle",role:"Daughter, horror streamer",look:{id:"saffron"},motive:"Margot had stopped funding her and was rewriting her will in favour of a children's charity. Saffron inherits the house and the archive.",alibi:"Says she was at a friend's flat in town all night and hasn't been to her mother's house in a month.",qs:[{q:"Where were you last night?",a:"At Jodie's. In town. We watched films. I haven't been to Mum's in weeks, we weren't speaking."},{q:"What were you and your mother fighting about?",a:"Money, and that tape. She was going to put it on telly. Lantern Night. She said it was the only good thing she'd ever do with her life and she was going to do it before she died."},{q:"Do you believe in Bloody Mary?",a:"I believe in 31,000 people watching me pretend to. That's rent.",fact:"Saffron makes a living pretending to see ghosts for an audience.",kind:"clue"}],present:{ringlight:{contra:!0,needsLab:!0,text:"Okay. OKAY. I did the stream there. Mum's bathroom is the creepiest room in England, the views are mental. I let myself in at ten, did the challenge, wrote on the mirror, screamed a bit. I was out by quarter to eleven. She was asleep. I didn't even go in her room.",fact:"Saffron lied: she streamed the Bloody Mary challenge in the bathroom from 22:00 and wrote MARY on the mirror. She says she left at 22:45 while her mother slept."},camera:{needsLab:!0,text:"There was a camera behind the MIRROR? In my mum's bathroom? Who does that? Who has been watching that room?"},body:{needsLab:!0,text:"That's my blood. My fake blood. I didn't put it on her. I swear I didn't put it on her."}},dismiss:["No idea.","Can I go? I'm meant to be live at six.","That's not content, that's just sad."]},{id:"dennis",name:"Dennis Raine",role:"Sound recordist, Lantern Night 1998",look:{id:"dennis"},motive:"The uncut tape shows he kept his boom pointed at the millpond and kept recording while a child screamed on the ice. If it airs, he is the man who held the microphone.",alibi:"Says he was at home asleep in Wexcombe and last spoke to Margot a fortnight ago.",qs:[{q:"What happened on Lantern Night?",a:"We were filming a Christmas special. Ten grown-ups dressed as monsters to scare the kids for the camera. Margot wanted screams. We got screams."},{q:"What is on the uncut tape?",a:"The bit after. When the costumes stopped being funny. The little girl ran out onto the pond. We had the light on her. I had the boom on her. Nobody moved. We were waiting to see what would make better television.",fact:"Dennis: on the uncut tape, the crew kept filming the girl on the ice and nobody moved.",kind:"clue"},{q:"Who else was on the crew?",a:"Margot, me, a runner, a lighting man. The kids from the home were watching from the bank. One of the boys tried to go after her. The warden held him back by the collar.",fact:"Dennis: a boy from the home tried to go after the girl on the ice. The warden held him back.",kind:"clue"}],present:{tape:{contra:!0,needsLab:!0,text:"All right. I came over at one. I have a key, I always have. I was going to take it, or beg her, I don't know. The deck was warm and the box was empty. It was already gone. I stood in that room and I could hear someone breathing, and I ran. I didn't even look in the bathroom.",fact:"Dennis lied: he let himself in at 01:00 to take the tape, found the box already empty, heard breathing and ran."},letter:{needsLab:!0,text:"The quiet one. God. There was a boy who never cried. Stood at the edge of everything. You forget the quiet ones. That's the point of them."},light:{needsLab:!0,text:"I'm a sound man. I couldn't wire a plug. Ask whoever put that mirror in."}},dismiss:["I don't remember.","It was a long time ago.","I just held the microphone."]},{id:"lowe",name:"Rowan Lowe",role:"Glazier & lighting fitter",look:{id:"lowe"},motive:"None known. He fitted Margot's new bathroom mirror and lights on 13 March and was paid in full.",alibi:"Says he finished the job nine days ago and was at home last night. He came back this morning only to quote for the cracked glass.",qs:[{q:"You fitted the mirror?",a:"Two weeks ago. She wanted something big, with lights. She said she wanted to see herself properly before the end."},{q:"Why come back this morning?",a:"She left a message about a crack. I came to quote. Your officers were already here."},{q:"Did you know who she was?",a:"A television woman. She showed me photographs on the stairs. Christmas specials. All the children smiling at the camera."},{q:"That pin on your coat.",a:"A gift, a long time ago. A little lantern. To light the way home.",fact:'Lowe wears a small brass lantern pin: "a gift, a long time ago. To light the way home."',kind:"clue"}],present:{light:{contra:!0,needsLab:!0,text:'Lowe reads his own label and smiles slightly. "Proper job, that. Earth cut, live to the pipe, timer at five to three. She always woke at three, Detective. Every night. Old people do. Do you know who taught me that? A warden. He used to check the dormitory at three."',fact:"Lowe lied about not returning: the rewiring is his work, set for 02:55 because Margot always woke at three. He learned that habit from a warden checking a dormitory."},camera:{contra:!0,needsLab:!0,text:'He looks at the reflection for a long time: himself, headless, six foot one, the lantern on his coat. "You never see the one holding the camera," he says. "She taught me that. She held it for an hour and never once came down to the ice."',fact:"Lowe is the man in the reflection behind the two-way glass. He says Margot held the camera for an hour and never came down to the ice."},tape:{needsLab:!0,text:"Old tapes. Nobody watches them anymore. They just sit on shelves, waiting."},letter:{needsLab:!0,text:"Vane wrote beautiful letters. He wrote one to everybody, at the end. Sorry, sorry, sorry. Paper doesn't float, Detective."}},crack:'Lowe unpins the little brass lantern from his coat and sets it upright on the table between you, like a candle. "Five," he says. "Halfway." Then he looks past your shoulder, at the two-way glass of the interview room, and gives a small, tired wave.',crackEnd:"Lowe is watching his own reflection in the interview-room glass. You have enough to make an accusation.",dismiss:["Couldn't say.","I just do the glass.","Mirrors don't lie, Detective. People stand behind them."]}];function Eg(){return(0,H.jsxs)("g",{children:[(0,H.jsxs)("defs",{children:[(0,H.jsxs)("linearGradient",{id:"w5wall",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,H.jsx)("stop",{offset:"0",stopColor:"#0E0C10"}),(0,H.jsx)("stop",{offset:"1",stopColor:"#16121A"})]}),(0,H.jsxs)("linearGradient",{id:"w5mir",x1:"0",y1:"0",x2:"1",y2:"1",children:[(0,H.jsx)("stop",{offset:"0",stopColor:"#1E2633"}),(0,H.jsx)("stop",{offset:".5",stopColor:"#0C1018"}),(0,H.jsx)("stop",{offset:"1",stopColor:"#1A2230"})]}),(0,H.jsxs)("radialGradient",{id:"w5led",cx:".5",cy:".5",r:".5",children:[(0,H.jsx)("stop",{offset:"0",stopColor:"#FDE68A",stopOpacity:".35"}),(0,H.jsx)("stop",{offset:"1",stopColor:"#FDE68A",stopOpacity:"0"})]}),(0,H.jsxs)("radialGradient",{id:"w5mon",cx:".5",cy:".5",r:".5",children:[(0,H.jsx)("stop",{offset:"0",stopColor:"#60A5FA",stopOpacity:".35"}),(0,H.jsx)("stop",{offset:"1",stopColor:"#60A5FA",stopOpacity:"0"})]}),(0,H.jsxs)("pattern",{id:"w5tile",width:"22",height:"22",patternUnits:"userSpaceOnUse",children:[(0,H.jsx)("rect",{width:"22",height:"22",fill:"#121016"}),(0,H.jsx)("path",{d:"M0 0h22v22",fill:"none",stroke:"#1E1A22",strokeWidth:"1.2"})]})]}),(0,H.jsx)("rect",{width:"880",height:"440",fill:"url(#w5wall)"}),(0,H.jsx)("rect",{x:"0",y:"0",width:"180",height:"440",fill:"#0A090C"}),(0,H.jsx)("path",{d:"M0 360h180",stroke:"#2A2420",strokeWidth:"4"}),[20,50,80,110,140].map(e=>(0,H.jsx) 2",height:"70",fill:t%3?"#1F1F27":"#27272F",stroke:"#111"},t))]})}var Bg={id:"f5",n:5,code:"OC-0322",caseNo:"CASE 02",levelNo:"LEVEL 5/10",title:"Three Times in the Glass",legend:"Bloody Mary",place:"The Old Vestry, Wexcombe",victim:"Margot Kestle",ambience:"mirror",monster:"mary",roomName:"Interview Room",roomMood:"THE GLASS IS WATCHING",sceneName:"The Old Vestry",eyeColor:"#F87171",fog:"#FDA4AF",ashColor:"#FDA4AF",lowSanitySfx:"glass",sceneLabel:"A converted vestry at night: the landing, a tiled bathroom with MARY written on the mirror, and an edit suite full of tapes",Scene:Eg,evidence:Tg,suspects:Mg,culprit:"lowe",keyEvidence:["light"],trueMotive:"staged",motives:[{id:"mary",label:"Bloody Mary reached through the glass after her name was said three times"},{id:"fault",label:"A wiring fault in a cheap new mirror, a tragic accident"},{id:"heir",label:"A daughter cut out of the will, staging a ghost for her viewers"},{id:"staged",label:"A rewired mirror light on a timer, watched from behind two-way glass"}],shadowSpots:[[400,140],[300,300],[560,260]],hallu:["MARY","FIVE","BEHIND YOU","WAIT FOR ME","HE IS IN THE GLASS"],blackout:"You come to on the bathroom floor with your palms flat on the cold tiles, staring up at the mirror. For a moment the reflection is still looking down at you after you sit up. Your evidence is where you left it.",blackoutWake:"You blacked out on the bathroom floor.",hint:"Her burns are on her palms, not her face. What made the taps deadly at 02:58, and whose name is inside the cupboard under the basin?",cold:["THE OLD VESTRY \xB7 WEXCOMBE \xB7 22 MARCH \xB7 03:20","Margot Kestle filmed Lantern Night. She is not in the Polaroid. Someone had to hold the camera.","At three in the morning a neighbour sees the vestry's bathroom light pulse, and pulse, and go dark.","Margot is on the floor beneath the mirror, crying blood. On the glass, three times: MARY.","Say her name three times, children used to say, and she will show you who is standing behind you."],coldSub:"You never see the one holding the camera.",briefing:[(0,H.jsxs)(H.Fragment,{children:["At 03:20 police found ",(0,H.jsx)("b",{className:"text-white",children:"Margot Kestle"}),", 63, the documentary producer who filmed the 1998 Lantern Night broadcast, dead on her bathroom floor beneath a mirror with MARY written across it three times. She was making a 25th-anniversary film using the footage that never aired."]}),(0,H.jsx)(H.Fragment,{children:"She was not one of the Ten, and the 1891 book has no page for her. The killer made one. Three people had keys to her house, or reasons to want one."})],archive:{from:"E. QUILL, ARCHIVIST",text:"Bloody Mary is a children's game, Detective: three times, in the dark, with a candle. The oldest versions are older than mirrors; you looked into still water. The stories never say what happens to the one who looks. They only say she reaches through the glass, and her touch stops the heart at once. That is not a bad description of a current, if you think about it. Nor is a mirror that looks back a bad description of a window."},timeline:[["1998","Margot Kestle films Lantern Night and keeps the uncut Camera A tape."],["14 Dec",'Ambrose Vane writes to her: "Give it to the police before he finds you."'],["13 Mar",'"Rowan Lowe" fits a two-way mirror, a camera cavity and rewired lights.'],["22:00","Saffron streams the Bloody Mary challenge and writes MARY on the glass."],["22:45","Saffron leaves. Margot is asleep."],["01:00","Dennis lets himself in for the tape. The box is already empty. He runs."],["02:20","The uncut tape is played one last time in the edit suite, then taken."],["02:55","The timer puts 230 volts on the basin taps."],["02:58","Margot wakes, as she always does at three, and turns on the taps."],["03:04","Stage blood is smeared on her face. The camera is switched off."],["03:20","A neighbour calls it in."]],redTimes:["02:55","02:58","03:04"],greenTimes:["02:20"],verdict:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)("b",{className:"text-white",children:'"Rowan Lowe"'})," is charged with the murder of Margot Kestle. He installed a two-way mirror with a cavity behind it, rewired its lights to put mains current on the taps at five to three, watched her die through his own glass, painted her with stage blood, and took the uncut Lantern Night tape."]}),after:"Lowe is held in an interview room with a two-way mirror, two officers watching from behind it. At 04:10 both of them say the same thing: they looked down at their notes for a moment, and when they looked up, the reflection of the room was still there but the man in it was gone. The door was locked. On the table stands a small brass lantern pin, upright, as if it were lit.",fragment:{n:5,title:"About 6 ft 1. Wears a brass lantern pin.",text:'Caught as a reflection in the window behind his own two-way glass: six foot one against the door frame, a small brass lantern on his coat, "to light the way home". He wanted the camera to see him. Just not his face.'},seal:{ev:"tape",name:"Wait For Me",text:`Over the 1998 sound of a girl on the ice calling "Wait for me! It's thin here!", a child hummed the four bars, on a tape that had no humming on it when it was logged in 1999.`},lantern:`Vane's letter to Margot: "Give Camera A to the police before he finds you. He has been in the archive. He was always the quiet one."`,nextTease:'Pinned inside the tape box where the cassette should be: a sixth page from the 1891 book. "THE HEADLESS RIDER. He rides the corpse road at night looking for his head, and takes another in its place." Under it, in fresh ink: Bertram Fenwick.',herrings:[(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)("b",{className:"text-white",children:"Saffron Kestle"})," lied about being in town. She streamed a Bloody Mary challenge in the bathroom and wrote MARY on the glass, then left her mother asleep."]}),(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)("b",{className:"text-white",children:"Dennis Raine"})," lied about being home. He let himself in to take the tape, found it already gone and fled."]})],real:["A child humming over a 1998 tape that had no humming on it in 1999.","Two officers watched a reflection of an empty chair where a man was sitting.","The mirror's crack was struck from behind, from the cavity, after the killer had already left it."]},Jm=Bg;var Wv=ae(Pe());var Y=ae(me());$e({tess:{skin:"#E6BC9C",skinD:"#A88066",iris:"#5A4A2A",rim:"#FB923C",bg:["#22160C","#06060A"],lips:"#A0605A",brow:"#5A3A1E",hair:"bun",hairC:"#7A4A22",outfit:"waxed",outfitC:"#3A2E1E",motif:"fog",scar:!0},rupert:{skin:"#F0C8B0",skinD:"#B08870",iris:"#5A7A96",rim:"#FCA5A5",bg:["#1E1414","#06060A"],lips:"#B06A60",brow:"#C8A060",hair:"slick",hairC:"#C8A060",outfit:"coat",outfitC:"#2A3A2A",accent:"#7A1F2B",motif:"arch",bags:!0},seward:{..._e,skin:"#D8AE8E",skinD:"#987052",rim:"#F97316",bg:["#1A0F08","#05050A"],lips:"#8A5A4E",brow:"#2A2018",hair:"cap",hairC:"#2A2018",outfit:"jumper",outfitC:"#2A2420",beard:"#3A2E22",pin:!0,motif:"candles"}});var Fg={body:{name:"Fenwick on the corpse road",icon:Ie,x:420,y:372,spot:"The road below the bridge",curse:8,scene:"Bertram Fenwick lies on his back in the mud of the old corpse road in full hunting pink, one boot still in a stirrup leather torn from the saddle. His throat has been cut almost through by one clean line. Someone has set a carved turnip lantern on his chest, and it is still burning.",scan:"trace",method:"Wound analysis",result:`Death at about 00:04, almost instant.
The wound is a thin, perfectly straight cut across the throat, deepest at the front, made by something taut and narrow met at speed: a WIRE, not a blade.
Measured from the road, the line sits at exactly 1.9 m: the height of a rider's throat on a sixteen-hand horse.
The turnip was placed on him after death and lit with a match.`,fact:"Fenwick was killed at about 00:04 by a taut wire across the road at 1.9 m, the height of a rider's throat. The turnip lantern was placed and lit after death."},turnip:{name:"The turnip lantern",icon:Kt,x:506,y:350,spot:"On his chest",scene:"A big turnip, hollowed out and carved with a grinning face, a stub of candle inside. Before pumpkins, this is how the old country made lanterns for the night when the dead walk.",scan:"trace",method:"Tool-mark analysis",result:`Carved with a short, very sharp knife, every stroke drawn LEFT to right from the left hand.
The face copies the papier-m\xE2ch\xE9 head the Headless Rider carried under his arm in the 1998 Polaroid, feature for feature.
Scratched inside the shell, under the candle: a lantern inside a ring, and the number 6.`,fact:"The turnip was carved left-handed into a copy of the 1998 rider's head, with the lantern sigil and the number 6 scratched inside."},oaks:{name:"The two oaks",icon:hl,x:576,y:222,spot:"Either side of the road",scene:"Two old oaks stand either side of the corpse road where it narrows before the bridge, their branches meeting overhead. The village says the coffins used to rest under them. Nothing hangs between them now.",scan:"trace",method:"Bark & residue check",result:`Fresh score marks cut into the bark of BOTH trunks at 1.9 m, wrapping right round. Bright flecks of galvanised steel are embedded in them.
A wire was tensioned tight between the trees with a ratchet, then cut loose and taken away after.
Beneath each tree: the heel marks of size-11 riding boots, standing for a long time.`,fact:"A steel wire was ratcheted tight between the two oaks at 1.9 m, then removed. Size-11 riding boots stood waiting under both trees."},hooves:{name:"Hoofprints in the mud",icon:ba,x:300,y:404,spot:"The road surface",scene:"The corpse road is churned with hoofprints. Some are deep and spread wide at a gallop; others are tidier. Half the village swears the headless rider went north, towards the church. The other half swears south.",scan:"trace",method:"Print analysis",result:`TWO HORSES.
One: Fenwick's big grey, galloping south, towards the oaks.
Two: a smaller, heavier horse, a cob, also going south, behind him. But its shoes were nailed on BACKWARDS, an old smugglers' trick, so its prints seem to run north.
The shoes are hand-forged, the nail holes punched by a working farrier.`,fact:"A second horse, a cob, followed Fenwick south. Its hand-forged shoes were nailed on backwards so it seemed to ride north."},forge:{name:"The farrier's van",icon:Tn,x:772,y:330,spot:"Hunt kennels yard",scene:"A mobile forge van is parked in the hunt kennels yard: anvil, gas forge, racks of shoes, coils of wire. The forge is still faintly warm. A logbook hangs from a nail by the door.",scan:"trace",method:"Tool & residue analysis",result:`A coil of galvanised fencing wire with a ratchet tensioner. One end is freshly cut. The ratchet teeth are packed with OAK bark, and the wire carries Bertram Fenwick's blood.
On the anvil: four cob shoes with the nail holes punched in reverse, one still unfinished.
The logbook is filled in in a neat LEFT-handed hand: "L. SEWARD. Coldharbour Hunt. February to May."`,fact:"The farrier's van holds the wire, its ratchet full of oak bark and Fenwick's blood on it, and reverse-punched cob shoes. The logbook belongs to L. Seward."},costume:{name:"The Rider's costume",icon:Uo,x:700,y:176,spot:"Hunt stable loft",curse:5,scene:"In the loft above the hunt stables, hung on a saddle rack like a body: the Headless Rider. A great black coat with padded shoulders built up past where a head should be, a slit for the eyes hidden in the chest, a high stiff collar around nothing. It is still damp at the hem.",scan:"uv",method:"UV & odour analysis",result:`The sewn-in label: "HOLLOWMERE SOCIETY \xB7 LANTERN NIGHT 1998 \xB7 B.F." This is Fenwick's own costume.
It reeks of CAMPHOR: the mothball smell of archive storerooms, where old paper and cloth are kept from moths.
Under UV, on the lining: the square glue scar of a removed ARCHIVE ACCESSION LABEL.
Worn last night: fresh sweat at the collar, cob hair on the hem.`,fact:"Fenwick's own 1998 rider costume was worn last night. It reeks of camphor, the archive-storeroom smell, and once had an archive accession label."},lychgate:{name:"The lychgate coffin stone",icon:Eo,x:130,y:256,spot:"Coldharbour church",anomaly:!0,scanCurse:8,scene:"At the top of the corpse road stands the lychgate of Coldharbour church, where coffins were rested before burial. A long flat coffin stone lies under its roof. The frost on it has not been touched. The bell ringers say the bell rang thirteen times at midnight, and none of them were in the tower.",scan:"uv",method:"UV blacklight sweep",result:`Under UV, in the undisturbed frost on the coffin stone:
The print of a small hand, a child's, about nine years old, pressed flat as if from BELOW the stone.
Beside it, traced with one finger, the letters EMOH EMOC: "COME HOME", written so that it reads right from the other side.
No footprints anywhere near.`,fact:`On the frosted coffin stone: a nine-year-old's handprint pressed from below, and "COME HOME" traced backwards, to be read from the other side.`},lamp:{name:"Poacher's lamp in the ditch",icon:Kn,x:196,y:384,spot:"The ditch",scene:"In the ditch beside the road, dropped in a hurry: a powerful lamp with a red filter, a long-net, and two dead cock pheasants, still warm when the first officer arrived.",scan:"trace",method:"Prints & timing",result:`Fingerprints on the lamp: Rupert Fenwick's.
The pheasants died around 23:30, netted from their roost.
The lamp was dropped at about 00:05, still switched on, its battery run flat by dawn.`,fact:"Rupert Fenwick was poaching pheasants by lamp in the woods and dropped everything in the ditch at about 00:05."}},Ng=[{id:"tess",name:"Tess Raikes",role:"Head groom",look:{id:"tess"},motive:"Fenwick sacked her last week and served notice on her tied cottage. Thirty years with his horses, out by June.",alibi:"Says she was asleep in her cottage and heard the grey come home riderless at about one.",qs:[{q:"What happened last night?",a:"He rides the bounds every May Eve at midnight. Forty years. The grey came back at one with an empty saddle and a broken leather. I knew."},{q:"Why did he sack you?",a:"I told him what I thought of Lantern Night. I was there, I was nineteen, I held his horse while he put that thing on. He rode the grey right down to the millpond after the kiddies. I told him he should have been the one who went under.",fact:"Tess: Fenwick rode his horse down to the millpond after the children on Lantern Night.",kind:"clue"},{q:"Did you see the headless rider?",a:"No. I heard hooves going past my window, after midnight. Not the grey. Heavier. Short-strided. A cob.",fact:"Tess heard a cob, not Fenwick's grey, pass her window after midnight.",kind:"clue"}],present:{hooves:{contra:!0,needsLab:!0,text:"Shoes on backwards. Oh God. That's Jupiter, my old cob. He lives in the far paddock. I found him back in the field at two, lathered and shaking, in shoes I never put on him. I said nothing. Fenwick would have said I lent him out to whoever did it.",fact:"Tess lied about sleeping through it: the second horse was her cob, Jupiter. She found him back at 02:00 in strange shoes and hid it."},costume:{needsLab:!0,text:`That coat. He kept it in a glass case in the hall till last year, then gave it to some museum. "For the archive." I never thought I'd see it again.`,fact:'Tess: Fenwick gave his 1998 costume to "some museum, for the archive" last year.',kind:"clue"},body:{needsLab:!0,text:"A wire. Across the corpse road. My grandad said they used to string a rope there on May Eve to stop the rider. To stop him."}},dismiss:["Ask the horses. They're more honest.","Not my business.","I've stables to muck out."]},{id:"rupert",name:"Rupert Fenwick",role:"Nephew & heir",look:{id:"rupert"},motive:"Owes \xA3200,000 to people who do not send letters. He inherits Coldharbour and everything on it.",alibi:"Says he was at the Plough until closing and then in bed at the hall.",qs:[{q:"Where were you last night?",a:"The Plough. Then bed. I'm not a horse person. I don't do midnight."},{q:"Your debts.",a:"Are my business and will be settled. Uncle Bertie would have helped eventually. He liked to make you beg first."},{q:"What do you know about Lantern Night?",a:"Family legend. Uncle Bertie rode a horse at some orphans for a television programme. He told it as a funny story at Christmas. He stopped telling it about five years ago. Stopped sleeping too, I think."}],present:{lamp:{contra:!0,needsLab:!0,text:"Fine! I was lamping his pheasants. You can get forty quid a brace in town. I was in the ditch at midnight and something came down the road. A horse. A man on it with no head, Detective. Shoulders and a collar and nothing. It went past me so close I felt the cold off it. I dropped everything and ran.",fact:"Rupert lied about the pub: he was poaching in the woods and saw the headless rider pass him at about midnight."},oaks:{needsLab:!0,text:"Someone stood there for an hour waiting for him to come. In the dark. I'd have heard them, surely. Unless they didn't breathe."},forge:{needsLab:!0,text:"The farrier? Quiet bloke. Smells of mothballs. Uncle Bertie took to him, said he had a proper respect for the old ways.",fact:'Rupert: the farrier is quiet, "smells of mothballs", and Fenwick liked his respect for the old ways.',kind:"clue"}},dismiss:["No comment.","I'd like my solicitor present for anything clever.","Is that a question or a mood?"]},{id:"seward",name:"Luke Seward",role:"Travelling farrier",look:{id:"seward"},motive:"None known. He has shod the hunt's horses since February and is well liked in the yard.",alibi:"Says he was asleep in his van in the kennels yard and never left it.",qs:[{q:"Where were you at midnight?",a:"In my van. Early start. You don't shoe hunters on four hours' sleep."},{q:"What did Fenwick think of you?",a:"He liked me. He liked anyone who'd listen to him talk about the old customs. May Eve. The corpse road. The rider."},{q:"What's that smell?",a:"Camphor. Mothballs. My good coat lives in a cupboard most of the year.",fact:"Seward smells strongly of camphor, the mothball smell.",kind:"clue"},{q:"Do you know the story of the rider?",a:"He rides the corpse road looking for his head. In the old tellings he isn't evil, you know. Only lost. He just wants to be carried home like the others."}],present:{forge:{contra:!0,needsLab:!0,text:'Seward runs his thumb along the cut end of the wire. "Galvanised. Two pounds a metre. He said the old village strung a rope across the road to stop the rider." He looks up. "They had it the wrong way round. You string it to stop the man on the horse."',fact:"Seward lied about staying in his van: the wire, its ratchet full of oak bark and Fenwick's blood on it, came from his forge."},costume:{contra:!0,needsLab:!0,text:'He breathes in the camphor like a man smelling bread. "He gave it to the archive, did you know? Proud of it. Lantern Night, 1998. Catalogue number and everything. I only borrowed it back." He smiles. "Nobody ever checks the archive."',fact:'Seward wore the rider costume. He says Fenwick gave it to "the archive" and he "only borrowed it back. Nobody ever checks the archive."'},hooves:{needsLab:!0,text:"Shoes on backwards. Old trick. Fenwick taught me that one himself, over a whisky. He liked teaching."},lychgate:{needsLab:!0,text:'Seward goes very quiet. "From underneath," he says. "Always from underneath."'}},crack:`Seward takes off his cap and lays it on the table, crown down, like an offering. "Six," he says. Then, to the empty chair beside you, so softly you nearly miss it: "Four more. Then I'll come. I promise."`,crackEnd:"Seward is sitting with his eyes closed, lips moving, counting. You have enough to make an accusation.",dismiss:["Couldn't tell you.","Ask the horse.","I just do the feet."]}];function Dg(){return(0,Y.jsxs)("g",{children:[(0,Y.jsxs)("defs",{children:[(0,Y.jsxs)("linearGradient",{id:"w6sky",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,Y.jsx)("stop",{offset:"0",stopColor:"#0A0806"}),(0,Y.jsx)("stop",{offset:".6",stopColor:"#1A120A"}),(0,Y.jsx)("stop",{offset:"1",stopColor:"#0C0907"})]}),(0,Y.jsxs)("radialGradient",{id:"w6moon",cx:".5",cy:".5",r:".5",children:[(0,Y.jsx)("stop",{offset:"0",stopColor:"#FDBA74",stopOpacity:".35"}),(0,Y.jsx)("stop",{offset:"1",stopColor:"#FDBA74",stopOpacity:"0"})]}),(0,Y.jsxs)("radialGradient",{id:"w6flame",cx:".5",cy:".5",r:".5",children:[(0,Y.jsx)("stop",{offset:"0",stopColor:"#FB923C",stopOpacity:".55"}),(0,Y.jsx)("stop",{offset:"1",stopColor:"#FB923C",stopOpacity:"0"})]}),(0,Y.jsxs)("linearGradient",{id:"w6road",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,Y.jsx)("stop",{offset:"0",stopColor:"#1A140E"}),(0,Y.jsx)("stop",{offset:"1",stopColor:"#2A2016"})]})]}),(0,Y.jsx)("rect",{width:"880",height:"440",fill:"url(#w6sky)"}),(0,Y.jsx)("circle",{cx:"300",cy:"70",r:"110",fill:"url(#w6moon)"}),(0,Y.jsx)("circle",{cx:"300",cy:"70",r:"28",fill:"#FED7AA",opacity:".75"}),(0,Y.jsx)("g",{fill:"#0A0806",children:Array.from({length:30}).map((e,t)=>(0,Y.jsx)("path",{d:`M${t*32-10} 230l16-${60+t*37%70} 16 ${60+t*37%70}z`},t))}),(0,Y.jsx)("path",{d:"M40 240v-60l40-30 40 30v60z",fill:"#120E0A",stroke:"#2A2218"}),(0,Y.jsx)("path",{d:"M64 150v-50l16-20 16 20v50",fill:"#120E0A",stroke:"#2A2218"}),(0,Y.jsx)("rect",{x:"74",y:"112",width:"12",height:"16",fill:"#0A0806"}),(0,Y.jsx)("path",{d:"M90 280v-40l40-24 40 24v40",fill:"none",stroke:"#3A2E22",strokeWidth:"5"}),(0,Y.jsx)("path",{d:"M86
