rm:"translate(420 300)",children:[(0,z.jsx)("path",{d:"M-22 44q-4-40 22-56 26 16 22 56z",fill:"#6B7280",opacity:".9"}),(0,z.jsx)("path",{d:"M-18 -8q18-26 36 0l6 40h-48z",fill:"#9CA3AF",opacity:".75"}),(0,z.jsx)("ellipse",{cx:"0",cy:"-4",rx:"8",ry:"10",fill:"#D6CFC6",opacity:".7"})]}),!o&&(0,z.jsxs)("g",{transform:"translate(476 252)",children:[(0,z.jsx)("path",{d:"M-18 96l4-70q2-14 14-16 12 2 14 16l4 70z",fill:"#0A0B10"}),(0,z.jsx)("circle",{cx:"0",cy:"0",r:"10",fill:"#0A0B10"}),(0,z.jsx)("path",{d:"M-12 30q-16 8-30 26",stroke:"#0A0B10",strokeWidth:"6",strokeLinecap:"round"}),(0,z.jsx)("path",{d:"M12 34q14 10 16 26",stroke:"#0A0B10",strokeWidth:"6",strokeLinecap:"round"}),(0,z.jsx)("circle",{cx:"30",cy:"64",r:"36",fill:"url(#w10lan)",className:"hm-candle"}),(0,z.jsx)("rect",{x:"24",y:"58",width:"12",height:"16",rx:"2",fill:"#FDE68A"}),(0,z.jsx)("path",{d:"M30 58v-6",stroke:"#3F3F46"}),(0,z.jsx)("circle",{cx:"-3",cy:"-1",r:"1.3",fill:"#F59E0B"}),(0,z.jsx)("circle",{cx:"3",cy:"-1",r:"1.3",fill:"#CBD5E1"})]}),a&&(0,z.jsx)("g",{transform:"translate(640 290)",children:(0,z.jsxs)("g",{className:"hm-float",children:[(0,z.jsx)("circle",{cx:"0",cy:"10",r:"46",fill:"url(#w10girl)"}),(0,z.jsx)("path",{d:"M-12 40q-2-30 12-38 14 8 12 38z",fill:"#E0F2FE",opacity:".75"}),(0,z.jsx)("circle",{cx:"0",cy:"-6",r:"7",fill:"#F1F5F9",opacity:".8"}),(0,z.jsx)("path",{d:"M-10 14q-12 2-20 -6",stroke:"#E0F2FE",strokeOpacity:".7",strokeWidth:"3",strokeLinecap:"round"})]})}),(0,z.jsx)("path",{d:"M300 440L420 330L480 330L560 440z",fill:"#FEF3C7",opacity:".05"}),r&&(0,z.jsx)("path",{d:"M424 438l20-24",stroke:"#94A3B8",strokeWidth:"3",strokeLinecap:"round",opacity:".6"})]})}var Kg={id:"f10",n:10,finale:!0,code:"OC-1223",caseNo:"CASE 02",levelNo:"LEVEL 10/10",title:"Lantern Night",legend:"The Grey Widow",place:"St. Brigid's Home \xB7 the millpond",victim:"Cordelia Marsh",ambience:"pond",monster:"widow",sceneLabel:"The frozen millpond at St. Brigid's at night: a ring of ten lanterns on the ice, a hole in the middle, a woman in a grey veil kneeling at its edge and a man behind her holding a lantern",Scene:Yg,suspects:[{id:"quill",name:"Silas Ashdown",role:'"Elliot Quill", archivist',look:{id:"quill"}},{id:"marsh",name:"Cordelia Marsh",role:"The Grey Widow, 1998",look:{id:"marsh"}}],enterLabel:"Walk out onto the ice",cold:["ST. BRIGID'S HOME \xB7 THE MILLPOND \xB7 23 DECEMBER \xB7 23:40","St. Brigid's closed in 2001. Nobody has lived here since.","Tonight, for the first time in twenty-six years, someone has lit the lanterns: ten of them, in a ring on the frozen millpond.","In the middle, at the edge of a hole cut in the ice, a woman kneels in a grey veil.","Behind her stands the archivist who has written every note in your files, holding Ambrose Vane's lantern."],coldSub:"She walks the frozen water on the longest nights.",briefing:[(0,z.jsxs)(z.Fragment,{children:["At 23:15 a patrol car saw lights on the millpond at the derelict ",(0,z.jsx)("b",{className:"text-white",children:"St. Brigid's Home"}),". Cordelia Marsh, 71, the medium from Hollowmere Manor, who wore the Grey Widow's veil on Lantern Night, is on the ice. So is ",(0,z.jsx)("b",{className:"text-white",children:"Silas Ashdown"}),", known since 1999 as Elliot Quill. Armed response is twenty minutes out. The ice will not last twenty minutes."]}),(0,z.jsx)(z.Fragment,{children:"There is nothing to search here, and nobody to interview. There is a man, a woman, a hole in the ice and a clock. Choose carefully. If you say nothing, the ice decides. Every Lantern seal you recovered is something you can bring with you."})],archive:{from:"THE ARCHIVIST'S DESK",text:'There is no note this time. His desk in the Black Archive has been cleared except for a lamp left switched on and a library card for the 1891 bestiary, signed out to E. S. QUILL on 2 January, due back 24 December. Under "reason for loan", in his careful left hand: "To finish reading."'},hesitate:['"Say something, Detective." Under your feet the ice answers for you, a long falling note.',"The silence stretches. Somewhere under the ice, something settles, and the whole pond shivers.",'"You have always been good at listening," he says. "It is not enough tonight." The ice cracks again.'],beats:[{narr:'Your torch finds them across the ice. In your ear, Commander Hale on the radio: "Armed response is twenty minutes out. Do not go on that ice."',quill:'"You came on your own. She said you would." He lifts the lantern so you can see his face: the archivist who has passed you on the stairs for eleven years. One amber eye, one grey. "Stop there, Detective. It is thin past the first lantern. It was thin then, too."',choices:[{label:`"Elliot. It's over. Let her come to me."`,reply:`"Elliot is the name they gave me afterwards." He sounds almost disappointed. "You know the other one. You've read the file."`,resolve:-5},{label:'"Silas."',reply:'For a long moment he does not move at all. "Nobody has said that out loud since 1999." His voice is perfectly steady. The lantern in his hand is not.',resolve:-15},{label:"Step closer",say:"You take a step towards them.",reply:'The ice groans under your boots, a deep note like a cello string. "I said stop," he says gently, as if to a child. "Please."',ice:-15,resolve:-5},{label:"Draw your weapon",say:"You draw your weapon.",reply:`He watches you draw with polite interest. "Hamish Rook loaded silver for me. It didn't help him either."`,resolve:10,gun:!0}]},{quill:'"Do you know what they were doing that night? Ten grown adults dressed as nightmares, to make orphans scream for a Christmas special. Margot wanted screams. They got screams." He looks down at the woman in the grey veil. "And this one told my sister that the Grey Widow takes children who stay out after dark."',choices:[{label:`"They were cowards. That doesn't make you right."`,reply:'"No," he agrees. "It makes me late."',resolve:-5},{label:'"You lost the tip of that finger reaching for her through the ice."',reply:'He looks at his own left hand as if it belonged to somebody else. "I got hold of her sleeve. For one second. Then the warden had my collar, and the ice took her sleeve back."',resolve:-15},{label:'"Mrs. Marsh. Tell him."',say:'"Mrs. Marsh. Tell him what you told her."',reply:'Cordelia lifts her veil. Her face is grey with cold. "I said it to frighten her. A joke. She ran out past the lanterns and I laughed, God forgive me, because she looked so small." Quill closes his eyes. It is the first time you have ever seen him look tired.',resolve:-10,ice:-5},{label:"Step closer",say:"You take another step.",reply:'A second note runs out under the ice, higher this time. Cordelia gasps. "Every step you take," Quill says, "she gets closer to the water. Is that the plan?"',ice:-15,resolve:5}]},{quill:'"I wrote the archive note in every one of your files. I told you how each one was done before you walked the scene. The comb. The needle. The rake. The lavender. The glass. The wire. Did you never wonder why I made it so easy?"',choices:[{label:'"You wanted to be caught."',reply:'"I wanted someone to finish reading." He almost smiles. "Nobody ever finishes reading in the archive. They take the page they need and go."',resolve:-10},{label:'"You wanted us to see what they did."',reply:'"Yes." Just that. Then: "Nine of them stood on a bank and watched a child go under, and then they went home and wrote down the word accident. I only wanted it written down properly."',resolve:-15},{label:'"Nine people are dead, Quill."',reply:'"Nine people who watched." The lantern swings. "You have counted them for me all year. Ten pages. One left. You know how this story ends."',resolve:10,ice:-5},{label:'"Vane was going to tell them everything. He wrote you a letter."',reply:'"Noon the next day. He would have told them at noon." His voice drops. "And at midnight Lionel Crane walked into his study to make sure he never did. So I started with Lionel." He looks straight at you. "You caught the right man for the wrong reason, Detective. Remember that, after."',resolve:-10}]},{narr:"A crack sings out across the whole pond, a long, high, falling note. One of the lanterns tips over and goes out.",iceAuto:-10,quill:`"Hear that? Ice sings before it breaks. Ivy told me that, in the dormitory, the week before. She thought it was beautiful." He shifts his grip on Cordelia's collar, the way a warden once held his. "One of us goes in tonight. That was always the end of the story."`,choices:[{label:'"Nobody else goes in."',reply:'"Somebody always does."',resolve:-5},{label:'Step onto the thin ice: "Then let it be me."',say:'You step past the first lantern. "Then let it be me."',reply:`The ice drops a finger's width under you, and holds. "No!" For the first time all year, he shouts. "Not you. Nobody goes in after anybody. Not again. Get BACK."`,ice:-20,resolve:-20},{label:'"She keeps asking you to come home."',reply:`Something in his face gives way. "You heard her." It is not a question. "She keeps telling me to come home, and I keep telling her: not yet. Not until it's finished."`,resolve:-10,hideUnless:e=>e.seals>=1},{label:"Aim at him",say:"You raise your weapon and aim.",reply:'"Go on," he says. "Hale will write it up properly. Accidental."',resolve:5,hideUnless:e=>e.gun}]},{narr:"The ice is moaning steadily now, all around you. Cordelia is crying without a sound. A long way behind you, sirens.",quill:'He drags Cordelia to the very edge of the black water and looks at you over her head. "Choose, Detective. You have been choosing all year."',time:20,choices:[{label:"Talk him down, and cuff him",ending:"arrest",req:e=>e.resolve<=50,lockedHint:e=>`He isn't ready to listen yet. (His resolve: ${Math.round(e.resolve)}%. It has to fall to 50% or lower.)`},{label:"Fire",ending:"shoot",req:e=>e.gun,lockedHint:"Your weapon is holstered."},{label:"Throw yourself flat and slide for her",ending:"ice"},{label:`"Let her go. Then walk away. I won't follow."`,ending:"let"},{label:"Hum the four bars",ending:"true",req:e=>e.seals>=9,lockedHint:e=>`You don't know the whole tune. (Lantern seals: ${e.seals}/9)`}]}],endingOrder:["arrest","shoot","ice","let","true"],endings:{arrest:{title:"Arrest",sub:"He is still alive. So is she.",tint:"#10B981",lines:["ST. BRIGID'S MILLPOND \xB7 23:58","You keep talking. Afterwards you cannot remember what you said, only that you kept saying her name, and his.","Silas Ashdown sets Ambrose Vane's lantern down on the ice, carefully, the way you would put a child to bed. Then he lets go of the grey veil.","Cordelia crawls to you across the ice. He does not stop her.","When you cuff him he holds out his wrists, left hand first. He does not vanish this time. He does not try.","In the back of the car he asks for one thing: that someone lights a lantern by the millpond every twenty-third of December. Hale does it herself, every year."]},shoot:{title:"The Shot",sub:"The water has both of them now.",tint:"#F87171",lines:["ST. BRIGID'S MILLPOND \xB7 23:58","One shot, very loud, and then a silence much louder.","He takes a step back, and another, through the ring of lanterns onto the thinnest ice, and the ice opens for him without a sound.","Cordelia is on her knees at the edge of the hole, screaming his name. Both his names.","The divers search the millpond for three days. They find a brass lantern pin, a library card, and nothing else.","Every winter after, on the twenty-third, the night guards at St. Brigid's report the same thing: two sets of small footprints in the frost, leading out to the middle of the pond."]},ice:{title:"The Ice",sub:"You saved the one he came to drown.",tint:"#7DD3FC",lines:["ST. BRIGID'S MILLPOND \xB7 23:58","You throw yourself flat and slide, the way they teach you. The way nobody taught a twelve-year-old.","Your hand closes on Cordelia's wrist just as the ice gives way beneath both of them.","You pull. She comes. He doesn't.","For one second his left hand, the one with the missing fingertip, finds your sleeve in the black water. For one second, you have him.","Then the ice takes his sleeve back."]},let:{title:"Let Him Go",sub:"The Folklorist is still out there.",tint:"#A78BFA",lines:["ST. BRIGID'S MILLPOND \xB7 23:58",`You lower your hands. "Let her go," you say. "Then walk away. I won't follow."`,"He looks at you for a long time. Then he lets go of the veil, picks up Vane's lantern, and walks out past the last of the ring onto the black ice where it is thinnest.","The ice does not sing. It does not break. He walks until the dark takes the light.","No one ever finds Elliot Quill. Hale never asks you what happened on the ice, and you never tell her.","Every Christmas Eve a parcel arrives at the Unit with no stamp: a page of the 1891 book, mended by hand. Nine years, nine pages. In the tenth year, a page you have never seen before."]},true:{title:"Come Home",sub:"True ending.",tint:"#C4B5FD",lines:["ST. BRIGID'S MILLPOND \xB7 23:58","You hum. You don't decide to. Four bars you have heard in a prison duct, a crypt, a moor, a drowned church, an old tape, a frost, a storm, a snow globe and a dead man's room.","Silas Ashdown goes completely still.","Beyond the last lantern, on the black ice, there is a little girl in a nightdress. She is not cold. She is holding out her hand.",'"Silas," she says. "Come home. I left the lights on."',"He lets go of Cordelia. He walks to her across the thinnest ice, and it holds him, and he kneels, and she puts her arms round his neck.","One by one the lanterns go out. When your torch comes back, he is kneeling alone at the edge of the water, crying like a twelve-year-old, holding nothing at all.","He lets you take him in. In the car he falls asleep against the window. The doctors say later it is the first time he has slept through the night in twenty-six years."]},fail:{title:"Through the Ice",sub:"This is not how it ends. Try again.",tint:"#94A3B8",fail:!0,lines:["ST. BRIGID'S MILLPOND \xB7 23:58","The ice sings one last long note, and opens.","All three of you go into the black water together.","You wake in an ambulance in a foil blanket with Hale's hand on your shoulder. Cordelia is alive. They have not found him.",'"You hesitated," Hale says. It is not an accusation. That is what makes it worse.']}},after:["In the weeks that follow, the Black Archive is audited for the first time in its history.","In a locked drawer in the restricted cage, behind the space where the 1891 bestiary stood, they find the Hollowmere Society's minute book.",'The entry for 23 December 1998 reads: "Lantern Night. The eleventh. Satisfactory." The first entry is dated 1891, the year the bestiary was printed. Every one lists ten names, ten monsters, and one child.',"Someone has been doing this for a very long time. Silas only found the last page."],nextCase:"CASE 03 \xB7 THE MINUTE BOOK \xB7 NOT YET OPENED",lantern:"Ambrose Vane's lantern, set down on the ice."},op=Kg;var Qt=[{n:1,legend:"The Banshee",title:"The Keening",victim:"Dr. Lionel Crane",place:"HMP Blackwater",cfg:Ym},{n:2,legend:"The Vampire",title:"The Thirst",victim:"Mortimer Grail",place:"Saltwick Abbey",cfg:Km},{n:3,legend:"The Werewolf",title:"Hunter's Moon",victim:"Hamish Rook",place:"Kell Moor",cfg:Xm},{n:4,legend:"La Llorona",title:"The Weeping Woman",victim:"In\xE9s Calloway",place:"Lowmoor Reservoir",cfg:Qm},{n:5,legend:"Bloody Mary",title:"Three Times in the Glass",victim:"Margot Kestle",place:"The Old Vestry, Wexcombe",cfg:Jm},{n:6,legend:"The Headless Horseman",title:"The Rider",victim:"Bertram Fenwick",place:"Coldharbour corpse road",cfg:Zm},{n:7,legend:"Black Shuck",title:"Black Dog",victim:"Gideon Marlowe",place:"Dunsmere sea wall",cfg:ep},{n:8,legend:"Krampus",title:"Krampusnacht",victim:"Neville Thorne",place:"Thorne's department store",cfg:tp},{n:9,legend:"The Grim Reaper",title:"The Reaper's Hour",victim:"Dr. Edwin Sallow",place:"St. Jude's Hospice",cfg:ap},{n:10,legend:"The Grey Widow",title:"Lantern Night",victim:"Cordelia Marsh",place:"St. Brigid's m
