carbon monoxide. The chimney was blocked while the fire burned, then cleared from above after it went out."},circle:{name:"Unbroken salt circle",icon:ot,x:300,y:228,spot:"Centre of the study",curse:6,scanCurse:5,scene:"Vane sits slumped in his wingback chair inside a perfect ring of coarse salt, eyes open, face locked in terror. A second, empty chair faces him inside the circle. The air above it is noticeably colder. Your breath fogs.",scan:"emf",method:"EMF spike scan",result:"A 6\u20139 mG field with no wiring beneath the floor, pulsing irregularly and centred on the EMPTY chair. It does not behave like any electrical source. The salt ring is unbroken: no footprints, no scattered grains, no sign of a struggle. Nothing physical crossed it.",fact:"Genuine anomaly: an unexplained field lingers by the empty chair. But the circle is unbroken. No one, living or dead, laid a hand on Vane.",anomaly:!0},recorder:{name:"Vigil EVP recorder",icon:Ft,x:398,y:276,spot:"Side table",scanCurse:8,scene:"A digital voice recorder on the side table, still running, its red light blinking. Vane recorded every solstice vigil, hoping to catch the Widow. Six hours and forty minutes of audio.",scan:"evp",method:"EVP audio analysis",result:`01:31\u201301:39 Scraping inside the chimney breast.
01:35 Knocking. A man: "Uncle? It's Julian. Please, I only want to talk." An older woman: "Come away, Master Julian. He won't open."
02:14 Vane, slurred: "Who's there? Eleanor? My head\u2026"
02:20 Glass shatters.
02:26 A woman's whisper, not Vane's. No living woman was in the room: "Look up. He has stopped the throat of the house."
04:41 Scraping in the chimney again. A soft fall of soot.`,fact:`Vane's recording: chimney scraping at 01:31 and 04:41; Julian and Agnes at the door at 01:35; Vane confused at 02:14; mirror breaks at 02:20; at 02:26 a whisper no living person made: "Look up."`,anomaly:!0},journal:{name:"Vane's research journal",icon:Bn,x:128,y:168,spot:"Writing desk",scene:"A calfskin journal lies open on the desk under a guttered candle. Today's page is torn out. The page below holds only the faint grooves of pressed handwriting.",scan:"trace",method:"Indentation lift (oblique light)",result:`Recovered from the torn page: "Dec 21. The 1998 Hollowmere Recordings are spliced. The Widow's voice is Lionel's sister reading lines. Told L. after dinner. He wept, begged me. No. Society, noon tomorrow. The truth matters more than either of us."`,fact:"Vane discovered that Dr. Crane faked the famous Hollowmere Recordings, told him after dinner, and planned to expose him at noon."},mirror:{name:"Shattered mirror",icon:Fo,x:584,y:236,spot:"East wall",curse:8,scanCurse:4,scene:"A tall gilt mirror cracked in a starburst from the centre, as if struck from the other side. On the glass, a pale handprint glows faintly in the dark. Look too long and something seems to stand behind your reflection.",scan:"uv",method:"UV blacklight sweep",result:`Blood on the shards matches cuts on Vane's right knuckles: he struck the mirror himself, from the front, at shoulder height. Under UV, the "spirit hand" fluoresces as zinc-sulfide luminous paint. It was put there, not left there.`,fact:'Vane smashed the mirror himself, confused and terrified. The glowing "spirit hand" on it is luminous paint from a s\xE9ance trick.'},closet:{name:"Sealed spirit closet",icon:Xt,x:520,y:92,spot:"North-east corner",curse:5,scene:"A narrow closet whose door bears an 1887 wax seal pressed with the Hollowmere sigil. Legend says it was sealed the night Lord Hollowmere died in this room. Faint scratching seemed to come from inside during the s\xE9ance.",scan:"uv",method:"UV blacklight sweep",result:`The 1887 seal was cut and re-pressed with modern craft wax. Inside: black gloves painted with luminous zinc sulfide (matching the mirror's "hand"), fishing line threaded to the chandelier, a hand bellows for "cold breath" and a wooden knocker.`,fact:'The s\xE9ance was staged: someone worked the knocks, the cold breath and the glowing hand from inside the "sealed" closet.'},breaker:{name:"Flickering breaker box",icon:$o,x:724,y:360,spot:"Servants' corridor",scene:"In the corridor the lights stutter and buzz. The staff say the Widow plays with them. The panel was modernised in 2019 and logs every switch. One breaker is down: 14, labelled STUDY SMOKE / CO ALARM.",scan:"emf",method:"EMF spike scan",result:"The flicker is mundane: a loose 1890s neutral wire arcing in a junction box. Nothing paranormal. Panel log: breaker 14 (STUDY SMOKE / CO ALARM, a hard-wired unit with no battery) switched OFF by hand at 01:24. The panel door has been wiped clean.",fact:"The study's carbon-monoxide alarm was deliberately switched off at 01:24, minutes before the chimney was blocked."},attic:{name:"Attic flue hatch",icon:ba,x:762,y:128,spot:"Upper landing",curse:3,scene:"A pull-down ladder on the upper landing climbs to the attic, where every chimney in the house rises past the old water tank. Soot streaks the rungs. Wedged behind the tank: a soot-black bundle.",scan:"trace",method:"Fibre & fingerprint analysis",result:'The bundle is a pillowcase embroidered "H. EAST GUEST", stuffed with two cushions and soaked in soot. Only the East Guest Room was made up with that linen tonight. A clear thumbprint in soot on the third rung: Dr. Lionel Crane.',fact:"The flue was stuffed with a pillowcase from the East Guest Room, Crane's room. Crane's sooty thumbprint is on the attic ladder."}},sg=[{id:"marsh",name:"Cordelia Marsh",role:"Spiritualist medium",look:{id:"marsh"},motive:"Vane was writing a book that would expose her as a fraud.",alibi:'Says she left the study with everyone at 23:30 and went to the Blue Room. "The spirits do not need me present."',qs:[{q:"What happened at the s\xE9ance?",a:"The Grey Widow came through. Knocks in the walls, the cold breath, her hand upon the glass. Ambrose wept like a child. She was warning him."},{q:"Did Vane believe in your gift?",a:"He tested me for months. Tied my wrists, sealed the closet with wax. I passed every test he set."},{q:"How did the s\xE9ance end?",a:`At twenty past eleven a whisper came that none of us made: "Look up." I did not make that sound, Detective. I swear it on my mother's grave.`,fact:'Marsh: at 23:20 a whisper of "Look up" ended the s\xE9ance. She swears she did not make it.',kind:"clue"}],present:{closet:{contra:!0,needsLab:!0,text:"Fine. The gloves, the line, the bellows. I worked the sitting from inside that closet and re-sealed the wax myself. Ambrose would have ruined me. But a fraud is not a murderer: I was out by half eleven like everyone. And since we're confessing, at dinner Lionel asked Agnes which flue the study fire shared. I thought it a strange thing to ask.",fact:"Marsh lied: she faked the s\xE9ance from inside the closet. She also heard Crane ask at dinner which flue the study fire used."},mirror:{needsLab:!0,text:"The hand was mine. Luminous paint. But I never broke that glass. It was whole when we filed out at half past eleven.",fact:"Marsh: the mirror was intact when the s\xE9ance ended at 23:30.",kind:"clue"},recorder:{needsLab:!0,text:`"Look up." That's her. That is the same voice from the s\xE9ance. Oh God, it's real. She was real all along.`}},dismiss:["The spirits find that object\u2026 uninteresting.","You are disturbing the veil for nothing.","I sense nothing from it. Truly nothing."],clearedBy:e=>e.contra.has("marsh")},{id:"julian",name:"Julian Vane",role:"Nephew & heir",look:{id:"julian"},motive:"Owes \xA390,000 in gambling debts. Inherits Hollowmere. His uncle refused him money tonight.",alibi:"Says he stormed out after dinner at 22:00, drove to the village, slept in his car and never came back.",qs:[{q:"Where were you tonight?",a:"Gone. Stormed out at ten, drove to the Crow & Lantern, slept in the car like a tramp. Didn't set foot in this mausoleum again."},{q:"What happened at dinner?",a:"I asked for money. He said no, in front of everyone. Then he and Lionel went off for brandy and came back looking like a funeral.",fact:"Julian: after dinner Vane and Crane spoke privately and both came back shaken.",kind:"clue"},{q:"Who inherits Hollowmere?",a:"Me. Mostly. Look, I know exactly how that sounds."}],present:{recorder:{contra:!0,needsLab:!0,text:"All right! I came back. Agnes let me in at the scullery and I knocked. He didn't answer. He never answered me. While I stood there something was scraping inside the wall, like rats in the chimney. Going out by the back stairs at about 01:40 I passed someone coming down from the attic landing. Tall. Quick on his feet. Too dark for a face. I thought it was a ghost.",fact:"Julian lied: he knocked on the study door at 01:35 with no answer, and at about 01:40 passed a tall, quick figure coming down from the attic.",unlocks:"crane:stairs"},journal:{needsLab:!0,text:"Forged? Lionel's tapes? The man built his whole career on those recordings. Uncle would have buried him."},hearth:{needsLab:!0,text:"Fumes? The chimney killed him? Then it's an accident, surely. Isn't it?"}},dismiss:["Riveting. Can I go now?","I don't know what that is and I don't care.","Ask my solicitor."],clearedBy:e=>e.contra.has("julian")},{id:"pell",name:"Agnes Pell",role:"Housekeeper, 41 years",look:{id:"pell"},motive:"Vane meant to sell Hollowmere in spring. She would lose the only home she has known.",alibi:"Says she banked the study fire low at 22:00 like every night, went to bed at midnight and heard nothing.",qs:[{q:"Where were you tonight?",a:"Lit the master's fire at ten and banked it low, same as every night for forty-one years. Abed by midnight. Heard nothing till I went up at half six."},{q:"Tell me about the Grey Widow.",a:"Lady Hollowmere. Her husband was found dead in that very study in 1887, fire out, door locked, same as the master. She has walked ever since. I lay the salt for her myself."},{q:"Who could reach the study chimney?",requires:"lab:hearth",a:"Every flue runs up past the water tank in the attic. You get there by the hatch on the upper landing. Dr. Crane asked me about it at dinner. Said his room was draughty.",fact:"Agnes: the study flue is reached from the attic hatch. Crane asked her about it at dinner.",kind:"clue"}],present:{hearth:{contra:!0,needsLab:!0,text:`I heaped it. A full scuttle at half eleven, because he asked me to. He wanted to sit up all night with her. When they said "fumes" I thought I'd killed him with my own hands. Forty-one years, and I killed him.`,fact:"Agnes lied: she heaped the fire at 23:30 on Vane's orders. But a big fire alone cannot kill when the flue is clear."},recorder:{needsLab:!0,text:"Yes. I let Master Julian in and out by the scullery. He never touched that door but to knock, and he was gone by quarter to two. I'll swear to it.",fact:"Agnes confirms Julian only knocked and left by 01:45.",kind:"clue"},circle:{text:"The salt held. She never crossed it. Whatever killed him, it wasn't her."}},dismiss:["I'm sure I couldn't say, sir.","That's not my place to know.","I keep the house. I don't keep secrets."],clearedBy:e=>e.contra.has("pell")},{id:"crane",name:"Dr. Lionel Crane",role:"Psychical researcher",look:{id:"crane"},motive:"None known. Vane's oldest friend and co-founder of the Hollowmere Society.",alibi:'Says he retired to the East Guest Room at 23:45 with a sleeping draught. "My knee can barely manage stairs at night, never mind ladders."',qs:[{q:"Where were you tonight?",a:"East Guest Room by quarter to twelve. A sleeping draught for this wretched knee. I can barely manage stairs after dark, never mind ladders."},{q:"How were things with Vane?",a:"Forty years of friendship. We were finishing a book together. We were on excellent terms."},{q:"What killed him, in your view?",a:"As a scientist? Heart failure brought on by terror. As the man who recorded the Hollowmere tapes? She took him. She takes the masters of this house."},{q:"Someone quick on the back stairs at 01:40?",requires:"crane:stairs",a:"Do I look sprightly to you? A shadow on the stairs, in this house? Take your pick of the dead.",fact:"Crane brushed off the figure seen coming down from the attic at 01:40.",kind:"clue"}],present:{journal:{contra:!0,needsLab:!0,text:"He\u2026 yes. He told me after dinner. He thought he'd found a splice in the 1998 tapes. A misunderstanding! I'd have cleared it up. It's hardly a reason to\u2026 I never laid a finger on him!",fact:'Crane lied about "excellent terms": Vane confronted him over forged recordings after dinner and meant to expose him at noon.'},attic:{contra:!0,needsLab:!0,text:"A pillowcase. A thumbprint. You think a man with my knee went up that\u2026 He was going to stand up at noon and call forty years of my life a forgery. I only meant\u2026 No. I knew what the smoke would do. I knew.",fact:`Crane "never left his room and can't climb", yet his pillowcase blocked the flue and his sooty thumbprint is on the attic ladder.`},recorder:{needsLab:!0,text:"Rats in a chimney and a whisper in the noise. Pareidolia, Detective. I of all people know how easily those voices are made."},hearth:{needsLab:!0,text:"Fumes. How tragic. A jackdaw's nest, most likely. The same thing happened in 1887, you know."},breaker:{needsLab:!0,text:"Old wiring. I wouldn't know a breaker from a bread knife."}},crack:`Crane's composure shatters. "Noon. He was going to say it at noon. I sat on the landing in the dark listening for him to stop coughing." He removes his glasses and asks for a solicitor.`,dismiss:["Fascinating, but irrelevant.","You're grasping at ectoplasm, Detective.","I've debunked better than that."],clearedBy:()=>!1}],ig=[{id:"curse",label:"The Grey Widow's curse: a true supernatural killing"},{id:"heir",label:"Inheritance: a cursed s\xE9ance staged to frighten an old man's heart"},{id:"accident",label:"An over-banked fire: a tragic accident covered up"},{id:"forgery",label:"Silencing exposure of forged EVP recordings: carbon monoxide via a blocked flue"}];var dg=[["1887","Lord Hollowmere is found dead in the same study, fire out. The Grey Widow legend begins."],["19:30","Dinner. Vane refuses Julian money. Crane asks Agnes how the study flue is reached."],["21:00","Over brandy, Vane tells Crane he will expose the forged Hollowmere Recordings at noon."],["22:00","Agnes lights the study fire. The s\xE9ance begins; Cordelia works her tricks from the sealed closet."],["23:20",'A whisper nobody made: "Look up." The s\xE9ance breaks up at 23:30.'],["23:30","At Vane's request, Agnes heaps a full scuttle of coal on the fire."],["23:45","Vane locks himself in for his solstice vigil and starts his recorder."],["01:24","Crane switches off breaker 14, killing the study's CO alarm."],["01:31","In the attic, Crane stuffs his pillowcase of cushions down the study flue."],["01:35","Julian, let in by Agnes, knocks at the study. No answer."],["01:40","Julian passes a tall, quick figure coming down from the attic landing."],["02:14","Poisoned and hallucinating, Vane calls out for his late wife."],["02:20","He punches the mirror, mistaking the painted hand for the Widow."],["02:26",'The recorder catches a whisper no living person made: "Look up."'],["\u224803:00","Professor Ambrose Vane dies inside his salt circle."],["04:41","Crane pulls the sack from the flue and hides it behind the attic water tank."],["06:30","Agnes forces the study door and finds him."]];function ug(){return(0,F.jsxs)("g",{children:[(0,F.jsxs)("defs",{children:[(0,F.jsx)("pattern",{id:"boards",width:"40",height:"14",patternUnits:"userSpaceOnUse",children:(0,F.jsx)("path",{d:"M0 13.5H40M20 0V14",stroke:"#1A1712",strokeWidth:"1 ne:dg,redTimes:["01:24","01:31","04:41"],greenTimes:["23:20","02:26"],shadowSpots:[[120,300],[470,200],[220,140],[560,320]],hallu:["LOOK UP","SHE SEES YOU","THE THROAT","NOT ALONE","BREATHE"],blackout:(0,F.jsxs)(F.Fragment,{children:["You wake on the cold floor of the upper landing at first light, the word ",(0,F.jsx)("span",{className:"text-emerald-400",children:'"up"'})," scratched into your notebook in a hand that is not yours. Your evidence is where you left it."]}),blackoutWake:"You blacked out and woke on the upper landing.",hint:'The house keeps whispering "look up". Who could reach the chimney from above, and whose linen came back down?',cold:["HOLLOWMERE MANOR \xB7 21 DECEMBER \xB7 THE LONGEST NIGHT","At dawn the housekeeper forces the study door.","Professor Ambrose Vane, 71, sits dead inside an unbroken ring of salt. The door was locked from within.","In 1887, Lord Hollowmere died in the same room. The same way.","The household says the Grey Widow has claimed another master."],briefing:[(0,F.jsxs)(F.Fragment,{children:["At dawn the housekeeper forced the study door of ",(0,F.jsx)("b",{className:"text-white",children:"Hollowmere Manor"})," and found ",(0,F.jsx)("b",{className:"text-white",children:"Professor Ambrose Vane"}),", 71, occult scholar, dead in his wingback chair inside an unbroken salt circle. The door was locked from within, the key in his own lock. The mirror was shattered. His canary was dead in its cage."]}),(0,F.jsxs)(F.Fragment,{children:["In 1887 Lord Hollowmere died in the same room, the same way. The household says the ",(0,F.jsx)("span",{className:"text-emerald-400 hm-glitch",children:"Grey Widow"})," has claimed another master. Something in this house is genuinely wrong. But four living people also had reason to want Vane silent."]})],verdict:(0,F.jsxs)(F.Fragment,{children:[(0,F.jsx)("b",{className:"text-white",children:"Dr. Lionel Crane"})," is charged with the murder of Professor Ambrose Vane. He blocked the study chimney with his own pillowcase so carbon monoxide would fill the locked room, then dressed the death up as the Grey Widow's curse to stop Vane exposing his forged recordings at noon."]}),herrings:[(0,F.jsxs)(F.Fragment,{children:[(0,F.jsx)("b",{className:"text-white",children:"Cordelia Marsh"})," faked the s\xE9ance from the sealed closet. A fraud, gone by 23:30."]}),(0,F.jsxs)(F.Fragment,{children:[(0,F.jsx)("b",{className:"text-white",children:"Julian Vane"})," sneaked back for money and only knocked. He saw the killer on the stairs."]}),(0,F.jsxs)(F.Fragment,{children:[(0,F.jsx)("b",{className:"text-white",children:"Agnes Pell"})," heaped the fire and believed she'd killed him. A fire can't kill through an open flue."]})],real:["The cold, unexplained field by the empty chair, which never crossed the salt.",'The whisper nobody made, twice: "Look up." The Widow was pointing at the chimney all along.',"Once Crane was named, the EMF reading in the study fell to zero. It has not returned."]},jm=cg;var cv=ae(Pe());var _e={iris:"#B7791F",iris2:"#9CA3AF"};var B=ae(me());$e({rusk:{skin:"#D9A88A",skinD:"#A0705A",iris:"#4B6A55",rim:"#38BDF8",bg:["#0E1C2A","#05070B"],lips:"#9A5A52",brow:"#3A2418",hair:"bun",hairC:"#3A2418",outfit:"uniform",outfitC:"#0F1A2E",accent:"#E5E7EB",motif:"bars",bags:!0},tully:{skin:"#E2B79A",skinD:"#A67A5E",iris:"#6B7280",rim:"#F59E0B",bg:["#22190E","#06060A"],lips:"#9A6058",brow:"#5A4636",hair:"bald",hairC:"#6B5A4A",outfit:"jumper",outfitC:"#4B5563",motif:"bars",stubble:!0,bags:!0,scar:!0},gray:{..._e,skin:"#E3C2A6",skinD:"#A47E62",rim:"#C4B5FD",bg:["#1A1430","#05050B"],lips:"#8E5E58",brow:"#2E2A28",hair:"short",hairC:"#3B3632",outfit:"cassock",outfitC:"#0D0D12",motif:"candles",glasses:"#B8A36A",beard:"#3B3632"}});var fg={body:{name:"Crane's body",icon:Ie,x:432,y:300,spot:"Cell 14, lower bunk",scene:"Lionel Crane lies on his back on the lower bunk, eyes wide, both hands clamped over his ears so hard the nails have torn. His lips are blue. The cell smells of vomit and candle wax. The night officer says he was alive, and screaming, at three.",scan:"tox",method:"Toxicology",result:`Aconitine in the blood: a fatal dose of monkshood (Aconitum napellus). It acts within one to six hours: numbness, vomiting, then a chaotic, failing heartbeat.
Stomach contents: the 19:00 supper and a small amount of unleavened wafer, swallowed at about 21:00.
Time of death: 03:40 to 04:10.`,fact:"Crane was poisoned with aconite. The only thing he swallowed after supper was a communion wafer, at about 21:00."},comb:{name:"Silver comb on the pillow",icon:ot,x:352,y:262,spot:"Cell 14, pillow",curse:7,scene:"A heavy old silver comb lies on the pillow beside his head, one long grey hair caught in its teeth. In Irish folklore the banshee leaves her comb behind, and whoever picks it up is the next to hear her. Nobody on the wing will touch it.",scan:"uv",method:"UV blacklight sweep",result:`No fingerprints at all: the comb was wiped. The grey hair is synthetic, from a theatrical wig.
Under UV a seal of wax glows on the spine, pressed with a lantern inside a ring.
Engraved beneath it, worn almost smooth: "St. B."`,fact:`The "banshee's comb" was planted: wiped clean, a wig hair, and a wax seal of a lantern inside a ring, engraved "St. B."`},vent:{name:"Cell vent & intercom recording",icon:Ft,x:476,y:118,spot:"Cell 14, back wall",scanCurse:8,anomaly:!0,scene:"A rusted vent grille high in the back wall. The wing intercom records whenever it hears sound, and last night it heard two hours of a woman keening. The officers will not play it twice.",scan:"evp",method:"EVP audio analysis",scanSfx:"keen",result:`02:01\u201303:58 A woman keening, wordless, rising and breaking. Spectral match: the SAME 47-second recording, looped 146 times through a small speaker in the ductwork.
03:12 Crane, sobbing: "Ivy, I'm sorry. It was only meant to be a show. Get off the ice."
UNDER THE LOOP, NOT PART OF IT: a child humming four bars of a lullaby, close to the microphone. 02:44, 03:20, 03:41.
There was no child in the building.`,fact:"The banshee was a recording looped through the ducts. But under it, a child hums a lullaby close to the microphone. There was no child in the prison."},letter:{name:"Crane's hidden letter",icon:qo,x:520,y:336,spot:"Cell 14, under the mattress",scene:"Pushed deep under the mattress: a pad of prison notepaper. The top sheet has been written on and torn away. Only the faint grooves of a hand pressing hard are left on the page beneath.",scan:"trace",method:"Indentation lift (oblique light)",result:'Recovered: "To whoever comes for me. I know what you are, and I know why. LANTERN NIGHT was not my idea. Ambrose wanted to tell them, and I stopped him, and now there is no one left to stop you. There were ten of us. Start with the ice. L.C."',fact:`Crane's letter: "LANTERN NIGHT was not my idea... There were ten of us." He knew who was coming for him, and why.`},keysafe:{name:"Wing key-safe log",icon:Yn,x:96,y:158,spot:"Officers' station",scene:"An electronic key-safe beside the officers' desk. Every key on C-Wing is drawn and returned with a fingerprint. Its screen is the only steady light on the landing.",scan:"trace",method:"Key-log extraction",result:`21:02 MULTI-FAITH ROOM key drawn on visitor pass V-118 (Fr. L. Gray), escorted by Off. Rusk.
21:40 Gray signs out of the wing. The MULTI-FAITH ROOM key is NOT returned.
02:02 Off. Rusk draws the YARD DOOR key. Returned 02:24.
WING GATE: no openings between 21:40 and 06:00.
05:50 The missing key turns up in the gatehouse letterbox.`,fact:"Key log: the wing gate never opened after 21:40. Rusk went to the yard 02:02\u201302:24. Gray kept the multi-faith room key; it came back through a letterbox at 05:50."},visitor:{name:"Visitor log & diocese letter",icon:Wo,x:170,y:250,spot:"Officers' desk",scene:`The visitors' book lies open beside a letter on diocesan paper: "Fr. Lucan Gray, appointed visiting chaplain to HMP Blackwater." The new chaplain's signature is smeared sideways, both times he signed.`,scan:"trace",method:"Document & ink analysis",result:`The letterhead is a scan of a genuine 2011 diocesan letter, reprinted. The diocese has no priest called Lucan Gray.
Every "Gray" signature is smudged left to right by the edge of the writing hand: the writer is LEFT-HANDED.
No fingerprints: he signed in gloves.`,fact:"There is no Father Lucan Gray. His letter is forged, and every signature was smudged by a left-handed writer wearing gloves."},ductspeaker:{name:"Multi-faith room vent",icon:La,x:770,y:106,spot:"Multi-faith room",scene:"A bare room: folded prayer mats, a plain table, a battery candle that flickers on its own. The vent above the table hangs by two of its four screws.",scan:"emf",method:"EMF spike scan",hot:!0,result:`A strong, steady field inside the duct: a magnet speaker and a cheap timer player, zip-tied 40 cm along the duct that runs behind cells 13, 14 and 15. Battery drained flat. Timer set for 02:00.
The dust on the duct floor is swept in one arc, the width of a gloved arm.`,fact:"A speaker on a 02:00 timer was hidden in the multi-faith room's duct, which runs behind Crane's cell. It played the banshee."},pyx:{name:"Brass pyx & communion hosts",icon:Bo,x:702,y:286,spot:"Chaplaincy cupboard",scene:"In the chaplaincy cupboard a small brass pyx, the box a priest carries the host in, sits apart from the prison's own silver set. Two wafers are still inside. The lid is cold enough to sting.",scan:"tox",method:"Toxicology",result:`Both remaining wafers are soaked in aconitine, enough in each to kill a man. The prison's own communion set is clean.
Scratched inside the lid with a pin: a lantern inside a ring, and the number 1.
Glove fibres only. No prints.`,fact:"The visiting chaplain's pyx holds aconite-soaked wafers and is scratched with a lantern sigil and the number 1."}},hg=[{id:"rusk",name:"Officer Dana Rusk",role:"Night officer, C-Wing",look:{id:"rusk"},motive:"Crane filed two complaints about her in his first week. A third would have cost her the job.",alibi:"Says she never left the wing desk from 21:00 to 06:00, and nobody came onto the wing after the chaplain left.",qs:[{q:"What did you hear last night?",a:"A woman. Keening, like at a wake my nan took me to in Mayo. From two until near four. I checked every door on the landing with my torch. Every one was locked and every man was in his bunk."},{q:"Who visited Crane?",a:"Only the new chaplain, Father Gray. Gave him communion in his cell at nine and left at twenty to ten. Signed in, signed out. Polite man. Cold hands.",fact:"Rusk: the chaplain, Fr. Gray, gave Crane communion in his cell at 21:00 and left the wing at 21:40.",kind:"clue"},{q:"Was Crane afraid of anything?",a:`He asked to be moved every day. Kept saying "they're coming in order, and I'm first." I thought he meant the other cons.`,fact:'Rusk: Crane kept saying "they are coming in order, and I am first."',kind:"clue"}],present:{keysafe:{contra:!0,needsLab:!0,text:"All right. I took the yard key at two and went out for a cigarette. Twenty minutes. That noise was getting in my teeth. But the wing gate was locked behind me and the log proves nobody used it. Nobody came in. Nobody.",fact:"Rusk lied: she left her desk 02:02\u201302:24 to smoke. But the wing gate stayed locked. No one entered C-Wing."},comb:{needsLab:!0,text:"That comb wasn't on his bunk at the quarter-to-nine count. I'd have bagged it. The only person in that cell after me was the chaplain.",fact:"Rusk: there was no comb on Crane's bunk at the 20:45 count. Only the chaplain went in after that.",kind:"clue"},body:{needsLab:!0,text:"Poison? In here? Everything he ate came off the same trolley as forty other men."}},dismiss:["Not my department.","I've a wing to run, Detective.","Write it in your report."]},{id:"tully",name:"Ray Tully",role:"Prisoner, cell 13",look:{id:"tully"},motive:'Crane had him thrown off the library job. Tully swore, in front of witnesses, that he would "see him off."',alibi:"Says he slept through the night with foam earplugs and heard nothing at all.",qs:[{q:"What did you hear?",a:"Nothing. Foam plugs, mate. Best kip I've had in months."},{q:"What was Crane like?",a:"Posh. Terrified. Wrote letters all day and tore them up. Asked me once if I believed in ghosts. I said only the ones that owe me money."},{q:"Did you threaten him?",a:"I said I'd see him off the library rota. Which I did. That's not a threat, that's admin."}],present:{vent:{contra:!0,needsLab:!0,text:`Fine. I heard it. Course I heard it, it was coming out of the wall. But underneath the screaming there was something else. Quieter. A kid, humming. And Crane, through the pipe, talking to someone who wasn't there. "Ivy, I'm sorry. It was only meant to be a show. Get off the ice." Over and over till he stopped.`,fact:`Tully lied: he heard everything. Under the wail, a child humming, and Crane begging "Ivy, I'm sorry. Get off the ice."`,unlocks:"gray:ivy"},ductspeaker:{needsLab:!0,text:"The God room backs onto our pipes, yeah. Friday prayers come through clear as a radio.",fact:"Tully: the multi-faith room shares a duct with cells 13 to 15. Sound carries through it.",kind:"clue"},letter:{needsLab:!0,text:"Lantern Night? Never heard him say it. But he went white as a sheet whenever the telly showed snow."}},dismiss:["What's that, then? Evidence of nothing.","Ask my brief.","Not my problem, is it."]},{id:"gray",name:"Father Lucan Gray",role:"Visiting chaplain, 2 weeks in post",look:{id:"gray"},motive:"None known. He met Crane for the first time a fortnight ago.",alibi:"Says he gave Crane communion at 21:00, prayed alone in the multi-faith room, and was out of the prison by 22:00.",qs:[{q:"What happened at communion?",a:"I gave Dr. Crane the sacrament and heard his confession. What a man tells God through me stays with God. He took the host the way a frightened child takes medicine."},{q:"Do you believe in the banshee?",a:"The bean s\xEDdhe never killed anyone, Detective. She only keens for the ones already marked. Somebody marked Lionel Crane a long time before last night."},{q:"Where did you go afterwards?",a:"To the multi-faith room, to pray. Then home. I sign every book they put in front of me."},{q:"Who is Ivy?",requires:"gray:ivy",a:"A common enough name. I'll pray for her as well. Whoever she was, she must have been very cold.",fact:'Asked about "Ivy", Fr. Gray said: "she must have been very cold." Nobody had mentioned the ice to him.',kind:"clue"}],present:{visitor:{contra:!0,needsLab:!0,text:"The diocese is a slow animal, Detective. Paperwork goes astray. I go where I'm sent.",fact:"Fr. Gray lied about who he is: the diocese has no priest called Lucan Gray, his letter is forged, and he signs left-handed in gloves."},pyx:{contra:!0,needsLab:!0,text:"He took it from my hand and I watched him swallow. Monkshood grows wild at the edge of a millpond I know. A little girl used to pick it there, not knowing what it was. He knew exactly what he'd done to her. All I did was give the night a voice.",fact:"Gray's own pyx held the aconite hosts. He gave Crane the poisoned wafer himself."},ductspeaker:{needsLab:!0,text:"A speaker in a chapel? Prisoners are endlessly inventive."},comb:{needsLab:!0,text:"In Ireland they say never pick up a comb you find on the ground. It belongs to her. Did you pick it up, Detective?"}},crack:'Gray folds his hands, left over right, and smiles at the wall as if someone is standing beside it. "One," he says softly. He does not speak again.',crackEnd:"Father Gray has stopped speaking. He is counting under his breath. You have enough to make an accusation.",dismiss:["God sees that too, I'm sure.","That is of no interest to me, or to Him.","You are looking in the wrong world, Detective."]}];function mg(){return(0,B.jsxs)("g",{children:[(0,B.jsxs)("defs",{children:[(0,B.jsx)("pattern",{id:"k1brick",width:"44",height:"22",patternUnits:"userSpaceOnUse",children:(0,B.jsx)("path",{d:"M0 21.5H44M22 0V11M0 11H44M11 11V22M33 11V22",stroke:"#141A22",strokeWidth:"1"})}),(0,B.jsxs)("linearGradient",{id:"k1strip",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,B.jsx)("stop",{offset:"0",stopColor:"#CFFAFE",stopOpacity:".28"}),(0,B.jsx)("stop",{offset:"1",stopColor:"#CFFAFE",stopOpacity:"0"})]}),(0,B.jsxs)("radialGradient",{id:"k1screen",cx:".5",cy:".5",r:".5",children:[(0,B.jsx)("stop",{offset:"0",stopColor:"#34D399",stopOpacity:".5"}),(0,B.jsx)("stop",{offset:"1",stopColor:"#34D399",stopOpacity:"0"})]}),(0,B.jsxs)("radialGradient",{id:"k1cand",cx:".5",cy:".5",r:".5",children:[(0,B.jsx)("stop",{offset:"0",stopColor:"#FBBF24",stopOpacity:".35"}),(0,B.jsx)("stop",{offset:"1",stopColor:"#FBBF24",stopOpacity:"0"})]}),(0,B.jsxs)("radialGradient",{id:"k1cold",cx:".5",cy:".5",r:".5",children:[(0,B.jsx)("stop",{offset:"0",stopColor:"#7DD3FC",stopOpacity:".22"}),(0,B.jsx)("stop",{offset:"1",stopColor:"#7DD3FC",stopOpacity:"0"})]})]}),(0,B.jsx)("rect",{x:"0",y:"0",width:"880",height:"440",fill:"#0B0F15"}),(0,B.jsx)("rect",{x:"0",y:"0",width:"880",height:"380",fill:"url(#k1brick)",opacity:".9"}),(0,B.jsx)("rect",{x:"430",y:"84",width:"440",height:"22",fill:"#151B24",stroke:"#232C38"}),[470,540,610,680,750,820].map(e=>(0,B.jsx)("path",{d:`M${e} 84v22`,stroke:"#232C38"},e)),(0,B.jsx)("rect",{x:"0",y:"380",width:"880",height:"60",fill:"#0E1218"}),(0,B.jsx)("path",{d:"M0 380H880",stroke:"#1E2632",strokeWidth:"2"}),(0,B.jsx)("rect",{x:"20",y:"40",width:"210",height:"340",fill:"#0D131B",opacity:".6"}),(0,B.jsx)("text",{x:"30",y:"370",fill:"#3B4656",fontFamily:"ui-monospace,monospace",fontSize:"10",letterSpacing:"2",children:"OFFICERS' STATION"}),(0,B.jsx)("rect",{x:"70",y:"128",width:"54",height:"64",rx:"3",fill:"#1A222D",strok {d:"M702 222v110",stroke:"#3B2E20"}),(0,B.jsx)("rect",{x:"690",y:"276",width:"22",height:"16",rx:"2",fill:"#B08D3C",opacity:".85"}),[0,1,2].map(e=>(0,B.jsx)("rect",{x:650+e*6,y:346-e*6,width:"70",height:"6",fill:"#3B2A4A",opacity:".7"},e))]})}var pg={id:"f1",n:1,code:"OC-0113",caseNo:"CASE 02",levelNo:"LEVEL 1/10",title:"The Keening",legend:"The Banshee",place:"HMP Blackwater \xB7 C-Wing",victim:"Dr. Lionel Crane",ambience:"prison",monster:"banshee",roomName:"Interview Room",roomMood:"STRIP LIGHT HUMMING",sceneName:"Cell Block C",eyeColor:"#7DD3FC",fog:"#7DD3FC",lowSanitySfx:"keen",sceneLabel:"Cut-away of the officers' station, cell 14 and the multi-faith room on C-Wing",Scene:mg,evidence:fg,suspects:hg,culprit:"gray",keyEvidence:["pyx"],trueMotive:"aconite",motives:[{id:"banshee",label:"The banshee's keening: a frightened man died at a death foretold"},{id:"neglect",label:"A guard's grudge: a sick prisoner left to die behind a locked door"},{id:"pipes",label:"A neighbour's revenge: poison passed through the shared duct"},{id:"aconite",label:"Aconite in the communion host, and a recorded wail to stage a banshee"}],shadowSpots:[[380,360],[700,360],[140,330]],hallu:["GET OFF THE ICE","ONE","SHE KEENS FOR YOU","HUSH NOW","TEN OF US"],blackout:"You come round on the floor of cell 14 with both hands pressed over your ears. Somebody has combed your hair. Your evidence is where you left it.",blackoutWake:"You blacked out on the floor of cell 14.",hint:"Only one person went into cell 14 after the 20:45 count, and only one thing went into Crane's mouth after supper. Where did it come from?",cold:["HMP BLACKWATER \xB7 C-WING \xB7 13 JANUARY \xB7 06:00","For two hours last night, every prisoner on C-Wing heard a woman keening.","There are no women on C-Wing.","At dawn, Dr. Lionel Crane, held on remand for the murder of Ambrose Vane, is found dead in a locked cell.","His hands are clamped over his ears. On his pillow lies a silver comb."],coldSub:"The banshee does not kill. She only weeps for the marked.",briefing:[(0,B.jsxs)(B.Fragment,{children:["At 06:00 the day shift unlocked cell 14 and found ",(0,B.jsx)("b",{className:"text-white",children:"Dr. Lionel Crane"}),", 68, held on remand for the murder of Ambrose Vane, dead on his bunk. His hands were clamped over his ears. A silver comb lay on his pillow. From 02:00 until nearly 04:00, every man on ",(0,B.jsx)("b",{className:"text-white",children:"C-Wing"})," heard a woman keening through the walls."]}),(0,B.jsx)(B.Fragment,{children:"The wing gate log shows no one came in. Three people were close to Crane last night. One of them is not who they say they are."})],archive:{from:"E. QUILL, ARCHIVIST",text:"The bean s\xEDdhe, the woman of the fairy mound. She keens outside a house when one of its people is about to die, and she combs her long grey hair while she weeps. Folklore is clear on one point: she foretells a death, she never causes one. If a man dies with her comb on his pillow, look for whoever wanted him to hear her coming. And a scream that repeats itself exactly is not a ghost, Detective. It is a tape."},timeline:[["1998","Lantern Night. Something happens on the ice that ten people agree never to speak of again."],["21 Dec","Ambrose Vane plans to confess at noon. Lionel Crane kills him first (Case 01)."],["30 Dec",'"Fr. Lucan Gray" starts at HMP Blackwater on a forged diocese letter.'],["20:45","Rusk's count: no comb on Crane's bunk."],["21:00","Gray gives Crane communion in his cell. The host is soaked in aconite. He leaves the comb."],["21:02","Gray draws the multi-faith room key and keeps it, then hides a timed speaker in the duct."],["21:40","Gray signs out of the wing."],["02:00","The timer starts the banshee loop. C-Wing wakes to keening."],["02:02","Rusk slips out to smoke. The wing gate stays locked."],["02:44","The intercom catches a child humming under the loop. There is no child in the building."],["03:12",`Crane begs: "Ivy, I'm sorry. Get off the ice."`],["\u224803:50","Lionel Crane dies of aconite poisoning, his hands over his ears."],["05:50","The multi-faith room key turns up in the gatehouse letterbox."]],redTimes:["21:00","21:02","05:50"],greenTimes:["02:44"],verdict:(0,B.jsxs)(B.Fragment,{children:[(0,B.jsx)("b",{className:"text-white",children:'"Father Lucan Gray"'})," is charged with the murder of Dr. Lionel Crane. He poisoned the communion host with aconite, hid a looped banshee recording in the duct behind cell 14, and left a silver comb on the pillow, so that a frightened man would die believing she had come for him."]}),after:"Gray is held overnight in the gatehouse cell. At 04:00 the custody officer hears a woman keening down the corridor and goes to look. When he comes back the cell door is still locked, the cuffs are still closed around the bench rail, and Gray is gone. On the bench lies a wax seal: a lantern inside a ring. The cameras show no one leaving.",fragment:{n:1,title:"Left-handed. Fluent in folklore.",text:"He writes with his left hand and wears gloves to do it. He quotes Irish legend like scripture. He knew Crane's past, he talks about a little girl at a millpond, and he signs his work with a lantern inside a ring."},seal:{ev:"vent",name:"The Humming",text:"Under the fake banshee, a real child hummed four bars of a lullaby, close enough to touch the microphone. The tune will come back. Keep listening."},lantern:`Crane's letter: "LANTERN NIGHT was not my idea. There were ten of us. Start with the ice."`,nextTease:'Folded inside the pyx lid: a page torn from a book printed in 1891. "THE VAMPYRE. It feeds only where it has been invited in." Beneath it, in fresh ink, a name: Mortimer Grail.',herrings:[(0,B.jsxs)(B.Fragment,{children:[(0,B.jsx)("b",{className:"text-white",children:"Officer Rusk"})," left her desk to smoke while the keening played. Nobody got past the locked gate."]}),(0,B.jsxs)(B.Fragment,{children:[(0,B.jsx)("b",{className:"text-white",children:"Ray Tully"})," pretended to sleep. He heard a child humming and Crane begging Ivy to get off the ice."]})],real:["A child humming four bars of a lullaby under the recording, three times, close to the microphone. The intercom has no explanation for it.","At 03:41 the intercom logged cell 14 at \u22122 \xB0C for ninety seconds. The cell has no window.",'The comb is engraved "St. B." Somewhere, a place with those initials is waiting.']},Ym=pg;var yv=ae(Pe());var P=ae(me());$e({vivian:{skin:"#EEC9B0",skinD:"#B48A70",iris:"#3F6E8C",rim:"#F472B6",bg:["#2A0F1E","#07050A"],lips:"#9F1D3F",liner:!0,brow:"#2A1A14",hair:"long",hairC:"#1F1410",outfit:"turtleneck",outfitC:"#141018",motif:"arch"},pike:{skin:"#C99A7A",skinD:"#8E6650",iris:"#5B4632",rim:"#22D3EE",bg:["#0B2028","#05070A"],lips:"#8A584E",brow:"#2A1E16",hair:"cap",outfitC:"#1E2A22",outfit:"jumper",motif:"fog",stubble:!0,bags:!0},brandt:{..._e,skin:"#E9CDB5",skinD:"#AA866C",rim:"#F87171",bg:["#2A0A0A","#060405"],lips:"#8A5250",brow:"#1F1A18",hair:"slick",hairC:"#1F1A18",outfit:"medic",outfitC:"#1E293B",accent:"#CBD5E1",motif:"candles",glasses:"#9CA3AF",mous:"#2A221E"}});var gg={body:{name:"Grail in the stone coffin",icon:Ie,x:420,y:300,spot:"The Grail vault",curse:4,scene:"Mortimer Grail lies in the open stone coffin of an ancestor who died in 1703, hands folded on his chest as if somebody arranged them. His skin is the grey-white of candle wax. A handful of dark soil has been sprinkled over his shirt. The coffin lid leans against the wall.",scan:"tox",method:"Toxicology & blood volume",result:`Midazolam (a fast hospital sedative) in the blood at a level that would leave a man limp and confused within minutes.
He lost about 70% of his blood volume WHILE ALIVE. Lividity shows he lay perfectly still the whole time. No defensive wounds. No struggle.
Time of death: 02:15 to 02:45.`,fact:"Grail was heavily sedated with midazolam, then bled out while alive and lying still. He never fought back."},bite:{name:"The bite on the neck",icon:zn,x:470,y:268,spot:"Grail's throat",curse:6,scene:"Two punctures on the right side of his throat, a thumb's width apart, each with a faint purple ring. Exactly where the films put them. The runner who found him keeps saying the word out loud and then apologising.",scan:"trace",method:"Wound & residue analysis",result:`Two clean round holes 3.2 cm apart over the external jugular vein, each 2 mm wide: the size of a 14-gauge IV cannula. The purple rings are tape bruises.
Adhesive residue from medical tape on the skin around both.
No saliva. No tooth marks. Nothing bit him.`,fact:'The "bite" is two 14-gauge IV cannula sites, taped in place and then pulled. Nothing bit Grail.'},thermos:{name:"Grail's thermos flask",icon:On,x:566,y:226,spot:"Ledge by the vault",scene:'A steel thermos on the ledge, a third of the coffee left. A paper tag hangs from the handle on a string, written in a careful hand: "M.G. For the nerves."',scan:"tox",method:"Toxicology",result:`Midazolam dissolved in the coffee, a strong dose per cup.
The tag reads, in full: "M.G. For the nerves. Dr. B."
The flask was handed over at about 00:30, according to the show's running order.`,fact:`The coffee in Grail's thermos was laced with midazolam. The tag reads "For the nerves. Dr. B."`},camera:{name:"Crypt camera & gallery log",icon:Ca,x:618,y:246,spot:"Tripod at the vault mouth",scanCurse:5,scene:"The show's locked-off crypt camera on its tripod, red tally light dead. The feed to air went black at 00:52 and came back at 02:10. The camera has its own backup recorder that kept running.",scan:"evp",method:"EVP audio analysis",result:`GALLERY LOG: feed cut MANUALLY from deck 2 (operator: O. Pike) at 00:52. Restored 02:10.
BACKUP RECORDER, still rolling:
00:58 Grail, slurring: "Doc? I feel heavy. Is this the plan?" A calm man: "Lie back, Mortimer. Let them come to you."
01:05 Tape tearing. A soft, steady dripping, for a long time.
01:44 A woman: "Mort? We've been dark an hour, you idiot." The calm man: "He's resting. Adrenaline crash. I'll stay with him." Footsteps leave.`,fact:'The backup recorder: Pike cut the feed by hand at 00:52. At 00:58 "Doc" tells a slurring Grail to lie back. At 01:44 a woman comes down and is told he is "resting".'},rig:{name:"The show's EMF & thermal rig",icon:Sn,x:292,y:312,spot:"Equipment crate",anomaly:!0,scanCurse:7,scene:`Grail's famous ghost-hunting rig: an EMF meter wired to a thermal camera, logging everything to a laptop on a crate. The crew call its false alarms "the Visitor". It logged something at 01:20 that nobody has explained.`,scan:"emf",method:"EMF spike scan",result:`01:20:04 A 7 mG pulse at the foot of the crypt stairs. No cable runs there.
It MOVES. Walking pace, from the stairs to the head of the coffin, then holds for 40 seconds.
Thermal at the same spot: a figure about 1.2 m tall, \u22124 \xB0C against the 9 \xB0C room. Child height.
At 01:20:44 it is simply not there.`,fact:"At 01:20 something child-sized and freezing walked from the stairs to the coffin and stood there for 40 seconds while Grail was still alive."},glove:{name:"Discarded surgical glove",icon:Gn,x:372,y:372,spot:"Crypt floor drain",scene:"Caught in the iron grate of the old floor drain: a single blue nitrile glove, left hand, rolled inside out as if peeled off in a hurry. The drain smells of salt and pennies.",scan:"uv",method:"UV blacklight sweep",result:`Under UV the glove glows with blood and saline to the wrist, and the drain grate is lit up with it: this is where Grail's blood went.
The glove's little finger is packed with a twist of cotton wool to fill the tip. Whoever wore it is MISSING THE TOP JOINT OF THE LEFT LITTLE FINGER.`,fact:"The drained blood went down the crypt drain. The killer's left glove has cotton packed into the little finger: he is missing its top joint."},vhs:{name:"VHS tape in Grail's coat",icon:Do,x:238,y:206,spot:"Coat on the vault hook",scanCurse:8,scene:`Grail's camel coat hangs on an iron hook in the wall. In the inside pocket: a VHS cassette, the label in faded marker: "LANTERN NIGHT \xB7 RAW \xB7 DO NOT AIR \xB7 12.98".`,scan:"evp",method:"EVP audio analysis",result:`Snow-light video, the audio badly degraded.
Children screaming, then adults laughing. A man (Ambrose Vane, younger): "Keep rolling, this is gold!"
A girl, far off, out of breath: "Wait for me! I can't see the lantern!"
Someone: "Ivy! Ivy, get back off the ice!"
A long, cracking sound like a gunshot under water.
A younger Mortimer Grail: "Cut. CUT. Turn it off. Turn it OFF."`,fact:'Grail kept the raw tape of LANTERN NIGHT, December 1998: screaming children, a girl called Ivy on the ice, the ice breaking, and Grail shouting "Cut."'},bag:{name:"Medic's bag",icon:Nn,x:774,y:150,spot:"Medical tent, abbey gate",scene:"Up at the abbey gate, in the show's medical tent: a fold-out bed, a heater, a paperback face-down at page one, and the set medic's black bag zipped shut on the table.",scan:"trace",method:"Trace & packaging analysis",result:`Inside: two torn wrappers for 14-GAUGE IV CANNULAS, a coil of used tubing, a roll of medical tape with one end cut, and three empty midazolam ampoules. Batch numbers match the residue in the thermos.
No fingerprints on anything. The paperback is an 1891 bestiary, every page about vampires underlined.`,fact:"The medic's bag holds the used cannula wrappers, tubing, tape and empty midazolam ampoules that drained Grail."}},yg=[{id:"vivian",name:"Vivian Grail",role:"Producer & estranged wife",look:{id:"vivian"},motive:"Mortimer was divorcing her and taking the show with him. His death leaves both in her hands.",alibi:"Says she sat in the outside-broadcast van all night and never set foot in the crypt.",qs:[{q:"What was tonight's show?",a:`"Night Visitors Live: The Vampire's Crypt." Six hours, one camera, Mortimer alone with the Grail family dead. Two million people watched him fall asleep. They thought it was a bit.`},{q:"How were things between you?",a:"He was leaving me for a twenty-six-year-old runner and taking the show. So, awful. But you don't kill the golden goose, Detective. You wait for it to get old."},{q:"Who is Dr. Brandt?",a:"Mortimer hired him. Insisted on a medic for the scare segments, for his heart. Brandt wore gloves all the time, even indoors. He said his hands hadn't been warm since one winter when he was a boy.",fact:`Vivian: Grail hired Brandt himself. Brandt always wore gloves: "his hands hadn't been warm since one winter when he was a boy."`,kind:"clue"}],present:{camera:{contra:!0,needsLab:!0,text:"Fine! I went down at quarter to two. We'd been dark an hour and I was going to kill him myself. He was lying in that coffin, grey, and the doctor was kneeling over him holding his wrist. Brandt said it was an adrenaline crash and he'd watch him. I believed him. Why wouldn't I? He was the doctor.",fact:'Vivian lied: at 01:44 she went down and found Brandt kneeling over Grail, who was grey and still. Brandt told her he was "resting".'},thermos:{needsLab:!0,text:`"For the nerves, Dr. B." That's Brandt's handwriting. He made Mort's coffee every live night. Mort called him his little apothecary.`,fact:"Vivian: the thermos tag is Brandt's handwriting. He made Grail's coffee every live night.",kind:"clue"},vhs:{needsLab:!0,text:"Lantern Night. He swore to me he burned that. It was his first job, a Christmas special for some little channel. A child died. He never told me more than that, and I never asked.",fact:`Vivian: Lantern Night was Grail's first TV job, a Christmas special. "A child died."`,kind:"clue"}},dismiss:["That's not going on the poster.","Darling, I deal in ratings, not rubbish.","Talk to my lawyer. Or my publicist. Whoever's awake."]},{id:"pike",name:"Owen Pike",role:"Camera operator",look:{id:"pike"},motive:'Grail humiliated him on air last series and docked his pay for "stealing the shot".',alibi:'Says the crypt feed died on its own at 00:52, "ghost interference", and he could not get it back until 02:10.',qs:[{q:"What happened to the feed?",a:"Died. Just died. Happens in crypts, EM interference, the crew call it the Visitor. I got it back at ten past two and he was asleep in the box. The viewers loved it."},{q:"Where were you at 01:00?",a:"Swearing at a deck in a van. Ask the runner."},{q:"Did Grail fake things?",a:"Every week. That's the job. Doesn't make it a crime."}],present:{camera:{contra:!0,needsLab:!0,text:'Okay, I cut it. He told me to! Mort had a stunt: kill the feed at ten to one, he gets in the coffin with fake blood on his collar, and when the doc gives me the nod I bring it back up on the "attack". The nod never came. I sat there for an hour like a lemon.',fact:"Pike lied: Grail had planned a fake vampire attack. Pike cut the feed on cue at 00:52 and waited for Brandt's signal to bring it back. It never came.",unlocks:"brandt:signal"},rig:{needsLab:!0,text:"That rig's junk, honestly. But that trace walks from the stairs to the box like a kid going to look in a pram. I've never seen it do that."},bite:{needsLab:!0,text:"Those aren't ours. The make-up bite was a transfer, stick-on. Those are holes.",fact:"Pike: the planned stunt used a stick-on bite transfer, not punctures.",kind:"clue"}},dismiss:["Can't shoot that, mate.","Not my department, that.","Looks like nothing on a monitor."]},{id:"brandt",name:"Dr. Elias Brandt",role:"On-set medic",look:{id:"brandt"},motive:"None known. Hired by Grail three weeks ago through an agency.",alibi:"Says he stayed in the medical tent at the abbey gate all night and only went down when the alarm was raised at 05:30.",qs:[{q:"What happened to Mortimer?",a:"Something drank from him, Detective. Isn't that what tomorrow's headlines will say? The people who sell monsters always think they're the ones holding the leash."},{q:"Where were you during the blackout?",a:"In my tent, reading. A medic on a set like this spends most nights waiting for a heart attack that never comes."},{q:"Do you believe in vampires?",a:"The old stories are very particular. It can't come in unless it's invited. Mortimer invited me. He wrote me a very generous contract."},{q:"Pike was waiting for your signal.",requires:"brandt:signal",a:"Was he? Then he waited for the wrong man. I don't give signals, Detective. I give care.",fact:"Brandt did not deny that he was meant to signal Pike to restore the feed.",kind:"clue"}],present:{camera:{contra:!0,needsLab:!0,text:"Yes, I went down. A medic goes where his patient is. He was frightened. I told him to lie back. You would have done the same.",fact:"Brandt lied about staying in his tent: the backup recorder has him in the crypt with Grail at 00:58 and again at 01:44."},bag:{contra:!0,needsLab:!0,text:'Brandt peels off his right glove, then, slowly, his left. The top of the little finger is gone, the stump old and white. "You get that," he says, "lying on ice for an hour trying to reach someone through it. Mortimer was filming."',fact:"The medic's own bag held the cannulas and sedative. Brandt drained Grail himself, and has the missing fingertip to match the glove."},thermos:{needsLab:!0,text:"Coffee and a little something for the nerves. He asked for it. He always asked for it."},rig:{needsLab:!0,text:"Did it stand by the coffin? Good. Somebody should have been there to watch him go who wasn't paid to."}},crack:'Brandt lays both hands flat on the table, the left little finger ending at the first joint. "Two," he says, and closes his eyes.',crackEnd:"Brandt has stopped talking. His eyes stay closed. You have enough to make an accusation.",dismiss:["Clinically uninteresting.","That tells me nothing about the patient.","You are treating the symptom, Detective."]}];function wg(){return(0,P.jsxs)("g",{children:[(0,P.jsxs)("defs",{children:[(0,P.jsx)("pattern",{id:"v2stone",width:"60",height:"30",patternUnits:"userSpaceOnUse",children:(0,P.jsx)("path",{d:"M0 29.5H60M30 0V15M0 15H60M15 15V30M45 15V30",stroke:"#16130F",strokeWidth:"1"})}),(0,P.jsxs)("linearGradient",{id:"v2shaft",x1:"0",y1:"0",x2:"1",y2:"1",children:[(0,P.jsx)("stop",{offset:"0",stopColor:"#C7D2FE",stopOpacity:".28"}),(0,P.jsx)("stop",{offset:"1",stopColor:"#C7D2FE",stopOpacity:"0"})]}),(0,P.jsxs)("radialGradient",{id:"v2cand",cx:".5",cy:".5",r:".5",children:[(0,P.jsx)("stop",{offset:"0",stopColor:"#F59E0B",stopOpacity:".42"}),(0,P.jsx)("stop",{offset:"1",stopColor:"#F59E0B",stopOpacity:"0"})]}),(0,P.jsxs)("radialGradient",{id:"v2tent",cx:".5",cy:".6",r:".6",children:[(0,P.jsx)("stop",{offset:"0",stopColor:"#FCA5A5",stopOpacity:".2"}),(0,P.jsx)("stop",{offset:"1",stopColor:"#FCA5A5",stopOpacity:"0"})]})]}),(0,P.jsx)("rect",{width:"880",height:"440",fill:"#0D0B09"}),(0,P.jsx)("rect",{width:"880",height:"400",fill:"url(#v2stone)"}),[[220,380],[420,380]].map(([e,t])=>(0,P.jsx)("path",{d:`M${e} 400V150a${t/2-100} 90 0 0 1 ${t-200} 0V400`,fill:"none",stroke:"#221C16",strokeWidth:"14"},e)),(0,P.jsx)("path",{d:"M200 400V160Q420 30 640 160V400",fill:"#0A0807",opacity:".55"}),(0,P.jsx)("path",{d:"M0 60h70v40h30v40h30v40h30v40h30v40h30v140H0z",fill:"#14110D",stroke:"#221C16"}),(0,P.jsx)("path",{d:"M0 40L60 40 360 420H0z",fill:"url(#v2shaft)"}),(0,P.jsx)("text",{x:"12",y:"30",fill:"#4A4234",fontFamily:"ui-monospa iew Room",roomMood:"CANDLES GUTTERING",sceneName:"The Grail Crypt",eyeColor:"#F87171",fog:"#C7D2FE",ashColor:"#6B5E4A",sceneLabel:"Cut-away of the Grail family crypt under Saltwick Abbey, with the medical tent at the abbey gate",Scene:wg,evidence:gg,suspects:yg,culprit:"brandt",keyEvidence:["bag"],trueMotive:"drain",motives:[{id:"vampire",label:"A vampire's feeding: the crypt's oldest resident rose for him"},{id:"divorce",label:"A wife's inheritance: a stunt gone wrong, left to finish itself"},{id:"grudge",label:"A cameraman's revenge: he killed the feed so no one would see"},{id:"drain",label:"Sedated with laced coffee, then drained through two IV cannulas dressed as a bite"}],shadowSpots:[[120,380],[740,400],[250,380]],hallu:["INVITE ME IN","TWO","CUT","LIE BACK","I CAN'T SEE THE LANTERN"],blackout:"You wake inside the empty stone coffin with your hands folded on your chest. Someone has sprinkled soil over your shirt. Your evidence is where you left it.",blackoutWake:"You blacked out and woke in the stone coffin.",hint:"The camera went dark because somebody wanted a stunt. Who brought the coffee, who brought the needles, and whose bag were they in?",cold:["SALTWICK ABBEY \xB7 THE GRAIL CRYPT \xB7 29 JANUARY \xB7 05:30","Two million people watched Mortimer Grail fall asleep in a coffin on live television.","They thought it was part of the show.","At dawn, the runner sent to wake him finds two small holes in his neck, and almost no blood left in his body.","Pressed into the rim of the coffin: a wax lantern inside a ring."],coldSub:"It cannot come in unless it is invited.",briefing:[(0,P.jsxs)(P.Fragment,{children:["At 05:30 a runner went down to wake ",(0,P.jsx)("b",{className:"text-white",children:"Mortimer Grail"}),", 59, host of TV's ",(0,P.jsx)("i",{children:"Night Visitors"}),", for the dawn segment of his live vigil in his ancestors' crypt under ",(0,P.jsx)("b",{className:"text-white",children:"Saltwick Abbey"}),". He was cold in an open stone coffin, two punctures in his neck, his body almost bloodless."]}),(0,P.jsx)(P.Fragment,{children:"The live feed went dark from 00:52 to 02:10. When it came back, Grail was already lying where he died. Three people were on set with him. A wax lantern seal was pressed into the coffin rim. The Folklorist has written his second page."})],archive:{from:"E. QUILL, ARCHIVIST",text:"Every vampire tradition from the Balkans to the Baltic agrees on the rules. It must be invited over the threshold. It cannot cross running water. It sleeps in the soil it was buried in. What none of the old accounts mention is a neat pair of holes: folklore vampires were bloated, red-faced, messy things. Two tidy punctures come from the cinema, Detective. Or from a needle."},timeline:[["1998","Mortimer Grail, 34, films LANTERN NIGHT, his first TV job. It is never broadcast."],["3 wks ago",'"Dr. Elias Brandt" is placed as on-set medic by an agency nobody has heard of.'],["22:00","Night Visitors goes live from the Grail family crypt."],["00:30",'Brandt hands Grail a thermos "for the nerves", laced with midazolam.'],["00:52","On Grail's cue, Pike cuts the feed for the fake vampire attack."],["00:58",'Brandt comes down to the crypt. "Lie back, Mortimer. Let them come to you."'],["01:05","Sedated, Grail is fitted with two cannulas in his neck and bled into the floor drain."],["01:20","The show's rig follows something child-sized from the stairs to the coffin."],["01:44",'Vivian comes down, finds Brandt "taking his pulse", and leaves.'],["02:10",'Pike restores the feed. Two million people watch Grail "sleep".'],["\u224802:30","Mortimer Grail dies. The cannulas are pulled, leaving two neat holes."],["05:30","The runner tries to wake him for the dawn segment."]],redTimes:["00:30","00:58","01:05"],greenTimes:["01:20"],verdict:(0,P.jsxs)(P.Fragment,{children:[(0,P.jsx)("b",{className:"text-white",children:'"Dr. Elias Brandt"'})," is charged with the murder of Mortimer Grail. He sedated Grail with laced coffee, used Grail's own fake-attack stunt to get the camera switched off, and drained him through two IV cannulas so the wounds would read as a vampire's bite."]}),after:"Brandt is driven to the station in a locked van with two officers in the front. At the abbey gate every light on the van dies at once. When they come back on, the rear door is still locked from the outside and Brandt is gone. Wedged in the door seal is a wax lantern inside a ring. The agency that placed him was registered three weeks ago, to an address that turns out to be a churchyard.",fragment:{n:2,title:"Missing the tip of his left little finger.",text:'An old injury, long healed and white. Cold damage, the kind you get lying on ice. He said he lost it "trying to reach someone through it" while Grail filmed. He was there.'},seal:{ev:"rig",name:"The Small Visitor",text:"Something child-sized and freezing walked from the crypt stairs to the coffin at 01:20 and stood there for forty seconds while Grail was still alive. It was watching."},lantern:`Grail's raw tape: a girl called Ivy on the ice, the ice breaking, and Grail shouting "Cut."`,nextTease:`Pinned under the coffin lid: a second page from the 1891 book. "THE WERE-WOLF. Under the hunter's moon, the man becomes the beast he hunts." Beneath it, in fresh ink: Hamish Rook.`,herrings:[(0,P.jsxs)(P.Fragment,{children:[(0,P.jsx)("b",{className:"text-white",children:"Vivian Grail"})," left the van and saw Brandt over her husband. She took him at his word, and lied to protect her job."]}),(0,P.jsxs)(P.Fragment,{children:[(0,P.jsx)("b",{className:"text-white",children:"Owen Pike"})," cut the feed on Grail's own orders for a fake attack, and waited for a signal that never came."]})],real:["At 01:20 something child-sized, colder than ice, walked from the stairs to the coffin and watched.","Every candle in the crypt guttered at once at 01:20 and relit itself. The backup recorder caught the sound.","A small handprint, frosted white, on the inside of the coffin lid. It melted while the photographer worked."]},Km=kg;var Lv=ae(Pe());var W=ae(me());$e({moira:{skin:"#E3B496",skinD:"#A47A60",iris:"#4E6B4A",rim:"#A3E635",bg:["#14200F","#05070A"],lips:"#9A5E54",brow:"#8A8A80",hair:"bun",hairC:"#9A968C",outfit:"waxed",outfitC:"#2E3A22",accent:"#7A2E2E",motif:"fog",age:!0},callum:{skin:"#EBC6A8",skinD:"#AE8668",iris:"#5A7A96",rim:"#FBBF24",bg:["#241A0C","#06060A"],lips:"#A0645A",brow:"#7A4A22",hair:"curly",hairC:"#7A4A22",outfit:"jumper",outfitC:"#5A3A2A",motif:"fog",bags:!0,glasses:"#1F2937"},harrow:{..._e,skin:"#DDB494",skinD:"#9E7658",rim:"#E5E7EB",bg:["#0E1622","#04060A"],lips:"#8A5A50",brow:"#3A2E24",hair:"cap",outfit:"waxed",outfitC:"#1E2B1E",accent:"#3A2E24",motif:"moon",beard:"#4A3A2C"}});var xg={body:{name:"Rook at the standing stone",icon:Ie,x:432,y:350,spot:"Foot of the Grey Man stone",curse:7,scene:"Hamish Rook lies on his back in the frost at the foot of the standing stone, his tweed coat and chest torn open in four long parallel lines. His face is turned to where the moon was. The frost around him has not melted: he was cold before the night was over.",scan:"trace",method:"Wound analysis",result:`Cause of death: one heavy blow to the back of the skull with a flat object, at about 01:50. He fell forward, then was rolled onto his back.
The "claw" wounds were made AFTER DEATH: four straight, parallel cuts exactly 2.4 cm apart, the same depth end to end. No animal pulls that evenly.
No saliva. No bite marks anywhere.`,fact:"Rook was killed by a blow to the back of the head. The four claw cuts were made after death, perfectly parallel, 2.4 cm apart. No animal touched him."},prints:{name:"Pawprints in the frost",icon:ba,x:352,y:396,spot:"Ring around the body",scene:"Pawprints the size of dinner plates circle the body three times, then lope off towards the heather and simply stop. Among them, half hidden, the tread of a heavy boot.",scan:"trace",method:"Print & frost-layer analysis",result:`TWO SETS OF PAWPRINTS.
Set A (older, frost formed INSIDE them, about 23:00): small, crisp, identical: cast from a resin "Beast of Kell Moor" souvenir mould.
Set B (fresh, pressed ON TOP of the frost, about 02:00): huge, hand-carved, each print identical to the last.
Boots with set B: size 11, a chevron sole issued to National Park rangers.`,fact:"Two sets of fake prints: small gift-shop casts stamped at about 23:00, and huge carved ones stamped at about 02:00 beside size-11 park-ranger boots."},fur:{name:"Grey fur in the heather",icon:ot,x:314,y:334,spot:"Heather by the stone",scene:"Tufts of coarse grey fur snag on the heather in a trail away from the body. The tabloid photographers have already shot it from every angle.",scan:"uv",method:"UV blacklight sweep",result:`Under UV the fur splits in two.
Most of it glows blue-white: ACRYLIC costume fur, dyed grey, from a full-body animal suit. It lies UNDER the frost.
The rest does not glow: real, coarse IRISH WOLFHOUND hair, lying ON TOP of the frost. Dogs came here hours after the killing.`,fact:'The "wolf fur" is acrylic costume fur, under the frost. Real wolfhound hair lies on top of it: dogs came hours after Rook died.'},rifle:{name:"Rook's rifle & silver bullets",icon:Hn,x:530,y:372,spot:"In the frost beside him",scene:"Rook's rifle lies where it dropped, loaded with five bright silver bullets from a presentation box. It was never fired.",scan:"trace",method:"Ballistics & prints",result:`Unfired. The "silver" bullets are lead with silver paint: the souvenir set sold in Rook's own gift shop for \xA312.99.
Only Rook's fingerprints.
Scratched into the stock, recently, with a blade: a lantern inside a ring, and the number 3.`,fact:"Rook's silver bullets were painted lead from his own shop. The stock is freshly scratched with a lantern sigil and the number 3."},trailcam:{name:"Trail camera on the wall",icon:Dn,x:166,y:236,spot:"Drystone wall",scene:"Rook's infrared trail camera, strapped to a gatepost on the drystone wall, aimed at the stone. Its box has been opened and closed again. A strip of evidence tape has been laid neatly across the seam.",scan:"trace",method:"Seal & memory-card check",result:`The memory card is BLANK and brand new: the original was swapped out after about 02:00.
The tape over the seam is a tamper-evident EVIDENCE SEAL, serial OCU-7731-0442. That serial batch was printed for, and only ever issued to, the OCCULT CRIMES UNIT.`,fact:"Someone swapped the trail camera's card and resealed it with an evidence seal from a batch only ever issued to the Occult Crimes Unit."},recorder:{name:"Rook's field recorder",icon:Ft,x:478,y:318,spot:"Strap on the stone",anomaly:!0,scanCurse:8,scene:"A parabolic-dish sound recorder hangs by its strap from an iron ring in the stone. Rook recorded every full moon for thirty years, hoping for a howl he did not make himself. The battery light is still blinking.",scan:"evp",method:"EVP audio analysis",scanSfx:"howl",result:`01:41 A long low "howl", close. Spectral analysis: a human voice singing one note through a tube.

01:49 A man, calm: "You should. You wore one to Saint Brigid's."
Rook: "Oh God. Oh God, you're one of the..." A heavy impact.
02:30 UNDER THE WIND: a child humming the same four bars of a lullaby. Then, very close, a small voice: "Come home."`,fact:`Rook's killer said: "You wore one to Saint Brigid's." Later, under the wind, the same child hums the lullaby and whispers "Come home."`},claw:{name:"Steel claw in the log store",icon:rl,x:802,y:346,spot:"Ranger hut log store",scene:"In the log store behind the ranger hut, pushed under the kindling: a gardening hand-rake that somebody has rebuilt with four long, sharpened steel tines. It has been scrubbed.",scan:"trace",method:"Tool-mark & residue analysis",result:`Four tines, exactly 2.4 cm apart: a perfect match for the wounds.
Scrubbed, but blood remains in the weld seams: Hamish Rook's.
Pushed up inside the hollow handle: a wad of grey acrylic costume fur.
Glove fibres only.`,fact:"The rebuilt steel claw from the ranger hut log store matches Rook's wounds exactly, with his blood in its welds."},photo:{name:"Polaroid in Rook's van",icon:jn,x:114,y:322,spot:"Rook's camper van",scene:"Rook's camper van is parked at the moor gate. The trunk where he kept his old wolf suit is open and empty except for a single Polaroid, left face up on the bottom, as if for you.",scan:"trace",method:"Photo & ink analysis",result:`December 1998. Ten adults in costume in front of a red-brick building in snow: a banshee, a vampire, a wolf, a weeping woman in black lace, a rider with no head, a black dog, a horned thing in chains, a hooded reaper, a woman in a grey veil, and Ambrose Vane holding a lantern.
On the white border: "The Lantern Night Ten. St. Brigid's. Never again."
Three faces have been crossed out in red ink within the last day: the banshee, the vampire, the wolf.`,fact:"The Polaroid of the Lantern Night Ten at St. Brigid's, 1998: ten costumes. The banshee, vampire and wolf have been crossed out in fresh red ink."}},vg=[{id:"moira",name:"Moira Dunleavy",role:"Hill farmer",look:{id:"moira"},motive:"Rook blamed her lost lambs on his Beast for the publicity, and his tours trampled her land. She once fired a shotgun over his tour bus.",alibi:"Says her two wolfhounds were chained in the barn all night and she never left the farmhouse.",qs:[{q:"What happened to your lambs?",a:"Foxes and a hard winter. Rook told the papers it was his Beast. Coachloads of fools trampled my lambing field for a month."},{q:"Where were your dogs?",a:"Chained in the barn. All night."},{q:"What did you hear?",a:"Wind. Then, around two, a howl. Not a dog. Too steady. Like someone singing one long note down a drainpipe.",fact:'Moira: the howl around 02:00 sounded "like someone singing one long note down a drainpipe."',kind:"clue"}],present:{fur:{contra:!0,needsLab:!0,text:"Aye, they got loose. I found them at the stone at five, sniffing round him. I dragged them home and said nothing. Folk round here would have them shot by dinner for being the Beast.",fact:"Moira lied: her wolfhounds got loose and found the body at 05:00. Their hair lies on top of the frost, hours after he died."},prints:{needsLab:!0,text:"Those big ones aren't any dog of mine. Or any dog at all. No dog puts its feet down that tidy."},body:{needsLab:!0,text:"Four lines, straight as a rake. That's no beast. I've seen what a dog does to a ewe and it isn't that."}},dismiss:["That's nowt to do with me.","I've beasts to feed, Detective.","Ask the Beast. He's more famous than me."]},{id:"callum",name:"Callum Rook",role:"Son & ghostwriter",look:{id:"callum"},motive:"Wrote all five of his father's Beast books and got neither credit nor royalties. He inherits the rights.",alibi:"Says he was at the Kell Arms all night, writing, and never went onto the moor.",qs:[{q:"Where were you last night?",a:"The inn. Writing. Ask anyone in the bar."},{q:"Did your father fake the Beast?",a:'Did the sun come up? He had a wolf suit. It lived in a trunk in the van. Thirty years of "sightings" in a trunk.',fact:"Callum: his father kept a wolf suit in a trunk in his van.",kind:"clue"},{q:"Who inherits the books?",a:"Me. Thirty years of lies, and my name on none of them."}],present:{prints:{contra:!0,needsLab:!0,text:`The small ones are mine, all right? Dad needed fresh "evidence" photos for book six. I stamped them in at eleven with the gift-shop cast and walked back to the inn by midnight. He was alive and shouting at me when I left. The big ones aren't mine. I've never seen that stamp in my life.`,fact:"Callum lied: he stamped the older prints at 23:00 with a gift-shop cast and left at midnight. The huge prints and the ranger boots came later.",unlocks:"harrow:boots"},photo:{needsLab:!0,text:"Lantern Night. He only talked about it once, drunk, at Christmas. He said a little girl ran from him onto the ice and he couldn't stop laughing, because the suit was so hot. Then he cried until he was sick.",fact:"Callum: on Lantern Night his father, in the wolf suit, chased a little girl onto the ice.",kind:"clue"},rifle:{needsLab:!0,text:"Silver paint on lead. We sell them in the shop. He knew they were fake. Everything was fake."}},dismiss:["That's not in any of the books.","Dad would have made something of that. I can't.","Is that relevant, or just atmospheric?"]},{id:"harrow",name:"Ned Harrow",role:"Park ranger, new this winter",look:{id:"harrow"},motive:"None known. He started on Kell Moor three months ago and helped Rook maintain his cameras.",alibi:'Says he spent the night in the ranger hut by the car park and heard "something big" out on the moor around two.',qs:[{q:"What did you hear?",a:"Howling, about two. Long and low, the way the old shepherds describe it. I've walked these moors three months and never heard a fox make a sound like that."},{q:"Did you know Rook?",a:"Everyone knows Hamish. His Beast pays half the wages on this moor. I kept his trail cameras running for him."},{q:"Do you believe in the Beast?",a:"I believe in men who dress up as one. You'd be amazed what a grown man will put on to make children scream."},{q:"Your boots are ranger issue, size 11.",requires:"harrow:boots",a:"So are the other four rangers'. We all get the same boots, Detective. Ask the stores.",fact:"Harrow wears size-11 ranger boots, the same as the prints beside the giant pawprints.",kind:"clue"}],present:{trailcam:{contra:!0,needsLab:!0,text:"Procedure, Detective. Chain of custody matters, even out here. I'd have thought you, of all people, would appreciate a proper seal.",fact:"Harrow lied about not touching the camera: he resealed it with a numbered Occult Crimes Unit evidence seal. That batch was only ever issued to the Unit."},claw:{contra:!0,needsLab:!0,text:`Harrow turns the claw over in his gloved hands as if he's pleased with the welds. "He wore a wolf suit on Lantern Night. Did you know? Chased us round the millpond on all fours, howling, while the camera rolled. She ran from him. Out where it was dark. Out where it was thin."`,fact:`Harrow's hidden claw made the wounds. He says Rook, in a wolf suit, chased "us" round the millpond on Lantern Night.`},recorder:{needsLab:!0,text:"A man's voice in the wind. The moor's full of them. Shepherds, walkers. Ghosts, if you like."},photo:{needsLab:!0,text:"Ten grown adults in fancy dress at a children's home at Christmas. What a thing to want to remember."}},crack:`Harrow takes off his cap and sets it on the table like a man finishing a shift. "Three," he says. Then, very quietly, to the empty chair beside you: "I know. I'm nearly done."`,crackEnd:"Harrow is sitting very still, listening to something you can't hear. You have enough to make an accusation.",dismiss:["Not my patch, that.","You'll want the police for that one. Oh. Right.","The moor doesn't care, and neither do I."]}];function bg(){return(0,W.jsxs)("g",{children:[(0,W.jsxs)("defs",{children:[(0,W.jsxs)("linearGradient",{id:"w3sky",x1:"0",y1:"0",x2:"0",y2:"1",children:[(0,W.jsx)("stop",{offset:"0",stopColor:"#0B1220"}),(0,W.jsx)("stop",{offset:".7",stopColor:"#141C2C"}),(0,W.jsx)("stop",{offset:"1",stopColor:"#0B0F16"})]}),(0,W.jsxs)("radialGradient",{id:"w3moon",cx:".5",cy:".5",r:".5",children:[(0,W.jsx)("stop",{offset:"0",stopColor:"#F8FAFC",stopOpacity:".55"}),(0,W.jsx)("stop",{offset:".35",stopColor:"#CBD5E1",stopOpacity:".18"}),(0,W.jsx)("stop",{offset:"1",stopColor:"#CBD5E1",stopOpacity:"0"})]}),(0,W.jsxs)("radialGradient",{id:"w3hut",cx:".5",cy:".5",r:".5",children:[(0,W.jsx)("stop",{offset:"0",stopColor:"#FBBF24",stopOpacity:".35"}),(0,W.jsx)("stop",{offset:"1",stopColor:"#FBBF24",stopOpacity:"0"})]})]}),(0,W.jsx)("rect",{width:"880",height:"440",fill:"url(#w3sky)"}),Array.from({length:40}).map((e,t)=>(0,W.jsx)("circle",{cx:t*97%880,cy:t*53%160,r:t%5?.7:1.2,fill:"#E2E8F0",opacity:.2+t%4*.12,className:t%3?"":"hm-twinkle"},t)),(0,W.jsx)("circle",{cx:"700",cy:"78",r:"120",fill:"url(#w3moon)"}),(0,W.jsx)("circle",{cx:"700",cy:"78",r:"34",fill:"#F1F5F9",opacity:".92"}),(0,W.jsx)("circle",{cx:"690",cy:"70",r:"6",fill:"#CBD5E1",opacity:".5"}),(0,W.jsx)("circle",{cx:"712",cy:"88",r:"4",fill:"#CBD5E1",opacity:".45"}),(0,W.jsx)("path",{d:"M0 230Q120 190 240 214T480 200T720 222T880 196V440H0z",fill:"#0E1520"}),(0,W.jsx)("path",{d:"M0 270Q160 236 320 258T620 250T880 240V440H0z",fill:"#101A16"}),(0,W.jsx)("path",{d:"M0 270h300",stroke:"#2A2F28",strokeWidth:"10",strokeDasharray:"12 3"}),(0,W.jsx)("rect",{x:"160",y:"214",width:"10",height:"64",fill:"#2B2A24"}),(0,W.jsx)("rect",{x:"154",y:"226",width:"22",height:"18",rx:"2",fill:"#1F2A1E",stroke:"#3F4A3A"}),(0,W.jsx)("circle",{cx:"165",cy:"235",r:"4",fill:"#0B0F0B",stroke:"#4B5563"}),(0,W.jsx)("circle",{cx:"171",cy:"229",r:"1.5",fill:"#B91C1C",className:"hm-rec"}
