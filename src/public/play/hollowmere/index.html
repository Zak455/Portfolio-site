io",[["path",{d:"M4.9 19.1C1 15.2 1 8.8 4.9 4.9",key:"1vaf9d"}],["path",{d:"M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5",key:"u1ii0m"}],["circle",{cx:"12",cy:"12",r:"2",key:"1c9p78"}],["path",{d:"M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5",key:"1j5fej"}],["path",{d:"M19.1 4.9C23 8.8 23 15.1 19.1 19",key:"10b0cb"}]]);var ml=F("RotateCcw",[["path",{d:"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8",key:"1357e3"}],["path",{d:"M3 3v5h5",key:"1xhq8a"}]]);var lr=F("Search",[["circle",{cx:"11",cy:"11",r:"8",key:"4ej97u"}],["path",{d:"m21 21-4.3-4.3",key:"1qie3q"}]]);var yt=F("Skull",[["path",{d:"m12.5 17-.5-1-.5 1h1z",key:"3me087"}],["path",{d:"M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z",key:"1o5pge"}],["circle",{cx:"15",cy:"12",r:"1",key:"1tmaij"}],["circle",{cx:"9",cy:"12",r:"1",key:"1vctgf"}]]);var Ma=F("Sparkles",[["path",{d:"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z",key:"4pj2yx"}],["path",{d:"M20 3v4",key:"1olli1"}],["path",{d:"M22 5h-4",key:"1gvqau"}],["path",{d:"M4 17v2",key:"vumght"}],["path",{d:"M5 18H3",key:"zchphs"}]]);var or=F("Volume2",[["path",{d:"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["path",{d:"M16 9a5 5 0 0 1 0 6",key:"1q6k2b"}],["path",{d:"M19.364 18.364a9 9 0 0 0 0-12.728",key:"ijwkga"}]]);var nr=F("VolumeX",[["path",{d:"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["line",{x1:"22",x2:"16",y1:"9",y2:"15",key:"1ewh16"}],["line",{x1:"16",x2:"22",y1:"9",y2:"15",key:"5ykzw1"}]]);var Ct=F("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);var hl=F("Zap",[["path",{d:"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]);var n=xa(xl());var Ac=(e,a,t)=>Math.max(a,Math.min(t,e)),We={hearth:{name:"Cold hearth & dead canary",icon:sl,x:300,y:74,spot:"Study fireplace",scene:`The fire has burned out to grey ash. The air still carries a faint, sweetish smoke. Beside the grate, Vane's canary lies on the floor of its cage, feet curled. Agnes calls it "the Widow's tithe: she takes every living thing in the room."`,scan:"tox",method:"Toxicology & soot-fall analysis",result:"Vane's blood: carboxyhaemoglobin 64%, fatal carbon-monoxide poisoning. The canary died the same way. Unburnt lumps under the ash show a full scuttle of coal was added at about 23:30. A fresh fall of loose soot lies ON TOP of the cold ash: something was dragged up out of the flue after the fire had died.",fact:"Vane died of carbon monoxide. The chimney was blocked while the fire burned, then cleared from above after it went out."},circle:{name:"Unbroken salt circle",icon:Ma,x:300,y:228,spot:"Centre of the study",curse:6,scanCurse:5,scene:"Vane sits slumped in his wingback chair inside a perfect ring of coarse salt, eyes open, face locked in terror. A second, empty chair faces him inside the circle. The air above it is noticeably colder. Your breath fogs.",scan:"emf",method:"EMF spike scan",result:"A 6\u20139 mG field with no wiring beneath the floor, pulsing irregularly and centred on the EMPTY chair. It does not behave like any electrical source. The salt ring is unbroken: no footprints, no scattered grains, no sign of a struggle. Nothing physical crossed it.",fact:"Genuine anomaly: an unexplained field lingers by the empty chair. But the circle is unbroken. No one, living or dead, laid a hand on Vane.",anomaly:!0},recorder:{name:"Vigil EVP recorder",icon:rr,x:398,y:276,spot:"Side table",scanCurse:8,scene:"A digital voice recorder on the side table, still running, its red light blinking. Vane recorded every solstice vigil, hoping to catch the Widow. Six hours and forty minutes of audio.",scan:"evp",method:"EVP audio analysis",result:`01:31\u201301:39 Scraping inside the chimney breast.
01:35 Knocking. A man: "Uncle? It's Julian. Please, I only want to talk." An older woman: "Come away, Master Julian. He won't open."
02:14 Vane, slurred: "Who's there? Eleanor? My head\u2026"
02:20 Glass shatters.
02:26 A woman's whisper, not Vane's. No living woman was in the room: "Look up. He has stopped the throat of the house."
04:41 Scraping in the chimney again. A soft fall of soot.`,fact:`Vane's recording: chimney scraping at 01:31 and 04:41; Julian and Agnes at the door at 01:35; Vane confused at 02:14; mirror breaks at 02:20; at 02:26 a whisper no living person made: "Look up."`,anomaly:!0},journal:{name:"Vane's research journal",icon:rl,x:128,y:168,spot:"Writing desk",scene:"A calfskin journal lies open on the desk under a guttered candle. Today's page is torn out. The page below holds only the faint grooves of pressed handwriting.",scan:"trace",method:"Indentation lift (oblique light)",result:`Recovered from the torn page: "Dec 21. The 1998 Hollowmere Recordings are spliced. The Widow's voice is Lionel's sister reading lines. Told L. after dinner. He wept, begged me. No. Society, noon tomorrow. The truth matters more than either of us."`,fact:"Vane discovered that Dr. Crane faked the famous Hollowmere Recordings, told him after dinner, and planned to expose him at noon."},mirror:{name:"Shattered mirror",icon:Jt,x:584,y:236,spot:"East wall",curse:8,scanCurse:4,scene:"A tall gilt mirror cracked in a starburst from the centre, as if struck from the other side. On the glass, a pale handprint glows faintly in the dark. Look too long and something seems to stand behind your reflection.",scan:"uv",method:"UV blacklight sweep",result:`Blood on the shards matches cuts on Vane's right knuckles: he struck the mirror himself, from the front, at shoulder height. Under UV, the "spirit hand" fluoresces as zinc-sulfide luminous paint. It was put there, not left there.`,fact:'Vane smashed the mirror himself, confused and terrified. The glowing "spirit hand" on it is luminous paint from a s\xE9ance trick.'},closet:{name:"Sealed spirit closet",icon:ar,x:520,y:92,spot:"North-east corner",curse:5,scene:"A narrow closet whose door bears an 1887 wax seal pressed with the Hollowmere sigil. Legend says it was sealed the night Lord Hollowmere died in this room. Faint scratching seemed to come from inside during the s\xE9ance.",scan:"uv",method:"UV blacklight sweep",result:`The 1887 seal was cut and re-pressed with modern craft wax. Inside: black gloves painted with luminous zinc sulfide (matching the mirror's "hand"), fishing line threaded to the chandelier, a hand bellows for "cold breath" and a wooden knocker.`,fact:'The s\xE9ance was staged: someone worked the knocks, the cold breath and the glowing hand from inside the "sealed" closet.'},breaker:{name:"Flickering breaker box",icon:hl,x:724,y:360,spot:"Servants' corridor",scene:"In the corridor the lights stutter and buzz. The staff say the Widow plays with them. The panel was modernised in 2019 and logs every switch. One breaker is down: 14, labelled STUDY SMOKE / CO ALARM.",scan:"emf",method:"EMF spike scan",result:"The flicker is mundane: a loose 1890s neutral wire arcing in a junction box. Nothing paranormal. Panel log: breaker 14 (STUDY SMOKE / CO ALARM, a hard-wired unit with no battery) switched OFF by hand at 01:24. The panel door has been wiped clean.",fact:"The study's carbon-monoxide alarm was deliberately switched off at 01:24, minutes before the chimney was blocked."},attic:{name:"Attic flue hatch",icon:il,x:762,y:128,spot:"Upper landing",curse:3,scene:"A pull-down ladder on the upper landing climbs to the attic, where every chimney in the house rises past the old water tank. Soot streaks the rungs. Wedged behind the tank: a soot-black bundle.",scan:"trace",method:"Fibre & fingerprint analysis",result:'The bundle is a pillowcase embroidered "H. EAST GUEST", stuffed with two cushions and soaked in soot. Only the East Guest Room was made up with that linen tonight. A clear thumbprint in soot on the third rung: Dr. Lionel Crane.',fact:"The flue was stuffed with a pillowcase from the East Guest Room, Crane's room. Crane's sooty thumbprint is on the attic ladder."}},wh=Object.keys(We),gl=[{id:"marsh",name:"Cordelia Marsh",role:"Spiritualist medium",look:{id:"marsh"},motive:"Vane was writing a book that would expose her as a fraud.",alibi:'Says she left the study with everyone at 23:30 and went to the Blue Room. "The spirits do not need me present."',qs:[{q:"What happened at the s\xE9ance?",a:"The Grey Widow came through. Knocks in the walls, the cold breath, her hand upon the glass. Ambrose wept like a child. She was warning him."},{q:"Did Vane believe in your gift?",a:"He tested me for months. Tied my wrists, sealed the closet with wax. I passed every test he set."},{q:"How did the s\xE9ance end?",a:`At twenty past eleven a whisper came that none of us made: "Look up." I did not make that sound, Detective. I swear it on my mother's grave.`,fact:'Marsh: at 23:20 a whisper of "Look up" ended the s\xE9ance. She swears she did not make it.',kind:"clue"}],present:{closet:{contra:!0,needsLab:!0,text:"Fine. The gloves, the line, the bellows. I worked the sitting from inside that closet and re-sealed the wax myself. Ambrose would have ruined me. But a fraud is not a murderer: I was out by half eleven like everyone. And since we're confessing, at dinner Lionel asked Agnes which flue the study fire shared. I thought it a strange thing to ask.",fact:"Marsh lied: she faked the s\xE9ance from inside the closet. She also heard Crane ask at dinner which flue the study fire used."},mirror:{needsLab:!0,text:"The hand was mine. Luminous paint. But I never broke that glass. It was whole when we filed out at half past eleven.",fact:"Marsh: the mirror was intact when the s\xE9ance ended at 23:30.",kind:"clue"},recorder:{needsLab:!0,text:`"Look up." That's her. That is the same voice from the s\xE9ance. Oh God, it's real. She was real all along.`}},dismiss:["The spirits find that object\u2026 uninteresting.","You are disturbing the veil for nothing.","I sense nothing from it. Truly nothing."],clearedBy:e=>e.contra.has("marsh")},{id:"julian",name:"Julian Vane",role:"Nephew & heir",look:{id:"julian"},motive:"Owes \xA390,000 in gambling debts. Inherits Hollowmere. His uncle refused him money tonight.",alibi:"Says he stormed out after dinner at 22:00, drove to the village, slept in his car and never came back.",qs:[{q:"Where were you tonight?",a:"Gone. Stormed out at ten, drove to the Crow & Lantern, slept in the car like a tramp. Didn't set foot in this mausoleum again."},{q:"What happened at dinner?",a:"I asked for money. He said no, in front of everyone. Then he and Lionel went off for brandy and came back looking like a funeral.",fact:"Julian: after dinner Vane and Crane spoke privately and both came back shaken.",kind:"clue"},{q:"Who inherits Hollowmere?",a:"Me. Mostly. Look, I know exactly how that sounds."}],present:{recorder:{contra:!0,needsLab:!0,text:"All right! I came back. Agnes let me in at the scullery and I knocked. He didn't answer. He never answered me. While I stood there something was scraping inside the wall, like rats in the chimney. Going out by the back stairs at about 01:40 I passed someone coming down from the attic landing. Tall. Quick on his feet. Too dark for a face. I thought it was a ghost.",fact:"Julian lied: he knocked on the study door at 01:35 with no answer, and at about 01:40 passed a tall, quick figure coming down from the attic.",unlocks:"crane:stairs"},journal:{needsLab:!0,text:"Forged? Lionel's tapes? The man built his whole career on those recordings. Uncle would have buried him."},hearth:{needsLab:!0,text:"Fumes? The chimney killed him? Then it's an accident, surely. Isn't it?"}},dismiss:["Riveting. Can I go now?","I don't know what that is and I don't care.","Ask my solicitor."],clearedBy:e=>e.contra.has("julian")},{id:"pell",name:"Agnes Pell",role:"Housekeeper, 41 years",look:{id:"pell"},motive:"Vane meant to sell Hollowmere in spring. She would lose the only home she has known.",alibi:"Says she banked the study fire low at 22:00 like every night, went to bed at midnight and heard nothing.",qs:[{q:"Where were you tonight?",a:"Lit the master's fire at ten and banked it low, same as every night for forty-one years. Abed by midnight. Heard nothing till I went up at half six."},{q:"Tell me about the Grey Widow.",a:"Lady Hollowmere. Her husband was found dead in that very study in 1887, fire out, door locked, same as the master. She has walked ever since. I lay the salt for her myself."},{q:"Who could reach the study chimney?",requires:"lab:hearth",a:"Every flue runs up past the water tank in the attic. You get there by the hatch on the upper landing. Dr. Crane asked me about it at dinner. Said his room was draughty.",fact:"Agnes: the study flue is reached from the attic hatch. Crane asked her about it at dinner.",kind:"clue"}],present:{hearth:{contra:!0,needsLab:!0,text:`I heaped it. A full scuttle at half eleven, because he asked me to. He wanted to sit up all night with her. When they said "fumes" I thought I'd killed him with my own hands. Forty-one years, and I killed him.`,fact:"Agnes lied: she heaped the fire at 23:30 on Vane's orders. But a big fire alone cannot kill when the flue is clear."},recorder:{needsLab:!0,text:"Yes. I let Master Julian in and out by the scullery. He never touched that door but to knock, and he was gone by quarter to two. I'll swear to it.",fact:"Agnes confirms Julian only knocked and left by 01:45.",kind:"clue"},circle:{text:"The salt held. She never crossed it. Whatever killed him, it wasn't her."}},dismiss:["I'm sure I couldn't say, sir.","That's not my place to know.","I keep the house. I don't keep secrets."],clearedBy:e=>e.contra.has("pell")},{id:"crane",name:"Dr. Lionel Crane",role:"Psychical researcher",look:{id:"crane"},motive:"None known. Vane's oldest friend and co-founder of the Hollowmere Society.",alibi:'Says he retired to the East Guest Room at 23:45 with a sleeping draught. "My knee can barely manage stairs at night, never mind ladders."',qs:[{q:"Where were you tonight?",a:"East Guest Room by quarter to twelve. A sleeping draught for this wretched knee. I can barely manage stairs after dark, never mind ladders."},{q:"How were things with Vane?",a:"Forty years of friendship. We were finishing a book together. We were on excellent terms."},{q:"What killed him, in your view?",a:"As a scientist? Heart failure brought on by terror. As the man who recorded the Hollowmere tapes? She took him. She takes the masters of this house."},{q:"Someone quick on the back stairs at 01:40?",requires:"crane:stairs",a:"Do I look sprightly to you? A shadow on the stairs, in this house? Take your pick of the dead.",fact:"Crane brushed off the figure seen coming down from the attic at 01:40.",kind:"clue"}],present:{journal:{contra:!0,needsLab:!0,text:"He\u2026 yes. He told me after dinner. He thought he'd found a splice in the 1998 tapes. A misunderstanding! I'd have cleared it up. It's hardly a reason to\u2026 I never laid a finger on him!",fact:'Crane lied about "excellent terms": Vane confronted him over forged recordings after dinner and meant to expose him at noon.'},attic:{contra:!0,needsLab:!0,text:"A pillowcase. A thumbprint. You think a man with my knee went up that\u2026 He was going to stand up at noon and call forty years of my life a forgery. I only meant\u2026 No. I knew what the smoke would do. I knew.",fact:`Crane "never left his room and can't climb", yet his pillowcase blocked the flue and his sooty thumbprint is on the attic ladder.`},recorder:{needsLab:!0,text:"Rats in a chimney and a whisper in the noise. Pareidolia, Detective. I of all people know how easily those voices are made."},hearth:{needsLab:!0,text:"Fumes. How tragic. A jackdaw's nest, most likely. The same thing happened in 1887, you know."},breaker:{needsLab:!0,text:"Old wiring. I wouldn't know a breaker from a bread knife."}},crack:`Crane's composure shatters. "Noon. He was going to say it at noon. I sat on the landing in the dark listening for him to stop coughing." He removes his glasses and asks for a solicitor.`,dismiss:["Fascinating, but irrelevant.","You're grasping at ectoplasm, Detective.","I've debunked better than that."
