<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const ACCENT = 0x4f8cff;

// --- A dark photographic studio used only as a reflection environment.
// Chrome reads as "luxury" when it reflects mostly darkness with a few crisp softboxes.
function studioEnv(renderer, { accent = true } = {}) {
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x050506);
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(30, 30, 30),
    new THREE.MeshBasicMaterial({ color: 0x121216, side: THREE.BackSide })
  );
  env.add(box);
  const strip = (w, h, color, intensity, pos, rot) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.position.set(...pos); m.rotation.set(...rot); env.add(m);
  };
  strip(14, 2.2, 0xffffff, 3.2, [0, 9, 2], [Math.PI / 2, 0, 0]);          // top key
  strip(1.4, 12, 0xffffff, 2.4, [-11, 1, 3], [0, Math.PI / 2, 0]);        // left rim strip
  strip(1.0, 10, 0xdfe6ff, 1.6, [10, 0, -4], [0, -Math.PI / 2.4, 0]);     // cool right strip
  strip(10, 0.6, 0xffffff, 1.2, [0, -6, 8], [-Math.PI / 3, 0, 0]);        // low fill
  strip(18, 9, 0x8a8f99, 0.55, [-2, 2, 13], [0, Math.PI, 0]);            // broad dim front fill (gives flat faces gradation)
  strip(6, 6, 0xffffff, 0.9, [-8, 6, 8], [0, Math.PI * 0.8, 0]);         // soft upper-left box
  if (accent) strip(0.7, 9, ACCENT, 2.2, [9, -1, 6], [0, -Math.PI / 1.6, 0]); // restrained blue kicker
  const pmrem = new THREE.PMREMGenerator(renderer);
  return pmrem.fromScene(env, 0.02).texture;
}

function chrome(tint = 0xffffff, roughness = 0.08) {
  return new THREE.MeshPhysicalMaterial({
    color: tint, metalness: 1, roughness, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.25,
  });
}

// --- The FUZAIL. monogram: a custom geometric "F" with the brand full-stop as a sphere.
function monogramF() {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  // Stem with a sheared top-right terminal: the signature cut of the F.
  s.moveTo(0, 0);
  s.lineTo(1.05, 0);
  s.lineTo(1.05, 2.45);
  s.lineTo(2.55, 2.45);
  s.lineTo(2.55, 3.35);
  s.lineTo(1.05, 3.35);
  s.lineTo(1.05, 4.05);
  s.lineTo(3.35, 4.05);
  s.lineTo(3.05, 5.0);   // angled cut
  s.lineTo(0, 5.0);
  s.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 1.1, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.14, bevelSegments: 10, curveSegments: 24,
  });
  geo.center();
  const f = new THREE.Mesh(geo, chrome());
  g.add(f);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.52, 96, 96), chrome(0xffffff, 0.04));
  dot.position.set(2.35, -2.0, 0.2);
  g.add(dot);
  g.rotation.set(-0.18, -0.55, 0.06);
  return g;
}

function layers() { // OptiSpaces: a platform of stacked spaces
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(new RoundedBoxGeometry(3.6 - i * 0.35, 0.22, 2.6 - i * 0.25, 8, 0.11), chrome(i === 3 ? 0xf2ffe0 : 0xffffff, 0.06 + i * 0.03));
    m.position.set(i * 0.12, i * 0.62 - 0.9, -i * 0.08);
    m.rotation.y = i * 0.07;
    g.add(m);
  }
  g.rotation.set(0.45, -0.6, 0);
  return g;
}

function globe() { // Spintly Global: sphere with orbits
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1.25, 128, 128), chrome(0xffffff, 0.05)));
  const rings = [[2.1, 0.035, 1.2, 0.2], [2.5, 0.025, -0.5, 0.9], [1.75, 0.045, 0.3, -1.1]];
  rings.forEach(([r, t, rx, rz]) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, t, 32, 256), chrome(0xffffff, 0.1));
    m.rotation.set(rx, 0, rz); g.add(m);
  });
  const moon = new THREE.Mesh(new THREE.SphereGeometry(0.16, 64, 64), chrome(0xffffff, 0.05));
  moon.position.set(2.05, 0.75, 0.6); g.add(moon);
  return g;
}

function linkedRings() { // Scypher: interlocked credentials
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.34, 64, 200), chrome());
  const b = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.34, 64, 200), chrome(0xffffff, 0.14));
  a.position.x = -0.62; b.position.x = 0.62; b.rotation.x = Math.PI / 2;
  g.add(a, b);
  g.rotation.set(0.35, -0.5, 0.25);
  return g;
}

function device() { // Spintly V3: an abstract handheld slab
  const g = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(2.1, 4.2, 0.32, 10, 0.32), chrome(0xffffff, 0.07));
  g.add(body);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.12, 96), chrome(0xffffff, 0.02));
  lens.rotation.x = Math.PI / 2; lens.position.set(0, 0.6, 0.2); g.add(lens);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.04, 32, 160), chrome(0xffffff, 0.04));
  ring.position.set(0, 0.6, 0.2); g.add(ring);
  g.rotation.set(0.15, -0.65, -0.18);
  return g;
}

function cards() { // Wallet: a fanned stack of credentials
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(new RoundedBoxGeometry(3.4, 2.15, 0.08, 8, 0.16), chrome(0xffffff, 0.05 + i * 0.04));
    m.position.set(i * 0.18, i * 0.32 - 0.5, -i * 0.25);
    m.rotation.z = -0.12 + i * 0.09;
    g.add(m);
  }
  g.rotation.set(-0.55, 0.5, 0.05);
  return g;
}

const builders = { monogram: monogramF, layers, globe, rings: linkedRings, device, cards };

window.renderObject = (name, size = 1400, fov = 30, dist = 11) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(size, size);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.innerHTML = '';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = studioEnv(renderer);
  const obj = builders[name]();
  scene.add(obj);
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(-4, 6, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(ACCENT, 0.6); rim.position.set(6, -2, -4); scene.add(rim);

  // Frame the object
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  obj.position.sub(sphere.center);
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, 100);
  const d = sphere.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2)) * 1.02;
  camera.position.set(0, 0, d);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
